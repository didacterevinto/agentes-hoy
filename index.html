const INFO = [{"id": "historia-aplazamientos", "fecha": "2026-11-04", "titulo": "Historia · Aplazamientos", "tag": "Historia", "html": "<p>La historia de ALBUS SA cuando no puede pagar a Hacienda, contada artículo por artículo y con todos sus casos.<\/p><h4>1 · La petición (65 LGT)<\/h4><p>ALBUS SA tiene que pagar a Hacienda, pero ahora mismo no tiene liquidez. No está arruinada: es un bache <b>transitorio<\/b>. El <b>65.1 LGT<\/b> le abre la puerta: cualquier deuda, esté en <b>periodo voluntario o ejecutivo<\/b>, se puede <b>aplazar<\/b> (pagar más tarde de una vez) o <b>fraccionar<\/b> (pagar en varios trozos), siempre que lo <b>pida<\/b> y su situación económico-financiera le impida pagar a tiempo.<\/p><p>En la puerta hay un portero con una lista de prohibidos, el <b>65.2<\/b>. No pasan: a) las deudas que se pagan con <b>efectos timbrados<\/b>; b) las <b>retenciones e ingresos a cuenta<\/b>, porque es dinero de los trabajadores que ALBUS solo guarda; c) en un concurso, los <b>créditos contra la masa<\/b>; d) las que vienen de <b>recuperar ayudas de Estado<\/b>; e) las de una <b>resolución firme desestimatoria<\/b> que ya estuvo suspendida mientras se recurría (ya disfrutó de su espera); f) los <b>tributos repercutidos, como el IVA<\/b>, salvo que demuestre que el cliente no se lo ha pagado; g) los <b>pagos fraccionados del Impuesto sobre Sociedades<\/b>. Si pide algo de la lista, la solicitud se <b>inadmite<\/b>.<\/p><p>El portero le recuerda además tres normas de la casa. <b>65.3<\/b>: lo aplazado hay que <b>garantizarlo<\/b> (art. 82). <b>65.4<\/b>: si garantiza toda la deuda con <b>aval de banco o SGR, o seguro de caución<\/b>, pagará el <b>interés legal<\/b>, el barato. <b>65.5<\/b>: si pide el aplazamiento en <b>voluntaria<\/b>, el reloj del periodo ejecutivo se para, pero el taxímetro de los <b>intereses sigue corriendo<\/b>. Si ya estaba en <b>ejecutiva<\/b>, puede pedirlo hasta que le notifiquen el <b>acuerdo de enajenación<\/b> de sus bienes embargados: el apremio sigue, pero no le venden nada hasta que se resuelva.<\/p><h4>2 · El portero rechaza (47 RGR)<\/h4><p>Además de la lista del 65.2, el <b>47 RGR<\/b> añade más casos de inadmisión: si la deuda es de una <b>autoliquidación que no ha presentado<\/b> (tiene que presentarla antes o junto con la solicitud); si la autoliquidación la presentó tras una <b>inspección suspendida por posible delito<\/b>, ya remitida al juez o al Ministerio Fiscal; o si la solicitud <b>repite una ya denegada<\/b> sin cambios sustanciales, para ganar tiempo.<\/p><p>La consecuencia es dura: la solicitud se tiene <b>por no presentada a todos los efectos<\/b>. Como si ALBUS nunca hubiera pedido nada: no frena el periodo ejecutivo. Contra la inadmisión cabe recurso de reposición o reclamación económico-administrativa.<\/p><h4>3 · Rellenar la solicitud (46 RGR)<\/h4><p>ALBUS pide a tiempo: en <b>voluntaria<\/b>, dentro del plazo voluntario de pago; en <b>ejecutiva<\/b>, hasta el acuerdo de enajenación. En la solicitud explica quién es, qué deuda quiere aplazar, <b>por qué<\/b> no puede pagar, <b>qué plazos<\/b> propone y <b>qué garantía<\/b> ofrece.<\/p><p>Los papeles van por capas. <b>46.3<\/b>, para todos: entre otros, el compromiso del banco de darle el aval, la representación y lo que justifique sus dificultades. <b>46.4<\/b>, si ofrece otra garantía: además, la prueba de que no consigue aval y la valoración de lo que ofrece. <b>46.5<\/b>, si pide dispensa: además, la prueba de que no tiene bienes, sus cuentas y un plan de viabilidad.<\/p><p>Si le falta algo, el <b>46.6<\/b>: Hacienda le requiere y le da <b>10 días<\/b>. Si <b>no contesta<\/b>, la solicitud se tiene <b>por no presentada y se archiva<\/b>. Si <b>contesta pero no lo arregla<\/b>, la solicitud <b>se deniega<\/b>.<\/p><h4>4 · La garantía (82 LGT y 48 RGR)<\/h4><p>Hacienda quiere estar tranquila. El <b>82.1 LGT<\/b> dice cuál es la garantía normal: <b>aval solidario de banco o SGR, o seguro de caución<\/b>. Si ALBUS demuestra que no lo consigue, o que conseguirlo hundiría su negocio, puede ofrecer <b>hipoteca, prenda, fianza personal y solidaria u otra suficiente<\/b>. Y también puede pedir que, en lugar de garantía, Hacienda le aplique <b>medidas cautelares en sustitución<\/b>.<\/p><p>Y si no puede garantizar nada, el <b>82.2<\/b> le ofrece la <b>dispensa total o parcial<\/b> en tres casos: a) deuda de <b>cuantía pequeña<\/b>, fijada por orden: <b>no más de 50.000 €<\/b> (Orden HFP/311/2023); b) <b>no tiene bienes suficientes<\/b> y ejecutar su patrimonio dañaría su <b>capacidad productiva y el empleo<\/b>, o causaría graves perjuicios a Hacienda; c) otros casos que diga la normativa.<\/p><p>¿Cuánto tiene que cubrir? El <b>48 RGR<\/b>: la <b>deuda + los intereses + un 25 %<\/b> de la suma. En un fraccionamiento puede dar una garantía para todo o una por cada fracción. El aval tiene que durar al menos <b>6 meses más<\/b> que el último vencimiento. ALBUS tiene <b>2 meses<\/b> desde que le conceden el aplazamiento para formalizar la garantía. Si no lo hace, la concesión <b>queda sin efecto<\/b>: si lo había pedido en voluntaria, se le exige por apremio con intereses y recargo; si lo pidió en ejecutiva, sigue el apremio.<\/p><h4>5 · El plan B y el plan C (49 y 50 RGR)<\/h4><p><b>Plan B, las medidas cautelares (49 RGR).<\/b> Si la garantía le sale <b>excesivamente cara<\/b> para lo que debe, ALBUS puede pedir medidas cautelares en sustitución, si tiene <b>devoluciones pendientes<\/b> de Hacienda o <b>bienes embargables<\/b>. Si el bien va a un registro, la medida solo se concede tras inscribirla. Se decide en el mismo acuerdo del aplazamiento y se deniega si esos bienes se pueden embargar sin más. Los costes los paga ALBUS. Si después no paga, la medida se convierte en definitiva antes de ejecutarla. Y si pidió el aplazamiento en voluntaria y hay riesgo de que no cobre (81 LGT), Hacienda puede adoptar medidas cautelares mientras tramita.<\/p><p><b>Plan C, la dispensa (50 RGR).<\/b> Si ALBUS dice que no tiene bienes, Hacienda lo <b>investiga<\/b>: si encuentra alguno, le requiere para que lo ofrezca en garantía. Mientras dure el aplazamiento, ALBUS debe <b>avisar si mejora<\/b> su patrimonio; si Hacienda se entera por su cuenta, le da <b>15 días<\/b> para alegar y le puede exigir garantía. Si ALBUS va a <b>repartir beneficios<\/b>, antes tiene que garantizar lo que debe. Y en un fraccionamiento con dispensa parcial, la garantía parcial responde de <b>todas<\/b> las fracciones.<\/p><h4>6 · Mientras espera la respuesta (51 RGR)<\/h4><p>Hacienda estudia el caso: si de verdad le falta liquidez, si puede generar ingresos y si la garantía basta. Mientras tanto, ALBUS tiene que <b>ir pagando los plazos que propuso<\/b>. Si el expediente es complicado, Hacienda le fija un <b>calendario provisional<\/b>. Si ALBUS incumple algún pago, Hacienda puede <b>denegar<\/b> la solicitud, porque sus dificultades ya no parecen transitorias sino <b>estructurales<\/b>.<\/p><h4>7 · La respuesta (52 RGR)<\/h4><p><b>Si se lo conceden<\/b>, la resolución fija la cuenta de domiciliación, los plazos y las condiciones, que pueden ser distintos de los que pidió. Los vencimientos caen siempre el <b>día 5 o 20<\/b> del mes. Puede ponerle condiciones: que Hacienda le compense las devoluciones que le deba, que esté al corriente de sus impuestos, o que si mezcla deudas en voluntaria y en ejecutiva las pague por separado, primero las ejecutivas. La notificación le avisa de qué pasa si no garantiza (48) o no paga (54) y le dice los intereses de cada plazo (53). Pedir luego que le cambien las condiciones no para el acuerdo.<\/p><p><b>Si se lo deniegan y lo pidió en voluntaria<\/b> (52.4), se le abre el plazo del <b>62.2 LGT<\/b> para pagar. Si paga, le cobran intereses desde que acabó el plazo voluntario hasta el día que paga. Si no paga, empieza el <b>periodo ejecutivo<\/b> y el apremio. <b>Si lo pidió en ejecutiva<\/b>, sigue el apremio.<\/p><p>Contra la denegación: <b>recurso de reposición o reclamación económico-administrativa<\/b>. Hacienda tiene <b>6 meses<\/b> para resolver; si no contesta, ALBUS puede entenderlo <b>denegado<\/b> para recurrir, o esperar.<\/p><h4>8 · La factura de la espera (53 RGR y 26.6 LGT)<\/h4><p>Esperar cuesta dinero. El <b>53 RGR<\/b>: se cobran intereses sobre la deuda aplazada desde el día siguiente al fin del plazo voluntario hasta el vencimiento concedido, y se pagan junto con la deuda. Si lo pidió en ejecutiva, el recargo no entra en la base. En un fraccionamiento, se calculan por separado para cada fracción. Si se lo deniegan, en voluntaria se aplica el 52.4 y en ejecutiva se liquidan cuando pague.<\/p><p>¿Qué interés? El <b>26.6 LGT<\/b>: el de demora, que es el <b>legal + 25 %<\/b>. Pero si toda la deuda está garantizada con <b>aval bancario, SGR o seguro de caución<\/b>, solo el <b>interés legal<\/b>.<\/p><h4>9 · Si no cumple (54 RGR y 168 LGT)<\/h4><p><b>Aplazamiento pedido en voluntaria<\/b> que no paga: al día siguiente del vencimiento empieza el <b>periodo ejecutivo<\/b>. Le exigen la deuda, los <b>intereses y el recargo<\/b> del periodo ejecutivo. Si tampoco paga en los plazos del <b>62.5<\/b>, se <b>ejecuta la garantía<\/b> (168 LGT); si no hay o no llega, sigue el apremio.<\/p><p><b>Aplazamiento pedido en ejecutiva<\/b>: se ejecuta la garantía directamente y, si no llega, sigue el apremio.<\/p><p><b>Fraccionamiento<\/b>: si falla una fracción, primero le reclaman <b>solo esa<\/b>, con sus intereses y el recargo. Si tampoco la paga en plazo, <b>vencen todas las demás<\/b> y Hacienda va a por todo, con la garantía.<\/p><p><b>La historia en una frase:<\/b> ALBUS pide (65), pasa el portero (65.2 y 47), rellena los papeles (46), garantiza (82 y 48) o busca el plan B o C (49 y 50), paga mientras espera (51), recibe la respuesta (52), paga los intereses (53 y 26.6) y, si falla, entra en ejecutiva y le ejecutan la garantía (54 y 168).<\/p><p class=\"inota\">Verificado con el texto de los arts. 65 y 82 LGT y 47, 49, 50, 51, 52 y 53 RGR. Los detalles de los arts. 46, 48 y 54 son como los recuerdo; contrástalos con tu texto.<\/p>"}, {"id": "chuleta-ejecutivo", "fecha": "2026-11-02", "titulo": "Chuleta · Periodo ejecutivo", "tag": "Chuleta de bloque", "html": "<p>Este bloque es <b>núcleo puro<\/b>: plazos, recargos y providencia de apremio salen en todos los exámenes oficiales. Lo mínimo: <b>número + de qué va + dato clave<\/b>.<\/p><h4>Memorizar mínimo<\/h4><div class=\"itab\"><table><thead><tr><th>Artículo<\/th><th>De qué va<\/th><th>Dato clave<\/th><\/tr><\/thead><tbody><tr><td><b>62.2 LGT<\/b><\/td><td>Plazo voluntario de las liquidaciones<\/td><td>Notificada del 1 al 15 → hasta el <b>20 del mes siguiente<\/b>. Del 16 al último → hasta el <b>5 del segundo mes siguiente<\/b> (o hábil posterior)<\/td><\/tr><tr><td><b>62.5 LGT<\/b><\/td><td>Plazo de la providencia de apremio<\/td><td>Notificada del 1 al 15 → hasta el <b>20 de ese mes<\/b>. Del 16 al último → hasta el <b>5 del mes siguiente<\/b><\/td><\/tr><tr><td><b>161 LGT<\/b><\/td><td>Cuándo empieza el periodo ejecutivo<\/td><td>Liquidación: al día siguiente de acabar el 62.2. Autoliquidación sin ingreso: al acabar el plazo (o al presentarla, si es fuera de plazo). Pedir aplazamiento o compensación en voluntaria lo impide<\/td><\/tr><tr><td><b>28 LGT<\/b><\/td><td>Recargos del periodo ejecutivo<\/td><td><b>5 %<\/b> ejecutivo: pagas todo antes de la providencia · <b>10 %<\/b> apremio reducido: pagas todo + el recargo en el plazo del 62.5 · <b>20 %<\/b> apremio ordinario: el resto. Se calculan sobre <b>toda<\/b> la deuda no ingresada en voluntaria<\/td><\/tr><tr><td><b>28.5 LGT<\/b><\/td><td>Recargos e intereses<\/td><td>Con el 5 % y el 10 % <b>no<\/b> hay intereses de demora. El 20 % <b>sí<\/b> lleva intereses<\/td><\/tr><tr><td><b>26 LGT<\/b><\/td><td>Intereses de demora<\/td><td>Desde el día siguiente al fin de la voluntaria hasta el pago (solo con el 20 %)<\/td><\/tr><tr><td><b>167 LGT<\/b><\/td><td>Providencia de apremio<\/td><td><b>167.3: motivos tasados de oposición<\/b> → a) extinción o prescripción · b) aplazamiento, fraccionamiento o compensación en voluntaria y otras causas de suspensión · c) falta de notificación de la liquidación · d) anulación de la liquidación · e) error que impida identificar al deudor o la deuda. <b>Ha salido en los 6 exámenes<\/b><\/td><\/tr><tr><td><b>224 LGT<\/b><\/td><td>Suspensión en reposición<\/td><td>Automática solo aportando garantía: depósito, aval o fianza de entidad, o fianza personal y solidaria. Sin garantía, solo por error aritmético, material o de hecho. Si no: no suspende y la solicitud se archiva (art. 25 RGRVA)<\/td><\/tr><tr><td><b>212.3 LGT<\/b><\/td><td>Suspensión de sanciones<\/td><td>La sanción recurrida se suspende sola. Recurrir <b>la liquidación<\/b> no suspende <b>la sanción<\/b><\/td><\/tr><tr><td><b>156.3 LGT<\/b><\/td><td>Acta de conformidad<\/td><td>La liquidación se entiende dictada y notificada al mes del acta (desarrollo: 187.3 RGAT) → plazo del 62.2<\/td><\/tr><tr><td><b>43.2 Ley 39/2015<\/b><\/td><td>Notificación electrónica<\/td><td>Si no accedes, se entiende rechazada a los <b>10 días naturales<\/b> de la puesta a disposición; el acceso posterior no cambia nada<\/td><\/tr><\/tbody><\/table><\/div><h4>Ideas que no se te pueden escapar<\/h4><ul><li><b>Siempre el mismo orden:<\/b> ¿cuándo acaba la voluntaria? (62.2) → ¿se ha notificado ya la providencia? → ¿paga dentro del 62.5? → recargo (28) → ¿intereses? (28.5 y 26).<\/li><li><b>Para el 5 % y el 10 % hay que pagarlo todo.<\/b> Si paga solo parte, aunque sea antes de la providencia, no hay 5 %. Y si paga la cuota pero no el 10 %, se va al 20 %.<\/li><li><b>El recargo va sobre toda la deuda no ingresada en voluntaria<\/b> (cuota + intereses de la liquidación), no solo sobre lo que falta.<\/li><li><b>Recurrir la providencia solo vale por los motivos del 167.3.<\/b> Si el motivo no está en la lista, se desestima.<\/li><li><b>Calcula las fechas en el examen:<\/b> siempre te dan una fecha de notificación y casi siempre te preguntan cuándo acaba un plazo.<\/li><\/ul><h4>Qué artículos se repiten (Morón × exámenes oficiales)<\/h4><div class=\"itab\"><table><thead><tr><th>Artículo<\/th><th>Morón (de 11)<\/th><th>Oficiales (de 6)<\/th><th>Veredicto<\/th><\/tr><\/thead><tbody><tr><td>167 y 167.3 LGT<\/td><td>2<\/td><td>6<\/td><td>Seguro (el que más)<\/td><\/tr><tr><td>28 LGT<\/td><td>6<\/td><td>4<\/td><td>Seguro<\/td><\/tr><tr><td>62.5 LGT<\/td><td>4<\/td><td>4<\/td><td>Seguro<\/td><\/tr><tr><td>161 LGT<\/td><td>2 (implícito en casi todos)<\/td><td>4<\/td><td>Seguro<\/td><\/tr><tr><td>62.2 LGT<\/td><td>6<\/td><td>3<\/td><td>Seguro<\/td><\/tr><tr><td>26 LGT<\/td><td>5<\/td><td>muchos<\/td><td>Seguro<\/td><\/tr><tr><td>222-225 y 224 LGT<\/td><td>1<\/td><td>muchos (reposición)<\/td><td>Seguro<\/td><\/tr><tr><td>233 LGT y suspensión en el TEA<\/td><td>1<\/td><td>3, a la baja<\/td><td>Apoyo<\/td><\/tr><tr><td>165 LGT (suspensión del apremio)<\/td><td>0<\/td><td>3<\/td><td>Apoyo: léelo<\/td><\/tr><tr><td>212.3 LGT<\/td><td>1<\/td><td>1<\/td><td>Apoyo<\/td><\/tr><tr><td>156.3 LGT<\/td><td>1<\/td><td>1<\/td><td>Apoyo<\/td><\/tr><tr><td>43.2 Ley 39/2015<\/td><td>1 (Morón no lo cita)<\/td><td>frecuente<\/td><td>Seguro<\/td><\/tr><tr><td>33 RGR, 38 RGR, 62.2 RIRPF, 52.4 RGR<\/td><td>1 cada uno<\/td><td>0<\/td><td>Solo Morón: entender<\/td><\/tr><\/tbody><\/table><\/div><h4>Dónde Morón se queda corto o se equivoca<\/h4><ul><li><b>Ej. 1a:<\/b> cita «arts. 62.2 y 104 LGT». El 104 es el plazo para resolver procedimientos y aquí no pinta nada. Cita <b>62.2 LGT y 52.4 RGR<\/b> (denegación del aplazamiento pedido en voluntaria) y el 26 LGT para los intereses.<\/li><li><b>Ej. 3 b) y d):<\/b> la respuesta corta no cita el 28. Añade <b>28.2<\/b> (5 %) y <b>28.3<\/b> (10 %).<\/li><li><b>Ej. 4 c):<\/b> dice intereses «sobre 21.000 € desde el 6 de noviembre». Los intereses corren sobre lo que va quedando pendiente; los 20.000 € pagados el 7 dejan de generarlos ese día. El recargo sí va sobre 21.000 €.<\/li><li><b>Ej. 6 a):<\/b> añade el <b>156.3 LGT<\/b> junto al 187.3 RGAT.<\/li><li><b>Ej. 6 b):<\/b> no cita nada. Es el <b>43.2 Ley 39/2015<\/b> (10 días naturales), que en los oficiales sale mucho.<\/li><li><b>Ej. 7 c):<\/b> añade el <b>167.3 LGT<\/b>: que se recurriera la liquidación no es un motivo de oposición válido contra la providencia de la sanción. Más el 212.3.<\/li><li><b>Ej. 8:<\/b> lo de que se emite una «diligencia de embargo» por lo que paga el tercero no lo he podido confirmar. En el examen, con el 33 RGR basta.<\/li><li><b>Ej. 10:<\/b> la respuesta corta no cita el <b>224 LGT<\/b>, que es el artículo principal (las garantías para suspender en reposición). Ponlo antes que el 25 RGRVA.<\/li><\/ul><h4>Respuesta tipo (ej. 5: providencia notificada el 6 de abril, 1.000 € + 200 €)<\/h4><p>a) Paga 1.100 € el 19-4, dentro del plazo del 62.5 (hasta el 20-4): recargo de apremio reducido del 10 %, 100 €, sin intereses (arts. 62.5 y 28.3 y 28.5 LGT).<br>b) Paga el 28-4, fuera de plazo: recargo del 20 %, 200 €, más intereses desde el fin de la voluntaria (arts. 28.4 y 26 LGT).<br>c) Paga solo los 1.000 € de cuota: al no ingresar también el recargo reducido, procede el 20 % (200 €), que podrá embargarse, más intereses (art. 28 LGT).<\/p><h4>Ejercicios<\/h4><p><b>Clave:<\/b> 1, 3, 4, 5, 6, 7, 9 y 10.<br><b>Arrastre:<\/b> 2, 8 y 11.<\/p>"}, {"id": "chuleta-aplazamientos", "fecha": "2026-11-02", "titulo": "Chuleta · Aplazamientos", "tag": "Chuleta de bloque", "html": "<p>Lo mínimo que tienes que llevar en la cabeza antes de hacer los ejercicios: <b>número + de qué va + dato clave<\/b>. No el texto literal.<\/p><h4>Esquema por artículo: lo que hay que saber sí o sí<\/h4><p class=\"inota\">Se aprende con la hoja en blanco: lees el esquema de un artículo, lo tapas, escribes los puntos de memoria y comparas. Lo que falte, otra vez. No hace falta el texto literal, pero sí las <b>palabras clave<\/b> (en negrita).<\/p><div class=\"q\"><b>65 LGT · Qué se puede aplazar<\/b><ul style=\"margin:4px 0 0\"><li>Deudas en <b>voluntaria o ejecutiva<\/b>, previa solicitud, cuando la situación económico-financiera impida <b>transitoriamente<\/b> pagar.<\/li><li><b>65.2 · No aplazables<\/b> → la solicitud se <b>inadmite<\/b>: <b>b) retenciones e ingresos a cuenta<\/b>; <b>f) tributos repercutidos (IVA)<\/b>, salvo que se justifique que no se han cobrado (en deudas de hasta 50.000 € la AEAT lo presume: Instrucción 2/2023 de Recaudación, criterio interno, no norma); <b>g) pagos fraccionados del IS<\/b>. Sin letra: efectos timbrados, créditos contra la masa en concurso, recuperación de ayudas de Estado y resoluciones firmes desestimatorias que estuvieron suspendidas.<\/li><li><b>65.3<\/b>: las deudas aplazadas se garantizan (art. 82).<\/li><li><b>65.4<\/b>: si toda la deuda se garantiza con <b>aval<\/b> de entidad de crédito o SGR, o seguro de caución → <b>interés legal<\/b>, no de demora.<\/li><li><b>65.5<\/b>: pedirlo en voluntaria <b>impide el periodo ejecutivo<\/b>, pero <b>sí corren intereses<\/b>. En ejecutiva se puede pedir <b>hasta la notificación del acuerdo de enajenación<\/b>: el apremio sigue, pero no se enajena hasta resolver.<\/li><\/ul><\/div><div class=\"q\"><b>82 LGT · Garantías<\/b><ul style=\"margin:4px 0 0\"><li><b>Regla (82.1)<\/b>: aval solidario de entidad de crédito o SGR, o certificado de seguro de caución.<\/li><li>Si no se consigue aval: <b>otras garantías<\/b> → <b>hipoteca, prenda, fianza personal y solidaria u otra suficiente<\/b>.<\/li><li>El obligado puede pedir <b>medidas cautelares en sustitución<\/b> de la garantía.<\/li><li><b>82.2 · Dispensa total o parcial<\/b>: <b>a)<\/b> deuda de cuantía inferior a la que fije la normativa → <b>no superior a 50.000 €<\/b> (Orden HFP/311/2023); <b>b)<\/b> <b>carece de bienes suficientes<\/b> y ejecutar su patrimonio afectaría sustancialmente a la <b>capacidad productiva y al empleo<\/b>, o causaría graves quebrantos a Hacienda.<\/li><\/ul><\/div><div class=\"q\"><b>46 RGR · La solicitud<\/b><ul style=\"margin:4px 0 0\"><li>Contiene: identificación, deuda, <b>causas<\/b> de la dificultad, <b>plazos<\/b> que pide y <b>garantía<\/b> que ofrece.<\/li><li>Documentos: <b>46.3<\/b> para todos · <b>46.4<\/b> si ofrece otra garantía (justificar que no consigue aval + valoración) · <b>46.5<\/b> si pide dispensa (acreditar falta de bienes, balances, plan de viabilidad).<\/li><li><b>46.6<\/b>: si falta algo, requerimiento con <b>10 días<\/b>. No contesta → <b>no presentada y se archiva<\/b>. Contesta pero no subsana → <b>se deniega<\/b>.<\/li><\/ul><\/div><div class=\"q\"><b>47 RGR · Inadmisión<\/b><ul style=\"margin:4px 0 0\"><li>Si la deuda no es aplazable (65.2) o repite una solicitud ya denegada sin datos nuevos → se inadmite y se tiene <b>por no presentada<\/b>: como si nunca se hubiese pedido.<\/li><\/ul><\/div><div class=\"q\"><b>48 RGR · La garantía<\/b><ul style=\"margin:4px 0 0\"><li>Cubre <b>deuda + intereses de demora + 25 %<\/b> de la suma de ambos.<\/li><li>El aval debe durar al menos <b>6 meses más<\/b> que el último vencimiento garantizado.<\/li><li>Se formaliza en <b>2 meses<\/b> desde que se notifica la concesión; si no, la concesión <b>queda sin efecto<\/b>.<\/li><\/ul><\/div><div class=\"q\"><b>49 y 50 RGR<\/b><ul style=\"margin:4px 0 0\"><li><b>49<\/b>: <b>medidas cautelares en sustitución<\/b> de la garantía cuando esta es excesivamente onerosa (82.1). Las otras garantías (hipoteca, prenda…) salen del 82.1 LGT y su documentación del 46.4.<\/li><li><b>50<\/b>: desarrolla la <b>dispensa por falta de bienes<\/b> (82.2.b).<\/li><\/ul><\/div><div class=\"q\"><b>52.4 y 53 RGR · Solo la idea<\/b><ul style=\"margin:4px 0 0\"><li><b>52.4<\/b>: si se deniega un aplazamiento pedido en voluntaria → paga en los plazos del <b>62.2 LGT<\/b> con intereses; si no paga, periodo ejecutivo. Si se pidió en ejecutiva, sigue el apremio.<\/li><li><b>53<\/b>: cómo se calculan los intereses del aplazamiento. Basta con saber que existe.<\/li><\/ul><\/div><div class=\"q\"><b>54 RGR · Incumplimiento<\/b><ul style=\"margin:4px 0 0\"><li>Aplazamiento pedido en <b>voluntaria<\/b> e incumplido → <b>periodo ejecutivo<\/b>: deuda + intereses + recargo del periodo ejecutivo.<\/li><li>Pedido en <b>ejecutiva<\/b> → <b>continúa el apremio<\/b>.<\/li><li>Si hay garantía, se <b>ejecuta<\/b> (168 LGT).<\/li><\/ul><\/div><h4>Resumen en una línea por artículo<\/h4><div class=\"itab\"><table><thead><tr><th>Artículo<\/th><th>De qué va<\/th><th>Dato clave<\/th><\/tr><\/thead><tbody><tr><td><b>65 LGT<\/b><\/td><td>Qué deudas se pueden aplazar<\/td><td>Retenciones e ingresos a cuenta no; IVA solo si no se ha cobrado (→ si no, inadmisión: art. 47 RGR, se tiene por no presentada). En ejecutiva, solo hasta notificar el acuerdo de enajenación (65.5)<\/td><\/tr><tr><td><b>46 RGR<\/b><\/td><td>Solicitud y documentos<\/td><td>46.3 para todos · 46.4 si ofreces otra garantía · 46.5 si pides dispensa. <b>10 días<\/b> para subsanar o se archiva (46.6)<\/td><\/tr><tr><td><b>47 RGR<\/b><\/td><td>Inadmisión<\/td><td>La solicitud se tiene por <b>no presentada<\/b><\/td><\/tr><tr><td><b>48 RGR<\/b><\/td><td>La garantía<\/td><td>Deuda + intereses + <b>25 %<\/b> · aval <b>6 meses<\/b> más allá del último vencimiento · formalizar en <b>2 meses<\/b> o la concesión queda sin efecto<\/td><\/tr><tr><td><b>49 RGR<\/b><\/td><td>Medidas cautelares en sustitución<\/td><td>Si la garantía es excesivamente onerosa y tiene devoluciones pendientes o bienes embargables<\/td><\/tr><tr><td><b>50 RGR<\/b><\/td><td>Dispensa por falta de bienes<\/td><td>Desarrolla el 82.2.b LGT<\/td><\/tr><tr><td><b>54 RGR<\/b><\/td><td>Incumplimiento<\/td><td>Apremio y ejecución de la garantía. Fraccionamiento pedido en voluntaria → recargo del <b>10 %<\/b> (art. 28), no del 5 %<\/td><\/tr><tr><td><b>82 LGT<\/b><\/td><td>Las opciones de garantía<\/td><td>82.1 otras garantías y medidas cautelares · 82.2.a por cuantía · 82.2.b por falta de bienes<\/td><\/tr><tr><td><b>Orden HFP/311/2023<\/b><\/td><td>El límite sin garantía<\/td><td>Importe conjunto <b>no superior a 50.000 €<\/b> → no se exige garantía (no hay que pedir dispensa)<\/td><\/tr><tr><td><b>65.4 y 26.6 LGT<\/b><\/td><td>Interés con aval<\/td><td>Con aval bancario se paga <b>interés legal<\/b>, no de demora<\/td><\/tr><tr><td><b>168 LGT<\/b><\/td><td>Ejecución de garantías<\/td><td>Lo que pasa después del 54. Morón no lo usa, los oficiales sí (2 veces)<\/td><\/tr><\/tbody><\/table><\/div><h4>Ideas que no se te pueden escapar<\/h4><ul><li><b>El 82 LGT dice qué puede hacer la empresa; el 46 RGR, qué documentos aporta para hacerlo.<\/b> En el examen, los dos juntos.<\/li><li><b>La LGT pone la regla y el RGR el procedimiento.<\/b> Cuando veas un artículo de la LGT, busca el del RGR que lo desarrolla.<\/li><li><b>Los 50.000 € no están en ningún artículo:<\/b> el 82.2.a LGT dice «cuantía que fije la normativa» y la Orden HFP/311/2023 pone la cifra. Escribe «no superior a 50.000 €».<\/li><li><b>Se dispensa la garantía, nunca la deuda.<\/b><\/li><li><b>Si el enunciado da una cifra, coméntala.<\/b> Con 60.000 €: «no cabe la exención por cuantía al superar 50.000 €».<\/li><\/ul><h4>Respuesta tipo (caso ALBUS: no consigue aval, deuda de 60.000 €)<\/h4><p>a) Aportar otras garantías (hipoteca, prenda, fianza personal y solidaria u otra suficiente), justificando la imposibilidad de obtener aval (art. 82.1 LGT; 46.4 RGR).<br>b) Solicitar medidas cautelares en sustitución (art. 82.1 LGT; 49 RGR).<br>c) Solicitar dispensa total o parcial de garantías por carecer de bienes suficientes (art. 82.2.b LGT; 50 RGR). No cabe la exención por cuantía al superar 50.000 €.<\/p><h4>Qué artículos se repiten (Morón × exámenes oficiales)<\/h4><div class=\"itab\"><table><thead><tr><th>Artículo<\/th><th>Morón (de 21)<\/th><th>Oficiales (de 6)<\/th><th>Veredicto<\/th><\/tr><\/thead><tbody><tr><td>65 LGT<\/td><td>7<\/td><td>3<\/td><td>Seguro<\/td><\/tr><tr><td>46 RGR<\/td><td>6<\/td><td>2<\/td><td>Seguro<\/td><\/tr><tr><td>48 RGR<\/td><td>6<\/td><td>2<\/td><td>Seguro<\/td><\/tr><tr><td>54 RGR<\/td><td>4<\/td><td>3<\/td><td>Seguro<\/td><\/tr><tr><td>47 RGR<\/td><td>2<\/td><td>2<\/td><td>Seguro<\/td><\/tr><tr><td>82 LGT<\/td><td>7<\/td><td>1<\/td><td>Muy probable<\/td><\/tr><tr><td>65.4 y 26.6 LGT<\/td><td>5<\/td><td>1<\/td><td>Muy probable<\/td><\/tr><tr><td>51, 52 y 53 RGR<\/td><td>4–5<\/td><td>0<\/td><td>Solo Morón: entender, no memorizar. Del 52.4, la idea: si te deniegan en voluntaria, pagas en los plazos del 62.2<\/td><\/tr><tr><td>49 y 50 RGR<\/td><td>2 y 1<\/td><td>1<\/td><td>Apoyo<\/td><\/tr><tr><td>168 LGT<\/td><td>0<\/td><td>2<\/td><td>Solo oficiales: léelo con el 54<\/td><\/tr><tr><td>44, 55-56 RGR; 27, 71-73, 156.3 LGT; Orden EHA/1658/2009<\/td><td>1–2<\/td><td>0<\/td><td>Ignorar<\/td><\/tr><\/tbody><\/table><\/div><h4>Ejercicios<\/h4><p><b>Clave (bloque concentrado):<\/b> 1, 2, 3, 5, 6, 10, 11, 13, 18 y 19.<br><b>Arrastre (2-3 por sesión en las semanas siguientes):<\/b> 4, 7, 8, 9, 12, 14, 15, 16, 17, 20 y 21.<\/p>"}, {"id": "metodo-ejercicios", "fecha": "2026-11-02", "titulo": "Cómo afrontar los ejercicios de Morón", "tag": "Método", "html": "<p>Los ejercicios <b>son<\/b> la forma de memorizar. Leer y releer da sensación de saber, pero no fija; intentar sacarlo de la cabeza y fallar, sí.<\/p><h4>Qué necesitas de cada artículo (por orden de importancia)<\/h4><ol><li><b>La idea:<\/b> qué regla aplica. «Si el aval es de un banco, se paga interés legal».<\/li><li><b>El número:<\/b> 26.6 LGT.<\/li><li><b>Los datos exactos:<\/b> cifras, plazos y porcentajes (50.000 €, 25 %, 6 meses, 2 meses).<\/li><\/ol><h4>Cómo hacer cada ejercicio<\/h4><ol><li><b>En frío:<\/b> lees el enunciado y escribes la respuesta como en el examen, formato corto, sin mirar nada. Aunque esté incompleta.<\/li><li><b>Si no te sale el número,<\/b> pon la idea y la ley («conforme a la LGT…»). Suele puntuar algo; en blanco, nada.<\/li><li><b>Abres la ley y corriges,<\/b> completando lo que faltaba.<\/li><li><b>Apuntas qué fallaste<\/b> (idea, número o dato) en Práctica. Vuelve solo a los 3, 7 y 14 días.<\/li><\/ol><h4>Formato de respuesta en el examen<\/h4><p>Hay poco tiempo: <b>opción + ejemplo entre paréntesis + artículo<\/b>, como Morón. Siempre comentas la cifra del enunciado. Si te sobra tiempo, un artículo más por opción; si vas justo, basta con el principal.<\/p><h4>Antes de empezar un bloque<\/h4><p>Lee el tema y los artículos núcleo y memoriza solo la chuleta del bloque (una línea por artículo: número, de qué va y dato clave). Lo demás se fija haciendo ejercicios.<\/p>"}, {"id": "plan-nuevo", "fecha": "2026-11-02", "titulo": "Nuevo plan: Morón como columna, fechas y fases", "tag": "Plan", "html": "<h4>Fechas probables<\/h4><div class=\"itab\"><table><thead><tr><th>Convocatoria (BOE)<\/th><th>Test<\/th><th>Práctico<\/th><th>De convocatoria a test<\/th><\/tr><\/thead><tbody><tr><td>08/01/2024<\/td><td>20/04/2024<\/td><td>01/06/2024<\/td><td>~3,5 meses<\/td><\/tr><tr><td>28/12/2024<\/td><td>05/04/2025<\/td><td>24/05/2025<\/td><td>~3 meses<\/td><\/tr><tr><td>30/12/2025<\/td><td>21/03/2026<\/td><td>18/04/2026<\/td><td>~2,7 meses<\/td><\/tr><\/tbody><\/table><\/div><p>La de 2026 (1.000 plazas) tiene que publicarse antes del 31 de diciembre. Estimación: <b>convocatoria a finales de diciembre de 2026, test entre mediados de marzo y principios de abril de 2027, práctico 4-7 semanas después.<\/b> Entre test y práctico apenas hay un mes: <b>el práctico tiene que estar preparado antes del test.<\/b><\/p><h4>Sesión tipo (día de trabajo, 3 h)<\/h4><ol><li><b>~15' de arrastre:<\/b> 2-3 ejercicios de Morón de bloques anteriores y lo que devuelvan las recuperaciones de tus fallos. Es el único repaso.<\/li><li><b>~2 h de bloque nuevo:<\/b> tema y artículos núcleo, y ejercicios.<\/li><li><b>30-40' de test<\/b> en OpositaTest.<\/li><li><b>Al final, registras los fallos en Práctica.<\/b><\/li><\/ol><p>Días libres (5 h): lo mismo con dos bloques de Morón o un simulacro de test. Los arrastres del calendario antiguo desaparecen; fichas y juego, opcionales.<\/p><h4>Fases<\/h4><div class=\"itab\"><table><thead><tr><th>Fase<\/th><th>Fechas aprox.<\/th><th>En qué te centras<\/th><\/tr><\/thead><tbody><tr><td><b>A · Núcleo de Morón<\/b><\/td><td>Hoy → finales de diciembre<\/td><td>La prioridad 1 entera, test diario ligero<\/td><\/tr><tr><td><b>B · IRPF y test al alza<\/b><\/td><td>Enero y febrero<\/td><td>Bloques de IRPF y prioridad 3. Más horas de test<\/td><\/tr><tr><td><b>C · Test<\/b><\/td><td>Marzo → examen<\/td><td>Test y simulacros. De Morón, solo arrastre y fallos<\/td><\/tr><tr><td><b>D · Práctico<\/b><\/td><td>Entre test y práctico<\/td><td>Exámenes oficiales completos en tiempo real y repaso de fallos<\/td><\/tr><\/tbody><\/table><\/div><p><b>Las fechas de cada bloque son límites, no citas.<\/b> Si acabas antes, pasas al siguiente. Solo hay que reajustar si te desvías más de una semana.<\/p>"}, {"id": "moron-prioridades", "fecha": "2026-11-02", "titulo": "Qué ejercicios de Morón priorizar para el 2.º ejercicio", "tag": "Morón", "html": "<p>Cruzando el índice de Morón con el análisis de los exámenes oficiales del 2.º ejercicio: la <b>LGT es más del 50% del examen<\/b> (recaudación, sanciones y plazos de procedimiento sobre todo). <b>IRPF<\/b> sale como un enunciado o supuesto en todos los exámenes analizados, y siempre de los mismos bloques. <b>IVA, IS y Aduanas<\/b> tienen como mucho una pregunta cada uno.<\/p><h4>Prioridad 1: el núcleo (unas 160 páginas)<\/h4><div class=\"itab\"><table><thead><tr><th>Sección de Morón<\/th><th>Págs.<\/th><th>Por qué<\/th><\/tr><\/thead><tbody><tr><td><b>Recaudación<\/b>: aplazamientos, periodo ejecutivo, embargos, tipos de embargo<\/td><td>185–224<\/td><td>Sale todos los años (65, 161, 167, 169-170). Acaba el bloque entero.<\/td><\/tr><tr><td><b>Responsables y sucesores<\/b><\/td><td>238–252<\/td><td>176 y 177, salen como apartado propio<\/td><\/tr><tr><td><b>Sanciones<\/b><\/td><td>252–288<\/td><td>Lo más preguntado: 188 (9 veces), 191 (8), procedimiento sancionador<\/td><\/tr><tr><td><b>Prestaciones accesorias<\/b><\/td><td>4–25<\/td><td>Art. 26 intereses (9 veces), 27 y 28 recargos. Aparecen en casi todo<\/td><\/tr><tr><td><b>Recursos<\/b><\/td><td>288–310<\/td><td>Reposición 222-225 (7 veces)<\/td><\/tr><tr><td><b>Notificaciones<\/b><\/td><td>67–71<\/td><td>109-112 (8 veces). Pocas páginas, mucho rendimiento<\/td><\/tr><tr><td><b>Duración de los procedimientos<\/b> + <b>duración del procedimiento inspector<\/b><\/td><td>100–103 y 149–159<\/td><td>104 y 150, los plazos que siempre caen<\/td><\/tr><tr><td><b>Actas de inspección<\/b><\/td><td>167–179<\/td><td>156, vuelve casi todos los años<\/td><\/tr><\/tbody><\/table><\/div><h4>Prioridad 2: IRPF, solo estos bloques<\/h4><p>Rendimientos del trabajo, capital inmobiliario e imputación de rentas (335–354), actividades económicas (354–356), ganancias patrimoniales (356–363), unidad familiar y mínimos (377–388) y deducciones (394–397). Son justo los artículos que se repiten: 17-20, 22-23 y 85, 27-30, 33-36, 58-61 y 81-81 bis. El capital mobiliario (319–335) lo dejaría para el final: 16 páginas para algo que en los oficiales salió una sola vez.<\/p><h4>Prioridad 3: gestión y algo de procedimiento general<\/h4><p>Comprobación limitada (103–119), prescripción (29–35), liquidaciones, autoliquidaciones y rectificación (71–87), tasación pericial (119–124) y depósito y enajenación (224–235). Salen, pero menos.<\/p><h4>Última: solo si te sobra tiempo<\/h4><ul><li><b>Lo formal del procedimiento general<\/b>: domicilio, representación, obligaciones formales, facturas, NIF, presunciones, declaraciones informativas y obtención de información.<\/li><li><b>De inspección<\/b>: comunicación de inicio, facultades y tramitación.<\/li><li><b>Otros temas sueltos<\/b>: tercerías y extinción de la deuda.<\/li><li><b>Impuestos menores<\/b>: de IS, IVA y Aduanas, dos o tres ejercicios de cada uno para no ir en blanco (en IS, base imponible; en IVA, deducciones y exenciones). Tienes que poder sacar la pregunta que caiga, no dominarlos.<\/li><\/ul><h4>Resumen y orden<\/h4><p>Con un tercio del libro (prioridad 1) cubres la mayor parte de lo que se ha preguntado. Orden:<\/p><ol><li>Termina recaudación.<\/li><li>Sanciones.<\/li><li>Prestaciones accesorias.<\/li><li>Recursos.<\/li><li>Notificaciones y plazos.<\/li><li>Actas.<\/li><li>IRPF.<\/li><\/ol><p class=\"inota\">El reparto sale de los seis exámenes oficiales analizados. Dentro de cada sección no se ha mirado qué ejercicios concretos hay: si una sección tiene muchos, quédate con los que usen los artículos núcleo, como con aplazamientos.<\/p>"}];
function renderInfo(){
  const items = INFO.slice().sort((a,b) => b.fecha.localeCompare(a.fecha));
  return `<div class="head"><div class="lbl">Información</div><p style="margin:0;color:var(--muted);font-size:14px">Lo importante que vamos hablando, para revisarlo cuando quieras. Lo más nuevo, arriba.</p></div>` +
    items.map((it,i) => `<details class="info-e" id="info-${it.id}" ${(infoOpen ? it.id===infoOpen : i===0)?"open":""}><summary><b>${esc(it.titulo)}</b><small>${esc(it.tag)} · ${it.fecha.slice(8)}/${it.fecha.slice(5,7)}/${it.fecha.slice(0,4)}</small></summary><div class="info-b">${it.html}</div></details>`).join("");
}
const GUIAS = [{"dia": "2026-10-22", "art": "LIVA 92 a 99", "titulo": "Deducciones del IVA: el embudo de 6 filtros", "idea": "Una cuota de IVA soportado solo se deduce si pasa seis filtros en orden. Aprende primero el orden; los detalles cuelgan de cada filtro.", "capas": [["Capa 1 · El esqueleto", "Escribe de memoria la lista hasta que salga sola:\n1. ¿Qué IVA? → **92**\n2. ¿Para qué operaciones? → **94**\n3. ¿Está afecto? → **95**\n4. ¿Está en la lista negra? → **96**\n5. ¿Tengo factura? → **97**\n6. ¿Cuándo y cómo? → **99**"], ["Capa 2 · Una frase por filtro", "92: compras a empresarios, importaciones, autorrepercusión y adquisiciones intracomunitarias.\n94: lo exento del **art. 20 no da derecho**; exportaciones y entregas intracomunitarias sí.\n95: **directa y exclusivamente**, salvo bienes de inversión.\n96: joyas, comida y bebida, ocio, atenciones a clientes, viajes y hostelería (salvo deducibles en IRPF/IS).\n97: **sin factura no hay deducción**, y nunca más de lo que dice la factura.\n99: en la autoliquidación del periodo, **4 años** para deducir, exceso se compensa (4 años) o se pide devolución."], ["Capa 3 · Los números", "**3.005,06 €** = umbral de bien de inversión (art. 108). Truco: «3.000 y 5 con 6».\n**50 %** = presunción de afectación de turismos. **100 %** = los 5 casos: viajeros, autoescuela, pruebas de fabricante, comerciales, vigilancia.\n**4 años** = tanto para ejercer el derecho (99.3) como para compensar el exceso (99.5)."], ["Capa 4 · Comprobar", "Tapa la ley y resuelve un caso pasándolo por los 6 filtros en voz alta: «filtro 1 lo pasa porque…, filtro 3 no lo pasa porque…». Si te atascas en un filtro, ese es el que tienes que repasar."]]}, {"dia": "2026-10-23", "art": "LGT 150", "titulo": "Plazo de la inspección", "idea": "Cuánto puede durar una inspección, cuándo se para o se alarga el reloj y qué pasa si se pasa de tiempo. Es un artículo de números: aquí la exactitud puntúa.", "capas": [["Capa 1 · El esqueleto", "5 preguntas, una por apartado. Escríbelas de memoria antes de seguir:\n1. ¿Cuánto dura? (150.1)\n2. ¿Desde cuándo y hasta cuándo se cuenta? (150.2)\n3. ¿Cuándo se para el reloj? (150.3)\n4. ¿Cuándo se alarga? (150.4 y 5)\n5. ¿Qué pasa si se pasa? (150.6 y 7)"], ["Capa 2 · Respuesta corta", "1. 18 meses; 27 en tres casos.\n2. De la notificación del inicio a la notificación del final (basta un intento); no se descuentan dilaciones.\n3. 7 causas en 4 grupos: jueces (2), conflictos entre administraciones (3), intento de notificar la propuesta (1) y fuerza mayor (1).\n4. 60 días a petición del obligado; 3 o 6 meses si aporta tarde.\n5. No caduca, pero tiene 3 efectos."], ["Capa 3 · Los números", "**18 y 27**: 27 = 18 + 9.\nLos tres casos de 27 son «los grandes»: empresa grande (obligada a **auditar**), grupo grande (**consolidación** fiscal o grupo de IVA), impuesto de grandes (**Impuesto Complementario**).\n**60 días naturales**: los que puedes pedir tú, antes del trámite de audiencia.\nRegla **9 → 3 → 6**: si aportas tarde pasados **9 meses**, el plazo se alarga **3 meses**; si es tras el acta, **6**; si es sobre estimación indirecta, **6**.\nIncumplir = **no caduca** + **3 «no»**: no interrumpe la prescripción, no hay sanción (ingresos espontáneos, art. 27), no hay intereses de demora.\nRetroacción: lo que quede de plazo **o 6 meses**, lo mayor.\nSuspensión = **7 causas en 4 grupos** («2 + 3 + 1 + 1»):\nJueces (2): **a)** expediente al **Ministerio Fiscal** · **b)** un **juzgado** ordena suspender.\nConflictos entre administraciones (3): **c)** **Juntas Arbitrales** · **d)** **Comisión consultiva** (conflicto en la aplicación de la norma) · **f)** **Concierto vasco / Convenio navarro**.\nNotificación (1): **e)** **intento de notificar la propuesta** de liquidación (o el acuerdo de completar actuaciones).\nOtros (1): **g)** **fuerza mayor**."], ["Capa 4 · Comprobar", "Hoja en blanco, 5 minutos: las 5 preguntas con su respuesta y todos los números. Corrige con la ley y marca en rojo lo que falló. Lo que falla, a las fichas."]]}, {"dia": "2026-10-23", "art": "LGT 142", "titulo": "Facultades de la inspección", "idea": "Qué poderes tiene el inspector. Se aprende a nivel de ficha, no palabra por palabra; en el supuesto práctico sirve para casos de entrada en locales o domicilios.", "capas": [["Capa 1 · El esqueleto", "4 apartados, 4 preguntas:\n1. ¿**Qué** puede examinar?\n2. ¿**Dónde** puede entrar y con qué permiso?\n3. ¿**Cómo** colabora el obligado?\n4. ¿**Qué son** los inspectores?"], ["Capa 2 · Respuesta corta", "1. Libros, contabilidad, facturas, correspondencia, ficheros y programas informáticos, bienes y explotaciones.\n2. Locales y fincas: acuerdo de entrada o consentimiento. Domicilio protegido: juez (art. 113).\n3. Se persona por sí o por representante; en persona solo excepcionalmente y motivado.\n4. Agentes de la autoridad; se acreditan fuera de la oficina."], ["Capa 3 · Los 3 detalles que caen", "Truco «**llave, juez, excepción**»:\nLlave = **acuerdo de entrada** para locales (salvo consentimiento).\nJuez = **autorización judicial** para el domicilio constitucionalmente protegido (**art. 113**), con el acuerdo de entrada incorporado.\nExcepción = la **comparecencia personal** solo de forma **excepcional y motivada**."], ["Capa 4 · Comprobar", "Inventa un caso: «el inspector quiere entrar en la nave y en la casa del empresario, que se niega». Explica en voz alta qué necesita para cada sitio y qué artículo citas."]]}, {"dia": "2026-10-23", "art": "LGT 146", "titulo": "Medidas cautelares en la inspección", "idea": "Congelar pruebas para que no desaparezcan. Ha salido 3 años en el test: merece ficha propia.", "capas": [["Capa 1 · El esqueleto", "4 preguntas: ¿para qué?, ¿cuáles?, ¿con qué límites?, ¿quién las confirma y cuándo?"], ["Capa 2 · Respuesta corta", "Para que las pruebas no desaparezcan, se destruyan o se alteren. Precinto, depósito o incautación. Proporcionadas, temporales y sin perjuicio irreparable. Las ratifica el órgano que liquida."], ["Capa 3 · Los números", "**15 días** para ratificarlas desde que se adoptan.\nTruco para las medidas: **P-D-I** = **P**recinto, **D**epósito, **I**ncautación."], ["Capa 4 · Comprobar", "Di de memoria las 3 medidas, los 2 límites y el plazo de 15 días. Si te salen, pasa a las fichas."]]}, {"dia": "2026-10-24", "art": "LGT 77, 78 y 168", "titulo": "Garantías de la deuda: quién cobra primero y cómo se ejecuta", "idea": "Tres artículos que cuentan una historia: 77 dice que Hacienda cobra primero (con una excepción), 78 le da una superpreferencia para impuestos como el IBI, y 168 dice cómo se cobra si hay una garantía.", "capas": [["Capa 1 · El esqueleto", "77 → **Prelación**: Hacienda primero.\n78 → **Hipoteca legal tácita**: Hacienda primero incluso contra quien inscribió.\n168 → **Ejecución de garantías**: si hay garantía, primero la garantía."], ["Capa 2 · Respuesta corta", "77: prelación para créditos vencidos y no pagados, **salvo** acreedores con derecho real inscrito en el registro **antes** que Hacienda. En el concurso manda la ley concursal.\n78: en tributos periódicos sobre bienes inscribibles (IBI), preferencia sobre cualquier acreedor o adquirente **aunque haya inscrito**.\n168: se ejecuta la garantía por apremio; se pueden embargar otros bienes antes si la garantía es **desproporcionada** o si **lo pide el obligado** señalando bienes."], ["Capa 3 · Los números y contrastes", "78 = **2 años**: el año en que se exige el pago **+ el anterior**. Truco: «este año y el pasado».\nContraste 77 / 78: en el 77 el que inscribió antes **gana** a Hacienda; en el 78 **pierde** aunque haya inscrito.\n168: **2 excepciones** (desproporción y petición del obligado) y **1 efecto** (la garantía queda sin efecto en lo que cubran los embargos)."], ["Capa 4 · Comprobar", "Caso del IBI: se exigen en 2026 los IBI de 2023 a 2026 de un piso vendido e inscrito. ¿Qué años cubre la hipoteca tácita? Si contestas «2026 y 2025» sin dudar, lo tienes."]]}, {"dia": "2026-10-25", "art": "Ley 39/2015, 35", "titulo": "Actos que deben motivarse", "idea": "Motivar es explicar el porqué del acto: hechos y fundamentos de derecho, de forma breve. El artículo es una lista de 9 casos; agrupada en 4 familias se recuerda mucho mejor.", "capas": [["Capa 1 · El esqueleto", "Dos preguntas: ¿**cómo** se motiva? y ¿**qué actos**? Los 9 casos en 4 familias, truco «**2-1-2-4**»:\n1. Lo que **perjudica** (2): a) limitan derechos · h) sancionadores y responsabilidad patrimonial.\n2. Lo que **resuelve contra algo** (1): b) revisión de oficio, recursos, arbitraje y sus inadmisiones.\n3. Lo que **se aparta o decide libre** (2): c) se separan del precedente o del dictamen · i) discrecionales y los que exija una norma.\n4. Lo que **altera el procedimiento** (4): d) suspensión y medidas provisionales · e) urgencia, ampliación de plazos y actuaciones complementarias · f) rechazo de pruebas · g) terminación por imposibilidad sobrevenida y desistimiento de la Administración."], ["Capa 2 · Respuesta corta", "Cómo: «con **sucinta referencia de hechos y fundamentos de derecho**».\nQué: los 9 casos de las 4 familias.\nApartado 2: en procedimientos **selectivos y de concurrencia competitiva**, según sus **convocatorias**, quedando acreditados los fundamentos."], ["Capa 3 · Los detalles que caen", "No hay plazos; lo que se pregunta es si un acto concreto entra o no en la lista. Fíjate en los que parecen de trámite y sí se motivan: **rechazar pruebas**, **ampliar plazos**, **tramitación de urgencia**, **medidas provisionales**.\nEn sancionador se motiva hasta la **propuesta de resolución**, no solo la resolución.\nLa letra i) cierra la lista: discrecionales + los que diga una norma."], ["Capa 4 · Comprobar", "Di si se motivan y por qué letra: un acto que deniega una licencia (a), uno que amplía un plazo (e), uno que rechaza una prueba (f), uno que resuelve un recurso de alzada (b). Si los ubicas sin mirar, lo tienes."]]}, {"dia": "2026-10-25", "art": "Ley 39/2015, 47 y 48", "titulo": "Nulidad y anulabilidad", "idea": "Nulo es una lista cerrada de vicios gravísimos (47); anulable es todo lo demás (48). Si sabes la lista de nulidad, la anulabilidad sale por descarte.", "capas": [["Capa 1 · El esqueleto", "47.1 = 7 causas de nulidad de actos · 47.2 = nulidad de disposiciones (reglamentos) · 48 = anulabilidad (regla general y 2 matices)."], ["Capa 2 · Respuesta corta", "Truco para las 7 causas, en orden de la a) a la g): «**DIos COn-DEna PROFAnar la LEY**»\n**DI**: a) **D**erechos susceptibles de amparo · b) órgano manifiestamente **I**ncompetente por materia o territorio.\n**CO**: c) **CO**ntenido imposible.\n**DE**: d) **DE**lito (infracción penal o consecuencia de ella).\n**PRO**: e) prescindir total y absolutamente del **PRO**cedimiento, o de las reglas esenciales de los colegiados.\n**FA**: f) adquirir **FA**cultades o derechos sin los requisitos esenciales.\n**LEY**: g) cualquier otro que diga una **LEY**.\n47.2: son nulas las disposiciones que vulneran la Constitución, las leyes o normas superiores, regulan materias reservadas a ley o establecen **retroactividad** de normas sancionadoras desfavorables o restrictivas de derechos.\n48: anulable = **cualquier infracción del ordenamiento, incluida la desviación de poder**."], ["Capa 3 · Las trampas", "Incompetencia: nula solo si es **manifiesta y por materia o territorio**. La incompetencia **jerárquica** es anulable.\nProcedimiento: nulo solo si se prescinde **total y absolutamente**. Omitir un trámite es, como mucho, anulable.\nDefecto de forma (48.2): solo anula si falta un requisito **indispensable para su fin** o causa **indefensión**.\nFuera de plazo (48.3): solo anula si lo impone la **naturaleza del plazo**."], ["Capa 4 · Comprobar", "Clasifica sin mirar: acto de un órgano inferior en vez del superior del mismo ministerio (anulable, jerárquica), sanción sin ningún procedimiento (nulo, e), licencia notificada sin pie de recursos que no causa indefensión (válido o como mucho anulable), acto que vulnera la libertad de expresión (nulo, a)."]]}, {"dia": "2026-10-28", "art": "LIRPF 45, 46, 48 y 49", "titulo": "Renta general, renta del ahorro y cómo se compensan", "idea": "Dos pasos: primero clasificas cada renta en una de las dos cajas (45 y 46); después sumas y restas dentro de cada caja (48 y 49). Las dos cajas nunca se mezclan, porque cada una paga con su escala.", "capas": [["Capa 1 · El esqueleto", "Clasificar: 46 = qué va al **ahorro**; 45 = **todo lo demás** va a la general.\nCompensar: 48 = caja **general**; 49 = caja del **ahorro**.\nCada caja tiene **2 cajones**: rendimientos y ganancias o pérdidas."], ["Capa 2 · Respuesta corta", "**Ahorro (46)**: a) rendimientos del capital mobiliario del **25.1, 25.2 y 25.3** (dividendos, intereses, seguros), salvo el exceso de vinculadas · b) ganancias y pérdidas **por transmisión** de elementos patrimoniales.\n**General (45)**: lo que no es ahorro (trabajo, alquileres, actividades, capital mobiliario del 25.4, ganancias **sin** transmisión) + **imputaciones de renta** (arts. 85, 91, 92 y 95 y transparencia fiscal internacional).\n**Compensar (48 y 49)**: dentro de cada cajón, sin límite; un cajón negativo resta del otro cajón de la misma caja hasta el **25 %** de su saldo positivo; lo que sobre, en los **4 años** siguientes."], ["Capa 3 · Los números y trucos", "Truco del ahorro: «**tu dinero que genera dinero** (25.1, 2 y 3) + **vender**». Ganar sin vender (premios, subvenciones) va a la general.\nExcepción de vinculadas: los intereses por lo prestado a tu sociedad que exceda de **3 veces los fondos propios** (en tu porcentaje de participación) van a la **general**. Fondos propios del **último ejercicio cerrado antes del devengo**; si la vinculación no es socio-sociedad, participación del **25 %**.\n**25 %** = límite para compensar entre cajones.\n**4 años** = plazo para lo que sobra, en la **cuantía máxima** posible cada año y sin acumularlo para después.\nGeneral (48): solo las **pérdidas patrimoniales** pueden pasar a restar de los rendimientos. Ahorro (49): en los **dos sentidos**."], ["Capa 4 · Comprobar", "Clasifica sin mirar: sueldo, alquiler de un piso, intereses de un depósito, dividendos, venta de acciones, premio de un concurso. Luego haz el ejemplo de las fichas con números: si te sale la base general y la del ahorro, lo tienes."]]}];
function guiaHTML(g, open){
  return `<details class="guia"${open?" open":""}><summary>Cómo estudiarlo · ${esc(g.art)}</summary>
    <p class="gidea"><b>${esc(g.titulo)}.</b> ${esc(g.idea)}</p>
    ${g.capas.map(c => `<div class="gcapa"><b class="gt">${esc(c[0])}</b><div class="fa">${fmtA(c[1])}</div></div>`).join("")}</details>`;
}
const METODO = `<details class="guia"><summary>Método para memorizar un artículo (léelo una vez)</summary>
  <div class="gcapa fa">Funciona por capas. No pases a la siguiente hasta que la anterior te salga sin mirar.<br>
  <b>1. El esqueleto:</b> convierte cada apartado en una pregunta («¿cuánto dura?», «¿qué pasa si…?») y aprende solo las preguntas, en orden.<br>
  <b>2. Respuesta corta:</b> una línea por pregunta, con tus palabras.<br>
  <b>3. Los números:</b> plazos, porcentajes y cuantías, exactos. Ánclalos a algo: una suma (27 = 18 + 9), una regla corta («este año y el pasado») o unas siglas (P-D-I).<br>
  <b>4. Comprobar:</b> hoja en blanco, escribes, corriges con la ley y marcas en rojo lo que falló. Eso va a las fichas.<br><br>
  Reglas: escribir vale más que releer; no más de 20 minutos seguidos por artículo; repasar al día siguiente es lo que fija la memoria, y las fichas se encargan de eso.</div></details>`;

      return `<button class="jop ${c}" data-jop="${esc(o)}" ${r?"disabled":""}>${esc(o)}</button>`; }).join("")}</div>`;
  }
  if (r){
    h += `<div class="mem" style="border-left:4px solid ${r.bien?"var(--ok)":"var(--rep)"}"><b>${r.bien?"¡Correcto!":"No era esa."}</b><br>

  }
  return h + `</section>`;
}

/* ---------- práctica: dominio por artículo, Morón y recuperaciones ---------- */
const NIVELES = ["Sin evaluar", "No lo recuerdo", "Reconozco de qué trata", "Puedo explicarlo de memoria", "Puedo aplicarlo en un supuesto"];
const JMAP = Object.fromEntries(JI.map(x => [x.id, x]));
const REC_TIPOS = [[3, "+3", "Recuerda la regla sin mirar", 3], [7, "+7", "Aplícala en un ejercicio breve distinto", 4], [14, "+14", "Recupérala en un supuesto mezclado", 4]];
const RESULTADOS = [["pendiente","Pendiente (no intentado)"],["correcto","Correcto"],["parcial","Parcial"],["incorrecto","Incorrecto"],["blanco","En blanco"]];
const ESTADOS_EJ = [["pendiente","Pendiente"],["completado","Completado"],["parcial","Parcialmente realizado"],["reservado","Reservado"]];
const ERRORES = ["parcial","incorrecto","blanco"];
function artLabel(id){ const x = JMAP[id]; if (x) return x.ley + " " + x.num; const m = String(id).match(/^(.*)-(\d+)$/); return m ? m[1].replace("Ley39","Ley 39/").replace("Ley31","Ley 31/") + " " + m[2] : id; }
function artQue(id){ const x = JMAP[id]; return x ? x.que : ""; }
function leyKey(s){ const u = s.toUpperCase();
  if (u.includes("39/2015")) return "Ley 39/2015"; if (u.includes("31/1990")) return "Ley 31/1990";
  for (const k of ["RGRVA","RGAT","RGR","RIRPF","RIVA","LIRPF","LIVA","LIS","LGT","CAU","TREBEP","CE"]) if (new RegExp("\\b"+k+"\\b").test(u)) return k; return null; }
function artIdsFrom(txt){ const ley = leyKey(txt||""); if (!ley) return [];
  const nums = (txt.replace(/39\/2015|31\/1990/g, "").match(/(?<![.\d])\d+/g) || []);
  const pre = ley.replace(/ /g,"").replace("/","");
  return [...new Set(nums.map(n => pre + "-" + n))]; }
function domOf(id){ return (state.dom || {})[id] || { n: 0, rep: false }; }
function domSet(id, patch){ state.dom = state.dom || {}; state.dom[id] = Object.assign({ n: 0, rep: false }, state.dom[id], patch); }
function domRaise(id, cap, src){ const d = domOf(id); if (d.n < cap) domSet(id, { n: cap, src, when: TODAY }); }
function domFlag(id){ const d = domOf(id); domSet(id, { rep: true, when: TODAY, n: d.n || 1 }); }
/* migración única de la escala antigua 0-3 */
function migrarDominio(){
  if (state.domMig) return; state.dom = state.dom || {};
  ARTS.forEach(a => { const v = (state.dominio||{})[a.id]; if (v > 0) artIdsFrom(a.norma + " " + a.art).forEach(id => domRaise(id, v + 1, "escala anterior")); });
  state.domMig = true;
}
/* recuperaciones */
function recsDe(f){ return Object.entries(state.recs || {}).filter(([k, r]) => r.estado === "pendiente" && (f === TODAY ? r.fecha <= f : r.fecha === f)).map(([k]) => k); }
function programarRecs(art, origen){
  state.recs = state.recs || {};
  REC_TIPOS.forEach(([d, tipo]) => { let fecha = addDays(TODAY, d); while ((DAYS.find(x => x.fecha === fecha)||{}).tipo === "descanso") fecha = addDays(fecha, 1);
    const dup = Object.values(state.recs).some(r => r.art === art && r.fecha === fecha && r.estado === "pendiente");
    if (!dup) state.recs[art + "_" + fecha + "_" + tipo.replace("+","p")] = { art, fecha, tipo, origen, estado: "pendiente", hist: [] }; });
}
function reprogramar(obj, dias){ const de = obj.fecha; obj.fecha = addDays(TODAY, dias); (obj.hist ||= []).push({ accion: "reprogramado", de, a: obj.fecha, el: TODAY }); }
function cerrarRec(key, ok){
  const r = state.recs[key]; if (!r) return;
  r.estado = ok ? "ok" : "reparar"; (r.hist ||= []).push({ accion: ok ? "recuperado" : "fallado", el: TODAY });
  const cap = (REC_TIPOS.find(t => t[1] === r.tipo) || [0,0,0,3])[3];
  if (ok){ domRaise(r.art, cap, "recuperación " + r.tipo); if (r.tipo === "+14") domSet(r.art, { rep: false }); }
  else { domFlag(r.art); }
}

function guardarEjercicio(){
  pararCrono();

  pEdit.apartados.forEach((a, i) => {
    const antes = prev && prev.apartados[i] ? prev.apartados[i].res : "pendiente";
    if (a.res === antes) return;
    if (a.res === "correcto") a.arts.forEach(id => { domRaise(id, 4, "Morón"); domSet(id, { rep: false }); });

  });

}

    const opt = d.tipo==="colchon" ? " (opcional)" : "";
    h += step("Preguntas y caso"+opt, "25'", `
      ${d.p1?`<div class="q">${esc(d.p1)}</div>`:""}${d.p2?`<div class="q">${esc(d.p2)}</div>`:""}
      ${d.caso?`<div class="case"><span class="lbl">Caso · redacta la respuesta citando artículo</span><br>${esc(d.caso)}</div>`:""}
      ${d.moron?`<div class="moron">${esc(d.moron)}<div class="acts" style="margin-top:6px"><button class="fbtn" data-go-practica="1">Registrar ejercicio de Morón</button></div></div>`:""}
      ${d.pauta?`<details class="pauta"><summary>Ver pauta de corrección</summary><p>${esc(d.pauta)}</p></details>`:""}`);
  }
  if (d.test){
    const s = state.dias[d.fecha] || {};
    h += step("Test", "15' + 10' corregir", `<p style="margin:0">${esc(d.test)}</p>
      <div class="testrow"><label for="ac">Aciertos</label><input id="ac" inputmode="numeric" value="${esc(s.aciertos??"")}">
      <label for="pr">de</label><input id="pr" inputmode="numeric" value="${esc(s.preguntas??"")}"></div>`);
  }
  { const rs = resumenDia(d.fecha); const tot = rs.n + rs.r + rs.a + rs.c;
    const fbox = `<div class="card"><div class="ct"><b>Repaso de este día</b><span>${rs.n} fichas del tema · ${rs.r} repasos · ${rs.a} arrastre${rs.c?` · ${rs.c} recuperaciones`:""}</span></div>${tot?`<div class="acts"><button class="fbtn" data-go-fichas="${d.fecha}">Empezar repaso</button></div>`:`<span class="empty">Nada pendiente.</span>`}</div>`;
    h += step("Arrastre y fichas", "15'", (cards.length ? cards.map(cardHTML).join("") : `<p class="empty">Hoy no hay tarjetas de arrastre programadas.</p>`) + fbox); }
  if (d.comunes) h += step("Comunes", "10'", `<p style="margin:0">${esc(d.comunes.replace(/^10 min · /,""))}</p>`);
  return h;
}

function mondayOf(f){ const d = new Date(f+"T12:00:00"); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return iso(d); }
function renderSemana(){
  const weeks = {};
  DAYS.forEach(d => { (weeks[mondayOf(d.fecha)] ||= []).push(d); });
  return stats() + Object.entries(weeks).map(([mon, ds]) => `<section class="week"><h3>Semana del ${fmt(mon)}</h3>
    ${ds.map(d => { const st = estadoDe(d); const nc = CARDS.filter(c=>c.fecha===d.fecha).length;
      return `<button class="wd ${d.fecha===TODAY?"is-today":""}" data-go="${d.fecha}">
        <small>${esc(d.dia.slice(0,3))} ${d.fecha.slice(8)}/${d.fecha.slice(5,7)}</small>
        <span class="dot ${st} ${d.tipo==="descanso"?"off":""}" aria-label="${st||"Pendiente"}"></span>
        <span class="t">${esc(d.bloque)}${nc?` <em>· ${nc} arrastre${nc>1?"s":""}</em>`:""}</span></button>`; }).join("")}
  </section>`).join("");
}

function renderArts(){
  return METODO + GUIAS.map(g => guiaHTML(g,false)).join("") + renderDominio();
}

function render(){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === view)));
  const ae = document.activeElement && document.activeElement.id;
  app.innerHTML = syncBox() + (view === "dia" ? renderHoy() : view === "excel" ? renderDia() : view === "semana" ? renderPlan() : view === "fichas" ? renderFichas() : view === "juego" ? renderJuego() : view === "practica" ? renderPractica() : view === "info" ? renderInfo() : renderArts());
  if (ae && (ae==="ac"||ae==="pr")) { const el=document.getElementById(ae); if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} }
}

app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.info){ infoOpen = b.dataset.info; view = "info"; try{localStorage.setItem("hoy-view","info");}catch(e){} render(); const el = document.getElementById("info-"+infoOpen); if (el) el.scrollIntoView(); else window.scrollTo(0,0); return; }
  if (b.dataset.blqhecho){ state.bloques = state.bloques || {}; state.bloques[b.dataset.blqhecho] = { hecho: TODAY }; scheduleSave(); render(); window.scrollTo(0,0); return; }
  if (b.dataset.blqreabrir){ if (state.bloques) delete state.bloques[b.dataset.blqreabrir]; scheduleSave(); render(); return; }
  if (b.dataset.exclave){ state.arrex = state.arrex || {}; if (state.arrex[b.dataset.exclave]) delete state.arrex[b.dataset.exclave]; else state.arrex[b.dataset.exclave] = TODAY; scheduleSave(); render(); return; }
  if (b.dataset.arrex){ state.arrex = state.arrex || {}; state.arrex[b.dataset.arrex] = TODAY; scheduleSave();
    if (b.dataset.r === "fallo"){ nuevoEjercicio(); const [bid, n] = b.dataset.arrex.split(":"); const bl = BLOQUES.find(x => x.id === bid); if (pEdit && bl){ pEdit.materia = bl.nombre; pEdit.numero = n; } view = "practica"; try{localStorage.setItem("hoy-view","practica");}catch(e){} }
    render(); window.scrollTo(0,0); return; }
  if (b.dataset.goFichas){ abrirCola(b.dataset.goFichas); view = "fichas"; try{localStorage.setItem("hoy-view","fichas");}catch(e){} render(); window.scrollTo(0,0); return; }
  if (b.dataset.fmode){ fichaModo = b.dataset.fmode; render(); return; }
  if (b.dataset.cola){ abrirCola(b.dataset.cola); render(); window.scrollTo(0,0); return; }
  if (b.dataset.fdia){ const i = DAYS.findIndex(x => x.fecha === fichaDia); const n = DAYS[i + Number(b.dataset.fdia)]; if (n){ abrirCola(n.fecha); render(); } return; }
  if (b.id === "voltear"){ fichaVuelta = true; render(); return; }
  if (b.dataset.grade){ const it = cola[colaIdx]; if (it) gradeFicha(it.id, b.dataset.grade); siguiente(); return; }
  if (b.dataset.arr){ const it = cola[colaIdx]; if (it) state.cards[it.id] = b.dataset.arr; siguiente(); return; }
  if (b.dataset.jugar){ jNueva(b.dataset.jugar); render(); window.scrollTo(0,0); return; }
  if (b.dataset.jop !== undefined){ jResponder(b.dataset.jop); return; }
  if (b.id === "jok"){ const el = document.getElementById("jnum"); if (el && el.value.trim()) jResponder(el.value); return; }
  if (b.dataset.jsig){ jr.i++; jr.resp = null; render(); window.scrollTo(0,0); const el = document.getElementById("jnum"); if (el) el.focus(); return; }
  if (b.dataset.pnuevo){ nuevoEjercicio(); render(); return; }
  if (b.dataset.peditar){ editarEjercicio(b.dataset.peditar); render(); window.scrollTo(0,0); return; }
  if (b.dataset.pcancel){ pararCrono(); pEdit = null; render(); return; }
  if (b.dataset.pguardar){ guardarEjercicio(); return; }
  if (b.dataset.pmanana){ const e = state.moron[b.dataset.pmanana]; if (e){ reprogramar(e, 1); scheduleSave(); render(); } return; }
  if (b.dataset.crono){ if (pTimer) pararCrono(); else arrancarCrono(); render(); return; }
  if (b.dataset.crono0){ pararCrono(); pEdit.tiempo = 0; render(); return; }
  if (b.dataset.addap){ const n = pEdit.apartados.length; pEdit.apartados.push({ ap: String.fromCharCode(97+n), arts: [], res: "pendiente", fallo: "" }); render(); return; }
  if (b.dataset.quitap){ pEdit.apartados.splice(Number(b.dataset.quitap), 1); render(); return; }
  if (b.dataset.addartbtn !== undefined){ const i = Number(b.dataset.addartbtn); const el = document.querySelector(`[data-addart="${i}"]`); const ids = artIdsFrom(el ? el.value : "");
    if (ids.length){ ids.forEach(id => { if (!pEdit.apartados[i].arts.includes(id)) pEdit.apartados[i].arts.push(id); }); render(); } else if (el){ el.value = ""; el.placeholder = "Escribe la ley y el número: «LGT 167», «RGR 46», «LIVA 95»"; } return; }
  if (b.dataset.quitart){ const [i, id] = b.dataset.quitart.split("|"); pEdit.apartados[Number(i)].arts = pEdit.apartados[Number(i)].arts.filter(x => x !== id); render(); return; }
  if (b.dataset.dom){ domSet(b.dataset.dom, { n: Number(b.dataset.v), src: "manual", when: TODAY }); scheduleSave(); render(); return; }
  if (b.dataset.domrep){ const d = domOf(b.dataset.domrep); domSet(b.dataset.domrep, { rep: !d.rep }); scheduleSave(); render(); return; }
  if (b.dataset.domf){ domFiltro = b.dataset.domf; render(); return; }
  if (b.dataset.rec){ const it = cola[colaIdx]; if (it){ if (b.dataset.rec === "manana"){ reprogramar(state.recs[it.id], 1); } else cerrarRec(it.id, b.dataset.rec === "ok"); } siguiente(); return; }
  if (b.dataset.goPractica){ nuevoEjercicio(); view = "practica"; try{localStorage.setItem("hoy-view","practica");}catch(e){} render(); window.scrollTo(0,0); return; }
  if (b.id === "prev" || b.id === "next"){ const i = DAYS.findIndex(d=>d.fecha===cur); cur = DAYS[i + (b.id==="next"?1:-1)].fecha; render(); return; }
  if (b.id === "code-ok"){ const v = (document.getElementById("code").value||"").trim(); if (v.length < 20){ alertBox("El código debe tener al menos 20 caracteres."); return; } CODE = v; try{localStorage.setItem("hoy-code",v);}catch(e){} render(); pull(); return; }
  if (b.id === "hoy"){ cur = pickDay(TODAY); render(); return; }
  if (b.dataset.go){ cur = b.dataset.go; view = "excel"; render(); window.scrollTo(0,0); return; }
  if (b.dataset.estado !== undefined){ const s = Object.assign({}, state.dias[cur]); s.estado = b.dataset.estado; state.dias[cur] = s; scheduleSave(); render(); return; }
  if (b.dataset.card){ const v = b.dataset.v; state.cards[b.dataset.card] = state.cards[b.dataset.card] === v ? "" : v; scheduleSave(); render(); return; }
  if (b.dataset.art){ state.dominio[b.dataset.art] = Number(b.dataset.v); scheduleSave(); render(); return; }
});
app.addEventListener("keydown", e => { if (e.target.dataset && e.target.dataset.addart !== undefined && e.key === "Enter"){ e.preventDefault(); const bt = document.querySelector(`[data-addartbtn="${e.target.dataset.addart}"]`); if (bt) bt.click(); return; } if (e.target.id === "jnum" && e.key === "Enter" && e.target.value.trim()) jResponder(e.target.value); });
app.addEventListener("change", e => { if (pEdit && e.target.tagName === "SELECT"){ if (e.target.dataset.pf) pEdit[e.target.dataset.pf] = e.target.value; else if (e.target.dataset.pap !== undefined) pEdit.apartados[Number(e.target.dataset.pap)][e.target.dataset.pk] = e.target.value; } });
app.addEventListener("input", e => {
  if (pEdit && e.target.dataset.pf){ pEdit[e.target.dataset.pf] = e.target.value; return; }
  if (pEdit && e.target.dataset.pap !== undefined && e.target.dataset.pk){ pEdit.apartados[Number(e.target.dataset.pap)][e.target.dataset.pk] = e.target.value; return; }
  if (e.target.id === "resp"){ respDraft = e.target.value; return; }
  if (e.target.id === "ac" || e.target.id === "pr"){
    const dk = view === "dia" ? TODAY : cur; const s = Object.assign({}, state.dias[dk]); s[e.target.id==="ac"?"aciertos":"preguntas"] = e.target.value.replace(/[^0-9]/g,""); state.dias[dk] = s; scheduleSave();
  }
});
function alertBox(m){ const s=document.getElementById("sync"); if(!s) return; let p=s.querySelector(".err"); if(!p){p=document.createElement("p");p.className="err";p.style.cssText="margin:0;color:var(--rep);font-weight:600";s.appendChild(p);} p.textContent=m; }
render();
</script>
