d limitada, sus deudas pasan a los <b>socios<\/b>, solidariamente, pero solo <b>hasta su cuota de liquidación<\/b> más lo que recibieron en los <b>2 años anteriores a la disolución<\/b> rebajando el patrimonio (<b>40.1<\/b>), sin perjuicio del 42.2.a. Si fuera una sociedad con responsabilidad ilimitada, responderían de todo. Pasan aunque la deuda no estuviera liquidada (<b>40.2<\/b>).<\/p><p>Si en vez de liquidarse ALBUS se hubiera <b>fusionado<\/b> o hubiera cedido todo su activo y pasivo, las deudas pasarían a la sociedad que la absorbe (<b>40.3<\/b>). Y si la que se disuelve es la <b>comunidad de bienes<\/b> del capítulo 2, sus deudas pasan a los comuneros, D. Manuel y su hermano; en una fundación, a quienes reciben sus bienes (<b>40.4<\/b>).<\/p><p>A diferencia de la muerte de D. Manuel, aquí <b>las sanciones sí pasan<\/b> a los socios, con el mismo límite (<b>40.5<\/b> y 182.3). Pero si uno de esos socios muere, sus herederos no heredan esas sanciones (39.1). Una vez constatada la extinción, Hacienda puede ir contra <b>cualquier socio o contra todos<\/b>, a la vez o uno tras otro (<b>177.2<\/b>).<\/p><div class=\"hbox\"><div class=\"hbox-t\">Para el examen<\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>40 y 177.2 · Se extingue la sociedad<\/b> · <span class=\"hb-tipo\">sucesión<\/span><\/p><p class=\"hb-l\">Requisitos<\/p><ol><li>La sociedad se <b>disuelve y liquida<\/b>.<\/li><li>Responsabilidad <b>limitada<\/b>: los socios, hasta su <b>cuota de liquidación<\/b> + lo recibido en los 2 años anteriores si rebajó el patrimonio. Ilimitada: todo.<\/li><li>Constatada la extinción, contra <b>cualquier socio o todos<\/b> (177.2).<\/li><\/ol><p><b>Alcance:<\/b> deudas, aunque no estuvieran liquidadas, y <b>también las sanciones<\/b>, con el mismo límite (40.5).<\/p><p><b>No confundir:<\/b> fusión o cesión global → la sociedad que la absorbe (40.3); comunidades y fundaciones → los comuneros o destinatarios (40.4).<\/p><\/div><\/div><p><b>La historia en una frase:<\/b> ALBUS no paga y Hacienda busca a otros; la responsabilidad es subsidiaria salvo que la ley diga otra cosa (41.2) y alcanza la deuda en voluntaria (41.3); solidarios son el que colabora en la infracción, los partícipes y quien sigue el negocio (42.1), y los que esconden o desobedecen, hasta lo que se pudo embargar (42.2), nunca un menor; subsidiarios son los administradores por infracción, cierre o presentar sin pagar (43.1.a y b, 43.2) y los demás del 43.1; se declara con audiencia de 15 días y en 6 meses (174 y 124 RGR), y al subsidiario solo tras el fallido (176); cuando D.<\/p><p>Manuel muere, sus deudas pasan a los herederos sin sanciones (39), y cuando ALBUS se extingue, a los socios, con sanciones y hasta su cuota (40).<\/p><p class=\"inota\">Comprobado con el BOE consolidado: LGT, RGR y RGAT. Menores: STS de 25-3-2021. Los artículos del Código Civil y del Código Penal se citan solo como apoyo.<\/p>", "indice": [["41 LGT · Alguien más paga", [["41.1", "Responsables junto al deudor principal"], ["41.2", "Subsidiaria salvo precepto expreso"], ["41.3", "Alcance: deuda en voluntaria, sin recargos ejecutivos"], ["41.4", "Sanciones solo si la ley lo dice · reducciones"], ["41.5", "Medidas cautelares antes · fallido para el subsidiario"], ["41.6", "Reembolso por la vía civil"], ["182", "Responsables de sanciones"]]], ["42.1 LGT · Solidarios", [["42.1.a", "Colaborar activamente en la infracción (también sanción)"], ["42.1.b", "Partícipes del 35.4, en proporción"], ["42.1.c", "Sucesión en la actividad"], ["175.2 · 125 RGR", "Certificado: antes de adquirir, 3 meses"]]], ["42.2 LGT · Esconder o desobedecer", [["42.2", "Hasta lo que se pudo embargar · con recargo e intereses ejecutivos"], ["42.2.a", "Ocultar o transmitir bienes · nunca un menor (TS)"], ["42.2.b", "Incumplir el embargo por culpa o negligencia"], ["42.2.c", "Colaborar en el levantamiento, a sabiendas"], ["42.2.d", "Depositarios que consienten el levantamiento"], ["174.5", "Solo se recurre el alcance global"]]], ["43 LGT · Administradores", [["43.1.a", "Infracciones: también sanciones"], ["43.1.b", "Cese: administrador al cese, sin sanciones"], ["43.2", "Sin ingreso reiterado: mitad o más · 25 % del año"]]], ["43.1.c-h · Más subsidiarios", [["43.1.c-e", "Liquidadores · bienes afectos · representantes aduaneros"], ["43.1.f", "Subcontratas: certificado de 12 meses"], ["43.1.g", "Velo: quien controla responde de la sociedad"], ["43.1.h", "Velo inverso: la sociedad responde de quien la controla"]]], ["174 a 176 · Procedimiento", [["174.1-2", "Tras la liquidación · órgano de recaudación"], ["124.1 RGR", "Acuerdo, audiencia de 15 días, 6 meses"], ["174.4", "Contenido de la notificación"], ["174.6", "Plazo del 62.2 · si no, apremio"], ["175.1", "Solidaria: requerir o declarar"], ["176", "Subsidiaria: tras declarar fallidos"], ["174.5", "Recurso: presupuesto y liquidaciones"], ["196 RGAT", "Responsables descubiertos en la inspección"]]], ["39 y 177.1 · Muere el deudor", [["39.1", "Herederos y legatarios · sin sanciones"], ["39.1 · TEAC", "Derivación notificada: pasa, pero nunca las sanciones · el 43.1.a no pasa (TEAC 2026)"], ["39.2", "Aunque no esté liquidada"], ["39.3", "Herencia yacente"], ["177.1", "Continúa con los herederos · derecho a deliberar"], ["127.1 RGR", "Plazo y recargo según el momento de la muerte"], ["1084-1085 CC", "Reclamar a un heredero y repetir"]]], ["40 y 177.2 · Se extingue la sociedad", [["40.1", "Socios hasta la cuota de liquidación + 2 años"], ["40.2", "Aunque no esté liquidada"], ["40.3", "Fusión y cesión global"], ["40.4", "Fundaciones y entes del 35.4"], ["40.5", "Las sanciones sí pasan"], ["177.2", "Contra cualquier socio o todos"]]]]}, {"id": "chuleta-resp", "fecha": "2026-11-11", "titulo": "Chuleta · Responsables y sucesores", "tag": "Chuleta de bloque", "html": "<p>Ejercicios: págs. 238-241 (enunciados) y 242-251 (soluciones). Comprobado con el BOE consolidado (LGT, RGR y RGAT). Morón no trae ejercicios de <b>sucesores<\/b>, pero salieron en el examen de 2026: están en la historia.<\/p><h4>Memorizar mínimo<\/h4><div class=\"itab\"><table><thead><tr><th>Artículo<\/th><th>De qué va<\/th><th>Dato clave<\/th><\/tr><\/thead><tbody><tr><td><b>41.2-41.3<\/b><\/td><td>Regla general<\/td><td>Subsidiaria salvo precepto · alcanza la deuda <b>en voluntaria<\/b> (sin recargos ejecutivos)<\/td><\/tr><tr><td><b>41.4 y 182<\/b><\/td><td>Sanciones<\/td><td>Solo 42.1.a y c, 42.2 y 43.1.a, g y h<\/td><\/tr><tr><td><b>41.5 y 176<\/b><\/td><td>Subsidiaria<\/td><td>Antes, declarar <b>fallidos<\/b> al deudor y a los solidarios<\/td><\/tr><tr><td><b>42.1.a<\/b><\/td><td>Colaborar en la infracción<\/td><td>Solidario, deuda + sanción · no hace falta ser socio ni administrador<\/td><\/tr><tr><td><b>42.1.c y 175.2<\/b><\/td><td>Sucesión en la actividad<\/td><td>Solidario · certificado en 3 meses limita o exime<\/td><\/tr><tr><td><b>42.2.a-d<\/b><\/td><td>Ocultar, incumplir, levantar, depositario<\/td><td>Solidario <b>hasta el valor de lo que se pudo embargar<\/b>, con recargo e intereses ejecutivos y sanciones<\/td><\/tr><tr><td><b>43.1.a<\/b><\/td><td>Administrador e infracción<\/td><td>Subsidiario, deuda + <b>sanción<\/b><\/td><\/tr><tr><td><b>43.1.b<\/b><\/td><td>Administrador y cese<\/td><td>Administrador <b>al cese<\/b> · sin sanciones<\/td><\/tr><tr><td><b>43.2<\/b><\/td><td>Autoliquidaciones sin ingreso<\/td><td>Repercutidos y retenciones · mitad o más en el año · si lo ingresado en el año <b>no supera el 25 %<\/b> de las cuotas, cuenta como sin ingreso<\/td><\/tr><tr><td><b>43.1.f<\/b><\/td><td>Subcontratas<\/td><td>Certificado de 12 meses · limitado a los pagos sin certificado<\/td><\/tr><tr><td><b>174 y 124 RGR<\/b><\/td><td>Procedimiento<\/td><td>Recaudación · acuerdo, <b>audiencia de 15 días<\/b>, <b>6 meses<\/b> · contenido 174.4 · pago en el plazo del <b>62.2<\/b><\/td><\/tr><tr><td><b>39 y 177.1<\/b><\/td><td>Muere el deudor<\/td><td>Herederos, <b>sin sanciones<\/b> · plazos según el 127 RGR<\/td><\/tr><tr><td><b>40 y 177.2<\/b><\/td><td>Se disuelve la sociedad<\/td><td>Socios hasta la cuota de liquidación · <b>con sanciones<\/b><\/td><\/tr><\/tbody><\/table><\/div><h4>Cómo calcular el alcance<\/h4><ol><li><b>41.3<\/b>: cuota + intereses de la liquidación (+ sanción si el supuesto lo incluye). Quita los recargos ejecutivos del deudor. FALCON: 10.000 + 1.000 + 5.000 = <b>16.000 €<\/b>.<\/li><li><b>42.2<\/b>: el menor entre la deuda total (con recargo e intereses ejecutivos y sanciones) y el valor de lo que se pudo embargar. SILLAS: los recibos pagados, no los 3.000 €.<\/li><li><b>42.1.a<\/b>: toda la deuda en voluntaria + sanciones. Asesor: <b>280.000 €<\/b>.<\/li><\/ol><h4>No confundas<\/h4><ul><li><b>42.2.b<\/b> (descuido) frente a <b>42.2.c<\/b> (lo sabe y colabora): si el enunciado no aclara cuál, razona las dos.<\/li><li><b>Responsable<\/b> (hace falta acto de derivación) frente a <b>sucesor<\/b> (ocupa el lugar del deudor).<\/li><li>Herederos: <b>sin<\/b> sanciones (39). Socios de una sociedad disuelta: <b>con<\/b> sanciones, hasta su cuota (40.5).<\/li><li>Muere un responsable con la derivación ya notificada: la deuda pasa a sus herederos, las sanciones nunca (TEAC 10-12-2024), y la del <b>43.1.a<\/b> no pasa en absoluto (TEAC 30-4-2026, criterio aún no reiterado).<\/li><li><b>42.1.c<\/b> (quien sigue el negocio, solidario) frente a <b>43.1.b<\/b> (administrador que cierra, subsidiario).<\/li><li><b>175.1.a<\/b>: si se declaró antes de acabar la voluntaria, basta requerir el pago.<\/li><\/ul><h4>Qué artículos se repiten (Morón × exámenes oficiales)<\/h4><div class=\"itab\"><table><thead><tr><th>Artículo<\/th><th>Morón (de 16)<\/th><th>Oficiales<\/th><th>Veredicto<\/th><\/tr><\/thead><tbody><tr><td>42.2 LGT<\/td><td>7<\/td><td>2 (incl. el Sr. Ruiz)<\/td><td>Seguro<\/td><\/tr><tr><td>43.1.a y b LGT<\/td><td>7<\/td><td>2<\/td><td>Seguro<\/td><\/tr><tr><td>174 a 176 LGT · 124 RGR<\/td><td>5<\/td><td>3 exámenes<\/td><td>Seguro<\/td><\/tr><tr><td>41.3 y 41.4 LGT<\/td><td>4<\/td><td>2<\/td><td>Seguro<\/td><\/tr><tr><td>42.1.a LGT<\/td><td>3<\/td><td>1<\/td><td>Muy probable<\/td><\/tr><tr><td>39, 40 y 177 LGT · 127 RGR<\/td><td>0<\/td><td>2026 (3 apartados)<\/td><td>Muy probable: es la tendencia<\/td><\/tr><tr><td>42.1.c LGT<\/td><td>1<\/td><td>1<\/td><td>Probable<\/td><\/tr><tr><td>43.1.g y h LGT<\/td><td>1<\/td><td>1<\/td><td>Probable<\/td><\/tr><tr><td>182 LGT<\/td><td>0<\/td><td>2<\/td><td>Apoyo<\/td><\/tr><tr><td>43.2 y 43.1.f LGT<\/td><td>1 cada uno<\/td><td>0<\/td><td>Solo Morón: entender<\/td><\/tr><tr><td>81.7 LGT<\/td><td>1<\/td><td>1 (medidas cautelares)<\/td><td>Apoyo<\/td><\/tr><\/tbody><\/table><\/div><h4>Dónde Morón se queda corto o se equivoca<\/h4><ul><li><b>Ej. 1 c):<\/b> dice que D.ª Inés fue nombrada el 1-1-2019. El enunciado dice el <b>1-1-2020<\/b>. No cambia la respuesta.<\/li><li><b>Ej. 2:<\/b> cita el 81.6. En el texto vigente es el <b>81.7<\/b>.<\/li><li><b>Ej. 3:<\/b> mete al administrador de ROCKET por el 43.1.a, pero el enunciado no dice que ROCKET cometiera ninguna infracción. Y PINK pactó desviar el pago: encaja mejor en el <b>42.2.c<\/b> (o el a) que en la b) «por culpa o negligencia».<\/li><li><b>Ej. 8:<\/b> no cita artículo para la empresa nueva. Es el <b>42.1.c<\/b> (y el certificado del 175.2).<\/li><li><b>Ej. 9:<\/b> fundamenta en el 35.7 una responsabilidad «ilimitada y solidaria». Para los partícipes de un ente del 35.4 la regla es el <b>42.1.b<\/b>: solidaria <b>en proporción a su participación<\/b>. Y por las facturas falsas, el 42.1.a.<\/li><li><b>Ej. 11 d):<\/b> el 5-5-2020 es la regla general del 62.2. En la realidad, la normativa COVID (DA 1.ª del RDL 15/2020) lo alargó hasta el 30 de mayo, que al ser inhábil pasó al 1 de junio. En el examen usa la regla general salvo que te den el dato.<\/li><li><b>Ej. 12:<\/b> declara a D. Juan y D. Luis responsables por el 42.1.a sin que el enunciado diga que colaboraran. Basta el <b>43.1.a<\/b>. Y el momento de la declaración es el <b>174.1<\/b>; el 174.2 es la competencia.<\/li><li><b>Ej. 15 a):<\/b> el alcance es el valor de lo que se pudo <b>embargar o enajenar<\/b>, no «de los bienes enajenados». <b>b)<\/b> pregunta por «otro cauce legal» y Morón solo da otras letras del 42.2. El otro cauce es el <b>penal<\/b>: malversación del depositario de bienes embargados (435.3 CP).<\/li><li><b>Ej. 16:<\/b> dice que por el 35.7 se puede exigir <b>toda<\/b> la deuda al hijo mayor. El 42.2 tiene un tope: el valor de lo que se pudo embargar (el inmueble, 200.000 €). Lo del menor, Morón acierta: el Tribunal Supremo (STS de 25-3-2021 y posteriores) dice que no cabe exigir esta responsabilidad a un menor, aunque aceptara su representante legal. Añade el <b>1297 CC<\/b> (las donaciones se presumen en fraude) junto al 1111.<\/li><\/ul><h4>Ejercicios<\/h4><p><b>Clave:<\/b> 1, 4, 6, 11, 12, 14, 15 y 16.<br><b>Arrastre:<\/b> 2, 3, 5, 7, 8, 9, 10 y 13.<\/p>"}, {"id": "chuleta-embargos", "fecha": "2026-11-07", "titulo": "Chuleta · Embargos", "tag": "Chuleta de bloque", "html": "<p>Ejercicios: <b>E<\/b> = «Los embargos» (págs. 211-215) · <b>T<\/b> = «Tipos de embargo» (págs. 216-224). Todo comprobado con el BOE consolidado (LGT, RGR, LEC, LIRPF y RGAT).<\/p><h4>Memorizar mínimo<\/h4><div class=\"itab\"><table><thead><tr><th>Artículo<\/th><th>De qué va<\/th><th>Dato clave<\/th><\/tr><\/thead><tbody><tr><td><b>169.1 LGT<\/b><\/td><td>Cuánto se embarga<\/td><td>Deuda + intereses + recargos + costas, con <b>proporcionalidad<\/b><\/td><\/tr><tr><td><b>169.2 LGT<\/b><\/td><td>Orden de embargo<\/td><td>Primero facilidad de venta y menor onerosidad; si no, el orden: <b>a) dinero y cuentas · b) créditos a corto · c) sueldos · d) inmuebles · e) intereses y rentas · f) establecimientos · g) joyas · h) muebles · i) créditos a largo<\/b><\/td><\/tr><tr><td><b>169.4 LGT<\/b><\/td><td>Alterar el orden<\/td><td>A petición del deudor, si sus bienes cobran igual de rápido y sin perjuicio a terceros · lo que exige entrar en el domicilio, al final<\/td><\/tr><tr><td><b>170.1 LGT<\/b><\/td><td>Diligencia y a quién se notifica<\/td><td>Obligado, tercero titular/poseedor/depositario, <b>cónyuge si son gananciales<\/b> (y vivienda habitual, 76.3 RGR) y cotitulares<\/td><\/tr><tr><td><b>170.2 LGT<\/b><\/td><td>Anotación preventiva<\/td><td>Mandamiento con valor judicial + certificación de cargas · notificar a titulares de cargas posteriores<\/td><\/tr><tr><td><b>170.3 LGT<\/b><\/td><td>Motivos de oposición a la diligencia<\/td><td>a) extinción o prescripción · b) <b>falta de notificación de la providencia<\/b> · c) incumplir las normas del embargo · d) suspensión<\/td><\/tr><tr><td><b>171.2 LGT<\/b><\/td><td>Cuentas con varios titulares<\/td><td>Se presume por partes iguales, salvo prueba<\/td><\/tr><tr><td><b>171.3 LGT<\/b><\/td><td>Cuenta donde se cobra la nómina<\/td><td>Límites de la LEC sobre lo ingresado como sueldo en el mes (o el anterior)<\/td><\/tr><tr><td><b>607 LEC<\/b><\/td><td>Escala del sueldo<\/td><td>1.er SMI <b>0 %<\/b> · 2.º <b>30 %<\/b> · 3.º <b>50 %<\/b> · 4.º <b>60 %<\/b> · 5.º <b>75 %<\/b> · resto <b>90 %<\/b><\/td><\/tr><tr><td><b>79 RGR<\/b><\/td><td>Embargo de cuentas<\/td><td>El banco retiene <b>de inmediato<\/b> (79.3) · ingresa en el Tesoro a los <b>20 días naturales<\/b> (79.6)<\/td><\/tr><tr><td><b>42.2 LGT<\/b><\/td><td>Responsables por embargo<\/td><td>Solidarios hasta lo que se pudo embargar: ocultar, incumplir órdenes de embargo, colaborar en levantar lo embargado, depositarios<\/td><\/tr><tr><td><b>172.3-4 LGT<\/b><\/td><td>Vender lo embargado<\/td><td>No antes de que la liquidación sea firme (salvo excepciones) · se liberan los bienes pagando deuda y costas antes de la adjudicación<\/td><\/tr><\/tbody><\/table><\/div><h4>Cómo calcular el embargo de una cuenta con nómina<\/h4><ol><li><b>Criterio clásico (Morón):<\/b> saldo − última nómina = ahorro, se embarga entero. <b>Criterio del TEAC desde el 18-6-2025:<\/b> la parte inembargable de cada nómina sigue protegida aunque se acumule; solo es embargable entero lo que no procede de nóminas. En el examen: calcula y menciona el criterio de 2025.<\/li><li><b>Última nómina<\/b>: escala del 607 LEC por tramos de SMI sobre la nómina entera. Si el saldo es menor que la nómina, Morón embarga como máximo lo que se habría embargado en origen (T3: nómina 1.800, saldo 1.500 → 30 % de 616 = <b>184,80 €<\/b>). <b>Matiz del TEAC de 30-4-2026 (RG 4803/2024):<\/b> no basta con comparar el saldo con la nómina; si hay otros ingresos y gastos, se presume gastado primero lo inembargable, y el saldo que venga de dinero embargable se embarga entero.<\/li><li><b>Mes con paga extra<\/b>: el tramo inembargable es el <b>doble del SMI<\/b>; con pagas prorrateadas, SMI × 14 / 12 (TEAC 17-5-2022, RG 1975/2022).<\/li><li><b>SMI<\/b>: usa el que dé el enunciado. Morón usa 1.184 (2025); en 2026 es <b>1.221 €<\/b> (RD 126/2026).<\/li><li>Lo que otro ingresa en la cuenta (no es sueldo) se embarga entero.<\/li><\/ol><p><b>Ejemplo (T1):<\/b> saldo 5.000, nóminas de 3.000, SMI 1.184. Sin límite: 5.000 − 3.000 = 2.000. Nómina: 1.184 al 0 % + 1.184 al 30 % (355,20) + 632 al 50 % (316). Total ≈ 2.671 €. <span class=\"inota\">Morón da 2.656,20 porque calcula el segundo tramo como 340,20: compruébalo con su tabla.<\/span><\/p><h4>No confundas<\/h4><ul><li><b>167.3<\/b> = motivos contra la <b>providencia<\/b> (incluye falta de notificación de la <b>liquidación<\/b>). <b>170.3<\/b> = motivos contra la <b>diligencia de embargo<\/b> (incluye falta de notificación de la <b>providencia<\/b>). Cada acto, la notificación del anterior.<\/li><\/ul><h4>Qué artículos se repiten (Morón × exámenes oficiales)<\/h4><div class=\"itab\"><table><thead><tr><th>Artículo<\/th><th>Morón (de 15)<\/th><th>Oficiales<\/th><th>Veredicto<\/th><\/tr><\/thead><tbody><tr><td>169 LGT<\/td><td>2<\/td><td>4 exámenes (orden de embargo)<\/td><td>Seguro<\/td><\/tr><tr><td>170 LGT (incl. 170.3)<\/td><td>4<\/td><td>4 exámenes<\/td><td>Seguro<\/td><\/tr><tr><td>171 LGT<\/td><td>4<\/td><td>3<\/td><td>Seguro<\/td><\/tr><tr><td>607 LEC<\/td><td>5<\/td><td>2<\/td><td>Seguro<\/td><\/tr><tr><td>79 RGR<\/td><td>2<\/td><td>3 (apoyo)<\/td><td>Muy probable<\/td><\/tr><tr><td>76 RGR (notificación)<\/td><td>1<\/td><td>1 (inmueble)<\/td><td>Probable<\/td><\/tr><tr><td>TEAC 2022 paga extra<\/td><td>1<\/td><td>1 (pensión)<\/td><td>Probable<\/td><\/tr><tr><td>172 LGT<\/td><td>0<\/td><td>2 (3 apartados en uno)<\/td><td>Léelo<\/td><\/tr><tr><td>83 RGR (inmuebles)<\/td><td>0<\/td><td>1<\/td><td>Apoyo<\/td><\/tr><tr><td>42.2 LGT<\/td><td>1<\/td><td>responsables<\/td><td>Apoyo<\/td><\/tr><tr><td>80, 89, 92, 100 RGR<\/td><td>1 cada uno<\/td><td>0<\/td><td>Solo Morón: entender<\/td><\/tr><\/tbody><\/table><\/div><h4>Dónde Morón se queda corto o se equivoca<\/h4><ul><li><b>T9 a):<\/b> cita el 92.3 RGR para los 5 días del vehículo. En el texto vigente es el <b>92.4<\/b>; el 92.3 es la anotación en el Registro de Bienes Muebles.<\/li><li><b>E2 a):<\/b> atribuye al 171 LGT la «diligencia de constancia de hechos»; el 171 no dice eso (regula el embargo en bancos). Cita la diligencia sin artículo o el 99.7 LGT si lo has visto.<\/li><li><b>E2 d):<\/b> cita el 42.2.c. Valdría también el <b>42.2.d<\/b> (depositarios que, notificados, consienten el levantamiento), que encaja con el banco.<\/li><li><b>T1:<\/b> dice que el 608 LEC limita el embargo a la última mensualidad. No: el <b>608<\/b> trata de las deudas de <b>alimentos<\/b>, que no tienen estos límites. Lo de la última mensualidad sale del <b>171.3 LGT<\/b>.<\/li><li><b>T1:<\/b> revisa el segundo tramo de la tabla (30 % de 1.184 = 355,20, no 340,20).<\/li><\/ul><h4>Ejercicios<\/h4><p><b>Clave:<\/b> E1, E2, E4, E5, T1, T2, T3 y T10.<br><b>Arrastre:<\/b> E3, T4, T5, T6, T7, T8 y T9.<\/p>"}, {"id": "historia-embargos", "fecha": "2026-11-10", "titulo": "Historia · Embargos", "tag": "Historia", "corto": "Embargos", "arts": "Arts. 169 a 172 LGT · 76 a 100 RGR · 607 LEC", "html": "<p>La historia de ALBUS SA cuando Hacienda empieza a quitarle bienes.<\/p><h4>1 · Cuánto y en qué orden (169 LGT)<\/h4><p>ALBUS no ha pagado la providencia y Hacienda pasa a embargar. ¿Cuánto? El <b>169.1<\/b>: lo suficiente para cubrir <b>la deuda, los intereses, los recargos y las costas<\/b>, y siempre con <b>proporcionalidad<\/b>.<\/p><p>ALBUS debe 3.000 € y respira tranquila: «No me pueden quitar la nave por 3.000 €, vale 800.000». Depende. Tiene 10.000 € en el banco, así que Hacienda va al dinero, que es lo <b>más fácil de cobrar y lo menos gravoso<\/b>, y la nave ni se toca. Pero en otra versión de la historia ALBUS no tiene cuentas con saldo, ni clientes que le deban, ni otra cosa: la nave es lo único embargable.<\/p><p>Entonces sí se puede embargar. Proporcionalidad no significa que el bien valga lo mismo que la deuda, sino no coger más de lo necesario si hay otra forma suficiente; y si se vende, lo que sobre se le devuelve a ALBUS.<\/p><p>¿Qué primero? El <b>169.2<\/b>: lo que sea <b>más fácil de vender<\/b> y <b>menos gravoso<\/b> para ALBUS. Si eso no se puede aplicar, un orden fijo:<\/p><ul class=\"hl\"><li><b>a)<\/b> dinero y cuentas<\/li><li><b>b)<\/b> créditos, valores y derechos a corto plazo<\/li><li><b>c)<\/b> sueldos, salarios y pensiones<\/li><li><b>d)<\/b> inmuebles<\/li><li><b>e)<\/b> intereses, rentas y frutos<\/li><li><b>f)<\/b> establecimientos mercantiles<\/li><li><b>g)<\/b> joyas y antigüedades<\/li><li><b>h)<\/b> muebles y semovientes<\/li><li><b>i)<\/b> créditos a largo plazo.<\/li><\/ul><p>«Corto plazo» es que se pueda cobrar en <b>6 meses<\/b> o menos (<b>169.3<\/b>).<\/p><p>Se embarga lo que se conoce en cada momento, sucesivamente, hasta cubrir la deuda, y lo que exige <b>entrar en su domicilio, lo último<\/b>. ALBUS puede pedir <b>otro orden<\/b> si lo que ofrece cobra igual de rápido y no perjudica a nadie (<b>169.4<\/b>). Y no se embarga lo <b>inembargable<\/b> ni lo que costaría más vender que lo que se sacaría (<b>169.5<\/b>).<\/p><p>Un aviso antes de buscar bienes: si la deuda estaba <b>garantizada<\/b> (por ejemplo, con el aval de un aplazamiento), lo primero es <b>ejecutar la garantía<\/b> (<b>168<\/b>). Hacienda puede ir antes a otros bienes si la garantía no es proporcionada a la deuda o si ALBUS lo pide señalando bienes suficientes.<\/p><h4>2 · La diligencia de embargo (170 LGT y 76 RGR)<\/h4><p>Cada embargo se documenta en una <b>diligencia<\/b> (<b>170.1<\/b>), que se notifica a ALBUS y, si procede, al <b>tercero<\/b> titular, poseedor o depositario de los bienes (el banco, el almacén donde guarda mercancía) y a los <b>condueños o cotitulares<\/b>. Si el bien es de varios, se embarga solo la cuota de ALBUS. Cuando el deudor es una persona casada, como D. Manuel en el capítulo 4, también se notifica al <b>cónyuge<\/b> si los bienes son <b>gananciales<\/b> o si es la <b>vivienda habitual<\/b> (<b>76.3 RGR<\/b>).<\/p><p>Si el bien va a un registro (un piso, un camión), Hacienda pide <b>anotación preventiva<\/b> (<b>170.2<\/b>) con un mandamiento que vale como uno <b>judicial<\/b>, y una <b>certificación de cargas<\/b>. El embargo se notifica también a quien tenga cargas inscritas después de la anotación y antes de esa certificación. La anotación no cambia la preferencia de Hacienda para cobrar (art. 77) si se ejerce la tercería de mejor derecho.<\/p><p>¿Puede ALBUS oponerse a la diligencia? Solo por cuatro motivos (<b>170.3<\/b>):<\/p><ul class=\"hl\"><li><b>a)<\/b> la deuda está <b>extinguida o prescrita<\/b><\/li><li><b>b)<\/b> <b>no le notificaron la providencia de apremio<\/b><\/li><li><b>c)<\/b> se han <b>incumplido las normas del embargo<\/b> (por ejemplo, se embargó lo inembargable o se saltó el orden)<\/li><li><b>d)<\/b> el procedimiento está <b>suspendido<\/b>.<\/li><\/ul><p>Fíjate en el paralelo con el 167.3: contra cada acto se alega que no se notificó <b>el anterior<\/b>.<\/p><p>Y tres herramientas más para que lo embargado no se pierda:<\/p><p><b>170.4 · Llevarse los muebles.<\/b> Si se embargan cosas que se pueden mover (máquinas, mercancía, un ordenador), Hacienda puede ordenar que se guarden en un depósito, para que ALBUS no las venda o las haga desaparecer antes de la subasta.<\/p><p><b>170.5 · Un funcionario al mando.<\/b> Hacienda embarga la tienda de ALBUS con sus máquinas, clientes y cuentas. Si los que la dirigen pueden hundirla o vaciarla, Hacienda, <b>después de oír<\/b> al órgano de administración, puede nombrar a un funcionario como administrador o como interventor que revise antes sus decisiones importantes.<\/p><p><b>170.6 · Bloquear los inmuebles de la filial.<\/b> ALBUS tiene el 80 % de FILIAL SL, que es dueña de dos naves. Hacienda embarga a ALBUS sus participaciones en FILIAL. Pero esas participaciones valen lo que valen las naves: si FILIAL las vende, las participaciones quedan vacías.<\/p><p>Como ALBUS <b>controla<\/b> FILIAL (control efectivo, total o parcial, directo o indirecto, en los términos del <b>42 del Código de Comercio<\/b>, aunque no consolide cuentas), Hacienda puede <b>prohibir a FILIAL disponer de esas naves<\/b> y anotarlo en el Registro de la Propiedad, <b>aunque la deuda no sea de FILIAL<\/b> ni se dirija el procedimiento contra ella.<\/p><p>El recurso contra la prohibición solo puede alegar que falta algún presupuesto (que no hay control, que no hay embargo de participaciones). Se levanta cuando se extinga el embargo de las participaciones, por la causa que sea, o si FILIAL acredita que le causa perjuicios de <b>difícil o imposible reparación<\/b>.<\/p><h4>3 · Las cuentas del banco (171 LGT y 79 RGR)<\/h4><p>Lo primero que se busca es el dinero. Hacienda presenta la diligencia en el banco identificando una cuenta conocida, y el embargo puede <b>extenderse al resto<\/b> de bienes y derechos de ALBUS en esa entidad, conocidos o no, dentro del ámbito territorial de la Administración que embarga (<b>171.1<\/b> y <b>79.1 RGR<\/b>).<\/p><p>Si no hay un acuerdo con el banco que diga otra cosa, la oficina <b>retiene de inmediato<\/b> lo embargado o, si no llega, todo el saldo de ALBUS (<b>79.3<\/b>); si se presenta en una oficina distinta de donde están los fondos, el plazo para retener no puede pasar de <b>5 días<\/b>.<\/p><p>El banco ingresa lo retenido en el Tesoro cuando pasan <b>20 días naturales desde el día siguiente a la traba<\/b> sin que Hacienda le diga lo contrario (<b>79.6<\/b>). ALBUS tenía también un <b>depósito a plazo<\/b>: se embarga igual de inmediato (79.4), pero se ingresa en esa fecha o al día siguiente del vencimiento, la que sea posterior; y si ALBUS puede cancelarlo antes, se le avisa, y entonces se ingresa al día siguiente de cancelarlo.<\/p><p><b>Cuentas de varios titulares (171.2)<\/b>: solo se embarga la parte de ALBUS. Si la cuenta es indistinta o mancomunada, se presume que el saldo es <b>a partes iguales<\/b>, salvo que se demuestre otra titularidad material. Y si D. Manuel solo está <b>autorizado<\/b> en una cuenta de ALBUS, puede mover el dinero, pero no es suyo: por sus deudas personales esa cuenta no se embarga.<\/p><p><b>La cuenta donde se cobra la nómina (171.3)<\/b>: hay que respetar los límites de la LEC sobre lo que se ingresó como sueldo <b>ese mes o, si no, el anterior<\/b>. Lo vemos en el capítulo 4.<\/p><p><b>¿Y si el banco falla?<\/b> No todo error convierte al banco en responsable. El <b>42.2 LGT<\/b> lo hace responsable solidario, hasta el valor de lo que se podría haber embargado, en casos concretos:<\/p><ul class=\"hl\"><li><b>b)<\/b> si <b>por culpa o negligencia incumple la orden de embargo<\/b><\/li><li><b>c)<\/b> si, sabiendo del embargo, <b>colabora o consiente en que se levanten<\/b> los bienes<\/li><li><b>d)<\/b> si, como depositario, una vez notificado, colabora o consiente en ese levantamiento.<\/li><\/ul><p>Para comprobarlo, Hacienda puede pedir los <b>movimientos de la cuenta<\/b> (<b>93.3 LGT<\/b>). Se los puede pedir a ALBUS; para pedírselos directamente al banco necesita la <b>autorización previa<\/b> del órgano competente o el <b>consentimiento<\/b> de ALBUS (<b>57.1 RGAT<\/b>).<\/p><h4>4 · Los sueldos y pensiones (82 RGR y 607 LEC)<\/h4><p>ALBUS es una sociedad: no tiene nómina, ni pensión, ni cónyuge. Aquí entra <b>D. Manuel<\/b>, su administrador, que tiene su <b>propia<\/b> deuda de IRPF con Hacienda, sin relación con las deudas de ALBUS. Cobra de ALBUS 3.000 € netos al mes, en 14 pagas.<\/p><p>Hacienda le embarga el sueldo en origen: la diligencia va al <b>pagador<\/b>, que aquí es ALBUS. ALBUS tiene que retener cada mes e ingresarlo en el Tesoro (<b>82.1 RGR<\/b>). Si D. Manuel cobra varias nóminas o pensiones, se suman para descontar una sola vez la parte inembargable (<b>82.2<\/b> y <b>607.3 LEC<\/b>).<\/p><p>¿Cuánto? Según el <b>607 LEC<\/b>, sobre el <b>líquido<\/b>, es decir, después de las retenciones de IRPF y Seguridad Social (<b>607.5<\/b>). Hasta el salario mínimo es <b>inembargable<\/b> (<b>607.1<\/b>); lo que lo supera, por tramos de SMI (<b>607.2<\/b>): <b>2.º SMI, 30 % · 3.º, 50 % · 4.º, 60 % · 5.º, 75 % · el resto, 90 %<\/b>. El sueldo se corta en trozos del tamaño de un SMI y a cada trozo se le aplica su porcentaje. Con el <b>SMI de 2026, 1.221 € al mes en 14 pagas<\/b> (RD 126/2026):<\/p><div class=\"itab\"><table><thead><tr><th>Tramo<\/th><th>Desde – hasta<\/th><th>Se embarga<\/th><th>Máx. del tramo<\/th><\/tr><\/thead><tbody><tr><td>1.º SMI<\/td><td>0 – 1.221<\/td><td>0 %<\/td><td>0<\/td><\/tr><tr><td>2.º SMI<\/td><td>1.221 – 2.442<\/td><td>30 %<\/td><td>366,30<\/td><\/tr><tr><td>3.º SMI<\/td><td>2.442 – 3.663<\/td><td>50 %<\/td><td>610,50<\/td><\/tr><tr><td>4.º SMI<\/td><td>3.663 – 4.884<\/td><td>60 %<\/td><td>732,60<\/td><\/tr><tr><td>5.º SMI<\/td><td>4.884 – 6.105<\/td><td>75 %<\/td><td>915,75<\/td><\/tr><tr><td>Resto<\/td><td>más de 6.105<\/td><td>90 %<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><p><b>Ejemplo 2026<\/b>, nómina líquida de 3.000 €: primeros 1.221 → 0 · de 1.221 a 2.442 (1.221 €) al 30 % → 366,30 · de 2.442 a 3.000 (558 €) al 50 % → 279 · <b>total 645,30 €<\/b>. Si D. Manuel cobrara 1.200 €, no llega al SMI: <b>nada embargable<\/b>.<\/p><p><b>Las pagas extra<\/b> (TEAC 17-5-2022, RG 1975/2022). En junio, D. Manuel cobra su nómina y la paga extra por separado: ese mes el tramo libre es el <b>doble del SMI<\/b>, 2.442 €. Si tuviera las pagas <b>prorrateadas<\/b> en 12 nóminas, el tramo libre de cada mes sería el SMI anual entre 12: 1.221 × 14 / 12 = <b>1.424,50 €<\/b>. Y sobre lo que exceda, la escala.<\/p><p><b>Más detalles del 607:<\/b> si D. Manuel está casado en gananciales, también pueden sumarse los sueldos de su cónyuge (<b>607.3<\/b>); si está en separación de bienes, no. Con cargas familiares, los porcentajes de los cuatro primeros tramos embargables <b>pueden<\/b> rebajarse entre un 10 y un 15 %: no es automático, lo decide quien embarga (<b>607.4<\/b>).<\/p><p>Las mismas reglas valen para los ingresos de <b>autónomos<\/b> y profesionales (<b>607.6<\/b>). Y si la deuda es de <b>alimentos<\/b>, el 608 permite pasar de estos límites, pero el juez fija cuánto.<\/p><p><b>La nómina en la cuenta.<\/b> Ahora Hacienda no embarga en origen, sino la cuenta donde D. Manuel cobra. El criterio clásico, el de Morón, era: lo que no se gastó en el mes se convierte en ahorro y se embarga entero.<\/p><p><b>El TEAC lo cambió el 18-6-2025<\/b> (RG 1140/2022): la parte inembargable de cada nómina <b>no pierde su protección<\/b> por quedarse en la cuenta ni por acumularse, porque el 607 LEC no pone límite temporal. Eso no vale para la parte que ya era embargable desde que la cobró: esa nunca estuvo protegida.<\/p><p><b>Pero cuidado con comparar el saldo con la nómina<\/b> (TEAC 30-4-2026, RG 4803/2024). Octubre: D. Manuel cobra su nómina de 3.000 € (1.221 protegidos y 1.779 embargables), su hermano le pasa 500 € y gasta 2.700 €. Cuando llega el embargo, quedan 800 €.<\/p><p>Como 800 € es menos que la nómina, podría parecer que todo es nómina y está protegido. No. Si no se puede saber qué dinero se gastó, se presume que <b>lo primero que se gasta es la parte inembargable<\/b>: los 1.221 € protegidos se fueron en el mes. Los 800 € que quedan vienen de dinero embargable (la parte embargable del sueldo y los 500 € del hermano), así que <b>se embargan enteros<\/b>.<\/p><p>Si los movimientos demuestran que el saldo viene solo de dinero embargable, también se embarga entero. Y si en la cuenta solo entran nóminas inembargables, el saldo es inembargable. La prueba es de D. Manuel: tiene que acreditar con extractos y nóminas qué parte del saldo es salario protegido.<\/p><p>Si se embargó de más, se levanta el exceso y se devuelve (ingreso indebido). Y los <b>bienes gananciales<\/b> de D. Manuel y su cónyuge responden de la deuda de IRPF de él (<b>106 LIRPF<\/b>, que se remite al Código Civil); por eso la diligencia se notifica al cónyuge (76.3 RGR).<\/p><h4>5 · Otros bienes (80, 83, 89, 92 y 100 RGR)<\/h4><p><b>Valores (80 RGR)<\/b>: ALBUS tiene acciones en bolsa. Se embargan las suficientes y, si cotizan en un mercado oficial, se venden <b>a través de ese mercado<\/b>; si no, por subasta, salvo adjudicación directa (<b>80.4<\/b>). El banco descuenta comisiones y el sobrante es de ALBUS. O, si conviene más, se embargan sus <b>rendimientos<\/b> en vez de venderlas (<b>80.5<\/b>).<\/p><p><b>Intereses, rentas y frutos (89 RGR)<\/b>: ALBUS alquila un local a un tercero. La diligencia va al inquilino, que paga la renta a Hacienda en lugar de a ALBUS.<\/p><p><b>Inmuebles (83 RGR)<\/b>: diligencia con los datos de la finca y del débito, advertencia de la anotación preventiva y requerimiento de los títulos de propiedad. La anotación dura <b>4 años<\/b>, pero puede <b>prorrogarse<\/b> si se pide antes de que caduque (86 de la Ley Hipotecaria).<\/p><p><b>Muebles y vehículos (92 RGR)<\/b>: personación donde estén, diligencia y precinto si no se depositan (<b>92.1-2<\/b>), anotación en el Registro de Bienes Muebles si se puede (<b>92.3<\/b>). Hacienda embarga la furgoneta de reparto de ALBUS: le da <b>5 días<\/b> para entregarla con papeles y llaves; si no, ordena a Tráfico su captura y precinto (<b>92.4<\/b>).<\/p><p>¿Y luego? Se depositan y se venden. La forma normal es la <b>subasta pública<\/b>, electrónica (<b>100.2 RGR<\/b>). El depósito, la valoración y las subastas tienen su propio apartado en Morón.<\/p><h4>6 · Antes de que vendan (172 y 65.5 LGT)<\/h4><p>Embargar no es vender. Hacienda no puede vender lo embargado hasta que la <b>liquidación<\/b> de la deuda sea <b>firme<\/b>, salvo fuerza mayor, bienes perecederos, riesgo de pérdida inminente de valor o que ALBUS lo pida expresamente (<b>172.3<\/b>).<\/p><p>Se vende por <b>subasta, concurso o adjudicación directa<\/b> (<b>172.1<\/b>). ALBUS quiere recurrir el acuerdo de enajenación, pero solo puede hacerlo si las diligencias de embargo se tuvieron por notificadas porque <b>no compareció<\/b> a recoger la notificación (112.3), y entonces solo por los cuatro motivos del 170.3.<\/p><p>ALBUS pide un aplazamiento para ganar tiempo. Llega a tiempo si lo presenta <b>antes de que le notifiquen el acuerdo de enajenación<\/b> (<b>65.5<\/b>); mientras se tramita, Hacienda puede seguir con el apremio, pero no vender. Si lo presenta después, ya no tiene ese efecto. Lo que le queda en cualquier caso es <b>pagar la deuda y las costas antes de la adjudicación<\/b>, y entonces se liberan los bienes (<b>172.4<\/b>).<\/p><p>La nave sale a subasta con un tipo de 200.000 € y nadie puja. Hacienda puede <b>quedársela<\/b> (<b>172.2<\/b>), pero no por lo que quiera: por el <b>importe de la deuda perseguida<\/b>, con un tope del <b>75 % del tipo inicial<\/b>. Si ALBUS debe 60.000 €, se la adjudica por 60.000. Si debe 300.000, como máximo por 150.000, y el resto sigue pendiente.<\/p><p><b>La historia en una frase:<\/b> se embarga lo justo (169.1) y por orden (169.2), pero con una garantía, primero la garantía (168); cada embargo va en una diligencia que se notifica y, si hay registro, se anota (170.1-2), y contra ella solo valen cuatro motivos (170.3); primero el dinero del banco (171, 79 RGR), con cuidado con la nómina (171.3, 607 LEC y TEAC), luego el resto (80-92 RGR), y no se vende hasta que la liquidación sea firme (172.3), salvo que pague antes de la adjudicación (172.4).<\/p><p class=\"inota\">Comprobado con el BOE consolidado: LGT, RGR, LEC, RGAT y LIRPF. SMI de 2026 según el RD 126/2026. Criterios del TEAC de 17-5-2022 (RG 1975/2022), 18-6-2025 (RG 1140/2022) y 30-4-2026 (RG 4803/2024).<\/p>", "indice": [["169 LGT · Cuánto y en qué orden", [["169.1", "Deuda + intereses + recargos + costas · proporcionalidad"], ["169.2", "Facilidad y menor onerosidad · si no, orden a) a i)"], ["169.2.a", "Dinero y cuentas"], ["169.2.b", "Créditos y valores a corto"], ["169.2.c", "Sueldos, salarios y pensiones"], ["169.2.d", "Inmuebles"], ["169.2.e-i", "Rentas, establecimientos, joyas, muebles, créditos a largo"], ["169.3", "Corto plazo: 6 meses o menos"], ["169.4", "Sucesivamente · domicilio al final · el deudor puede alterar el orden"], ["169.5", "Inembargables o que no compensa vender"], ["168", "Deuda garantizada: primero la garantía"]]], ["170 LGT · La diligencia", [["170.1", "Notificación: obligado, tercero, cónyuge (gananciales), cotitulares"], ["76.3 RGR", "Además: vivienda habitual · cargas posteriores · pro indiviso"], ["170.2", "Anotación preventiva · mandamiento judicial · certificación de cargas"], ["170.3.a", "Extinción o prescripción"], ["170.3.b", "Falta de notificación de la providencia"], ["170.3.c", "Incumplir las normas del embargo"], ["170.3.d", "Suspensión"], ["170.4", "Depósito de muebles"], ["170.5", "Administrador o interventor, previa audiencia"], ["170.6", "Prohibir disponer de inmuebles de la sociedad controlada"]]], ["171 LGT · Cuentas", [["171.1", "Cuenta conocida, se extiende al resto en la entidad"], ["79.3 RGR", "Retención inmediata (máx. 5 días si es otra oficina)"], ["79.6 RGR", "Ingreso a los 20 días naturales desde el día siguiente a la traba"], ["79.4-6 RGR", "Depósitos a plazo"], ["171.2", "Varios titulares: partes iguales salvo prueba"], ["171.3", "Cuenta de la nómina: límites de la LEC"], ["42.2.b-d LGT", "Responsables solidarios: incumplir por culpa, colaborar o consentir"], ["93.3 LGT · 57.1 RGAT", "Movimientos: autorización previa o consentimiento"]]], ["82 RGR y 607 LEC · Sueldos", [["82.1", "Diligencia al pagador, que retiene"], ["82.2", "Varias percepciones se suman"], ["607.1 LEC", "Hasta el SMI, inembargable (2026: 1.221 €)"], ["607.2 LEC", "Tramos: 30 / 50 / 60 / 75 / 90 %"], ["607.3 LEC", "Se suman percepciones (y las del cónyuge si no hay separación)"], ["607.4 LEC", "Cargas familiares: rebaja del 10-15 %, potestativa"], ["607.5 LEC", "Sobre el líquido"], ["607.6 LEC", "También autónomos y profesionales"], ["608 LEC", "Alimentos: sin estos límites, lo fija el juez"], ["TEAC 2022", "Paga extra: doble SMI · prorrateadas: SMI × 14 / 12"], ["TEAC 18-6-2025", "Lo inembargable acumulado sigue protegido"], ["TEAC 30-4-2026", "Lo primero que se gasta es lo inembargable · no basta comparar con la nómina"], ["106 LIRPF", "Gananciales responden del IRPF del cónyuge"]]], ["Otros bienes", [["80.4 RGR", "Valores: en su mercado si cotizan"], ["80.5 RGR", "O sus rendimientos"], ["89 RGR", "Rentas y frutos: paga el pagador a Hacienda"], ["83 RGR", "Inmuebles: diligencia y anotación (4 años prorrogables)"], ["92.4 RGR", "Vehículos: 5 días · si no, captura"], ["100.2 RGR", "Subasta pública"]]], ["172 y 65.5 LGT · Antes de vender", [["172.1", "Subasta, concurso o adjudicación directa · impugnación limitada"], ["172.2", "Adjudicación a Hacienda: por la deuda, tope 75 % del tipo"], ["172.3", "No vender hasta la firmeza de la liquidación"], ["172.4", "Pagar antes de la adjudicación libera los bienes"], ["65.5", "Aplazar: hasta la notificación del acuerdo de enajenación"]]]]}, {"id": "historia-ejecutivo", "fecha": "2026-11-10", "titulo": "Historia · Periodo ejecutivo", "tag": "Historia", "html": "<p>La historia de ALBUS SA cuando no paga a tiempo.<\/p><h4>1 · El reloj de la voluntaria (62 LGT)<\/h4><p>ALBUS SA vende muebles y tiene dos tipos de deudas con Hacienda. Las que calcula ella misma, las <b>autoliquidaciones<\/b>, se pagan en el plazo de cada impuesto (<b>62.1<\/b>): el IVA de los tres primeros trimestres, hasta el 20 del mes siguiente; el del <b>cuarto<\/b>, hasta el <b>30 de enero<\/b>.<\/p><p>Y las que calcula Hacienda, las <b>liquidaciones<\/b>, tienen un reloj que empieza el día en que se notifican (<b>62.2<\/b>): notificada en la <b>primera quincena<\/b>, hasta el <b>20 del mes siguiente<\/b>; en la <b>segunda quincena<\/b>, hasta el <b>5 del segundo mes siguiente<\/b>. Si ese día es inhábil, el siguiente hábil.<\/p><p>El 10 de septiembre le llega una liquidación de 21.000 €. Primera quincena: tiene hasta el 20 de octubre. Si le hubiera llegado el 25 de septiembre, hasta el 5 de noviembre.<\/p><p>Dos trampas sobre <b>cuándo<\/b> se entiende notificada. Si ALBUS firma un <b>acta de conformidad<\/b>, la liquidación se entiende hecha y notificada al <b>mes<\/b>, salvo que en ese mes Hacienda le notifique otra cosa: que corrige errores, que completa el expediente, que confirma la propuesta o que la ve mal y le da audiencia (<b>156.3<\/b>).<\/p><p>Y si ALBUS está obligada a recibir notificaciones electrónicas y no abre una, se entiende <b>rechazada<\/b>, y el trámite cumplido, a los <b>10 días naturales<\/b> de ponerla a su disposición (<b>43.2 Ley 39/2015<\/b>). Abrirla después no cambia la fecha.<\/p><h4>2 · Suena la alarma: empieza el periodo ejecutivo (161 LGT)<\/h4><p>ALBUS no paga a tiempo y suena la alarma (<b>161.1<\/b>): si es una <b>liquidación<\/b>, el periodo ejecutivo empieza al día siguiente de acabar el plazo del 62; si es una <b>autoliquidación presentada sin pagar<\/b>, al día siguiente de acabar su plazo o, si la presenta cuando ya había acabado, al día siguiente de presentarla.<\/p><p>Ojo: <b>empezar el periodo ejecutivo no es empezar el apremio<\/b>. El periodo ejecutivo empieza solo, por el calendario (161). El procedimiento de apremio empieza cuando Hacienda le <b>notifica la providencia de apremio<\/b> (167). Entre una cosa y otra, ALBUS ya está en ejecutiva pero aún no le han mandado la carta.<\/p><p>¿Qué apaga la alarma? (<b>161.2<\/b>) Si ALBUS pide en voluntaria un <b>aplazamiento, fraccionamiento o compensación<\/b>, el periodo ejecutivo no empieza mientras se tramita. Si se lo deniegan, tendrá el plazo del 62.2 para pagar con intereses (52.4 RGR). Pero ALBUS intenta un truco: se lo deniegan, no paga en el nuevo plazo y presenta otra solicitud para ganar tiempo.<\/p><p>Esta vez <b>no funciona<\/b>: cuando ya se denegó una solicitud de esa deuda en voluntaria y se abrió otro plazo que no pagó, las nuevas solicitudes de aplazamiento, fraccionamiento, compensación, <b>suspensión o pago en especie<\/b> no impiden que empiece el periodo ejecutivo.<\/p><p>Y una excepción para las <b>sanciones<\/b>: si ALBUS recurre a tiempo una sanción, su periodo ejecutivo no empieza hasta que sea <b>firme en vía administrativa<\/b> y acabe el plazo voluntario que se abra entonces.<\/p><h4>3 · Pagar tarde por tu cuenta (27 LGT)<\/h4><p>Otra historia distinta. ALBUS olvida presentar el IVA del primer trimestre (plazo, el 20 de abril). El 25 de junio se da cuenta y lo presenta <b>por su cuenta<\/b>, sin que Hacienda le haya dicho nada. Eso es una presentación extemporánea <b>sin requerimiento previo<\/b>, y tiene un premio y un castigo pequeños: el <b>recargo del 27<\/b>.<\/p><p>Es un <b>1 %<\/b> más otro <b>1 % por cada mes completo<\/b> de retraso, <b>sin intereses ni sanción<\/b> (<b>27.2<\/b>). Han pasado 2 meses completos: 3 %. Si se retrasa <b>más de 12 meses<\/b>, el recargo es del <b>15 %<\/b>, sin sanción, pero con intereses desde el día siguiente a esos 12 meses hasta que presenta.<\/p><p><b>¿Qué es requerimiento previo?<\/b> (<b>27.1<\/b>) Cualquier actuación de Hacienda, conocida formalmente por ALBUS, dirigida a comprobar, regularizar o liquidar esa deuda. Si Hacienda se había movido antes, ya no hay régimen del 27; podría haber infracción, pero solo si se cumplen sus requisitos, incluida la culpabilidad: lo veremos en la historia de sanciones.<\/p><p><b>La rebaja del 25 % (27.5).<\/b> ALBUS paga los 1.000 € de IVA al presentar la autoliquidación. Semanas después, Hacienda le notifica la liquidación del recargo: 30 €. Si paga el recargo <b>con la rebaja del 25 %<\/b>, 22,50 €, dentro del plazo del <b>62.2<\/b> que abre esa notificación, se queda con la rebaja.<\/p><p>Las dos condiciones: pagar <b>toda la deuda<\/b> al presentar (o a tiempo, si es una declaración que liquida Hacienda) y pagar el recargo reducido en su plazo. La deuda también puede ir aplazada o fraccionada, si lo pidió al presentar y está garantizada con <b>aval o seguro de caución<\/b>, y paga en esos plazos. Si falla algo, le exigen el 25 % rebajado sin más trámite.<\/p><p><b>La trampa de los exámenes (27.3).<\/b> Ahora ALBUS presenta tarde y <b>no paga<\/b>, ni pide aplazamiento, fraccionamiento o compensación al presentarla. Le caen dos cosas: el <b>recargo del 27<\/b>, por presentar tarde, y el <b>periodo ejecutivo<\/b>, que empieza al día siguiente de presentar (161.1.b), con los <b>recargos del 28<\/b> sobre el importe autoliquidado. Son compatibles.<\/p><p><b>Dos detalles.<\/b> La autoliquidación tardía debe <b>identificar expresamente el periodo<\/b> y llevar <b>solo datos de ese periodo<\/b> (<b>27.4<\/b>): si ALBUS mete en el IVA del segundo trimestre lo que se le olvidó en el primero, no hay régimen del 27. Y una escena que perdona el recargo (<b>27.2<\/b>):<\/p><p>Hacienda regulariza el IVA de 2023 por un error de ALBUS, y ALBUS ve que en 2024 hizo lo mismo. Si presenta 2024 corrigiéndolo en los <b>6 meses<\/b> desde que le notificaron la liquidación de 2023, lo paga entero, no recurre ni pide rectificar la de 2023 y de esa regularización no salió sanción, <b>no paga recargo<\/b>.<\/p><h4>4 · El precio de llegar tarde (28 LGT)<\/h4><p>Volvemos a la liquidación de 21.000 € que ALBUS no pagó en voluntaria. Desde que empieza el periodo ejecutivo, se devenga el recargo (<b>28.1<\/b>), calculado <b>siempre sobre los 21.000 €<\/b> que no pagó en voluntaria. Hay tres, incompatibles entre sí, y no van subiendo solos con el tiempo: depende de <b>lo que haga ALBUS y de cuándo<\/b>.<\/p><p><b>5 %, recargo ejecutivo (28.2):<\/b> paga <b>toda<\/b> la deuda antes de que le notifiquen la providencia. ALBUS paga 20.000 € el primer día de ejecutiva. Aún no tiene el 5 %: le faltan 1.000. Si paga esos 1.000 € antes de que llegue la providencia, sí: 5 % de 21.000 = <b>1.050 €<\/b>.<\/p><p><b>10 %, apremio reducido (28.3):<\/b> le llega la providencia antes de pagar los 1.000 €. Ya no hay 5 %. Si paga los 1.000 € <b>y el propio recargo<\/b>, 10 % de 21.000 = 2.100 €, dentro del plazo del <b>62.5<\/b>, se queda en el 10 %: 3.100 € en total.<\/p><p><b>20 %, apremio ordinario (28.4):<\/b> en cualquier otro caso. Si deja pasar el plazo de la providencia, o paga los 1.000 € pero no los 2.100 € del recargo, 20 % de 21.000 = 4.200 €, más intereses.<\/p><h4>5 · El taxímetro (26 LGT)<\/h4><p>Mientras ALBUS no paga, corre el taxímetro de los <b>intereses de demora<\/b>: el interés legal <b>incrementado en un 25 %<\/b>, salvo que la Ley de Presupuestos diga otro (<b>26.6<\/b>).<\/p><p>En el periodo ejecutivo (<b>28.5<\/b>): con el recargo del <b>5 % o del 10 %<\/b>, no se cobran los intereses que corrieron <b>desde que empezó el periodo ejecutivo<\/b>. Con el <b>20 %<\/b>, sí. Por ejemplo, 10.000 € pendientes durante 73 días con un 4,0625 %: 10.000 × 4,0625 % × 73/365 = <b>81,25 €<\/b>.<\/p><p>No los confundas con otros intereses: los que ya traía la liquidación por el retraso anterior, los de un aplazamiento (53 RGR) o los de una suspensión. Cada uno tiene su regla.<\/p><h4>6 · La carta de apremio (167 LGT)<\/h4><p>Por fin llega la <b>providencia de apremio<\/b> (<b>167.1<\/b>): identifica la deuda, liquida el recargo del 28 y requiere el pago. Es un <b>título ejecutivo<\/b> con la misma fuerza que una <b>sentencia judicial<\/b> para ir contra los bienes de ALBUS (<b>167.2<\/b>). Plazo para pagar (<b>62.5<\/b>): notificada en la <b>primera quincena<\/b>, hasta el <b>20 de ese mes<\/b>; en la <b>segunda<\/b>, hasta el <b>5 del mes siguiente<\/b>. Si no paga, <b>embargo<\/b> (<b>167.4<\/b>), y así se lo advierte la propia providencia.<\/p><p>ALBUS, indignada, recurre la providencia: «La liquidación está mal hecha, Hacienda calculó mal la base». Se desestima. Contra la providencia solo valen <b>cinco motivos<\/b> (<b>167.3<\/b>):<\/p><ul class=\"hl\"><li><b>a)<\/b> deuda <b>extinguida<\/b> o derecho a cobrar <b>prescrito<\/b><\/li><li><b>b)<\/b> <b>aplazamiento, fraccionamiento o compensación pedidos en voluntaria<\/b>, u otra causa de <b>suspensión<\/b><\/li><li><b>c)<\/b> <b>falta de notificación de la liquidación<\/b><\/li><li><b>d)<\/b> <b>liquidación anulada<\/b><\/li><li><b>e)<\/b> <b>error u omisión<\/b> en la providencia que impida identificar al deudor o la deuda.<\/li><\/ul><p>Lo de la base había que discutirlo recurriendo <b>la liquidación<\/b>, en su plazo.<\/p><p>Y ALBUS aprende otra cosa: <b>recurrir la providencia no para el cobro<\/b>. Si quiere que se pare, tiene que pedir la suspensión.<\/p><h4>7 · Parar la máquina (165, 224, 233 y 212.3 LGT)<\/h4><p>ALBUS recurre la liquidación y se queda tranquila. Error: <b>recurrir no suspende por sí solo<\/b>. Para parar la máquina hay que pedir la suspensión, y no es lo mismo <b>presentar<\/b> la solicitud, que se <b>admita<\/b> o que se <b>conceda<\/b>.<\/p><p><b>Con garantía, automática (224 y 233.1-2):<\/b> si garantiza el importe, los intereses y los recargos con <b>depósito, aval o seguro de caución, o fianza solidaria<\/b> de otros contribuyentes solventes, la suspensión es automática. <b>Con otras garantías (233.3):<\/b> si no puede darlas, puede ofrecer otras; no es automática y la decide el órgano competente (el de recaudación, según el 44 RGRVA).<\/p><p><b>Con dispensa (233.4):<\/b> si ejecutar le causaría perjuicios de <b>difícil o imposible reparación<\/b>, el tribunal puede dispensarla total o parcialmente. <b>Sin garantía (224.3 y 233.5):<\/b> si hubo error aritmético, material o de hecho.<\/p><p><b>Cuándo la pide importa.<\/b> ALBUS pidió la suspensión con otras garantías el 1 de octubre, cuando la deuda aún estaba en voluntaria y la solicitud seguía pendiente. Si le llega una providencia, puede oponerse por el 167.3.b. Pero si la hubiera pedido ya en ejecutiva, esas solicitudes (otras garantías, dispensa o error) <b>no frenan<\/b> las actuaciones; solo se anulan las posteriores si al final se concede (<b>233.9<\/b>).<\/p><p><b>Las sanciones van aparte (212.3):<\/b> si ALBUS recurre a tiempo una <b>sanción<\/b>, se suspende automáticamente en voluntaria, sin garantía, hasta que sea firme en vía administrativa, y sin intereses hasta que acabe el plazo que se abra entonces. Recurrir solo la liquidación no suspende la sanción.<\/p><p>El apremio también se para <b>sin garantía<\/b> si ALBUS demuestra que hay un <b>error material, aritmético o de hecho<\/b> en la deuda, o que ya está <b>pagada, condonada, compensada, aplazada o suspendida<\/b>, o que ha <b>prescrito<\/b> (<b>165.2<\/b>). Y si un tercero dice que un bien embargado es suyo (tercería), se para para ese bien (<b>165.3-5<\/b>). Los detalles de los recursos y sus plazos, en su propia historia.<\/p><h4>8 · Otras formas de pagar (33 y 38 RGR, 62.2 RIRPF)<\/h4><p><b>Paga un tercero (33 RGR).<\/b> El fundador de ALBUS, ya fuera de la empresa, quiere pagar la deuda por su buen nombre. Puede hacerlo, en voluntaria o en ejecutiva, pero no adquiere los derechos de ALBUS frente a Hacienda.<\/p><p><b>Domiciliación (38.3 RGR).<\/b> ALBUS domicilia un pago y el banco no lo carga, o lo carga tarde, por un fallo suyo. Como no es culpa de ALBUS, no se le exigen <b>recargos, intereses ni sanciones<\/b>; los intereses, en su caso, se los cobran al banco. Si el cargo falla porque ALBUS no tenía saldo, eso sí es culpa suya.<\/p><p><b>El IRPF en dos plazos (62.2 RIRPF).<\/b> D. Manuel, el administrador, presenta su Renta en plazo con 1.000 € a pagar. Puede fraccionarlo sin intereses, recargo ni garantía: el <b>60 %<\/b> al presentar y el <b>40 %<\/b> en el plazo que fija la orden de cada campaña (en las últimas, hasta el <b>5 de noviembre<\/b>). Solo con la declaración en plazo y no en complementarias. Si no paga el primer 60 %, el periodo ejecutivo afecta a <b>todo<\/b> el importe; si falla solo el 40 %, a esa parte.<\/p><p><b>La historia en una frase:<\/b> el reloj del 62 se acaba y suena la alarma del 161, que no es aún el apremio; si ALBUS presenta tarde por su cuenta, recargo del 27, con su rebaja del 25 % si paga todo; en ejecutiva, 5, 10 o 20 % según lo que haga (28), con intereses solo con el 20 % (26 y 28.5); la providencia (167) se discute solo por cinco motivos, y para parar la máquina hay que pedir la suspensión con garantía (224 y 233), salvo las sanciones (212.3).<\/p><p class=\"inota\">Comprobado con el BOE consolidado (LGT, RGR, Ley 39/2015). El fraccionamiento del IRPF, con la información de la AEAT para la campaña.<\/p>", "corto": "Periodo ejecutivo", "arts": "Arts. 62, 161, 27, 28, 26, 167, 165, 224, 233 LGT", "indice": [["62 LGT · El reloj de la voluntaria", [["62.1", "Autoliquidaciones: plazo de cada impuesto (IVA 4T: 30 de enero)"], ["62.2.a", "Notificada 1-15 → día 20 del mes siguiente"], ["62.2.b", "Notificada 16-fin → día 5 del segundo mes"], ["156.3", "Acta de conformidad: liquidación tácita al mes, salvo acuerdo"], ["43.2 L39", "Notificación electrónica: rechazada a los 10 días naturales"]]], ["161 LGT · Suena la alarma", [["161.1.a", "Liquidación: día siguiente al fin del 62"], ["161.1.b", "Autoliquidación sin pago: fin del plazo o día siguiente a presentarla"], ["161.2", "Aplazamiento, fraccionamiento o compensación en voluntaria lo impiden"], ["161.2", "Salvo solicitud reiterada tras denegación y nuevo plazo impagado"], ["161.2", "Sanción recurrida: no empieza hasta la firmeza"], ["167.1", "El apremio empieza con la providencia, no con el 161"]]], ["27 LGT · Pagar tarde por tu cuenta", [["27.1", "Sin requerimiento previo (concepto de requerimiento)"], ["27.2", "1 % + 1 % por mes completo · más de 12 meses: 15 % + intereses"], ["27.2", "Sin recargo: otros periodos con hechos idénticos, 6 meses, pago, sin recurso ni sanción"], ["27.3", "Sin pago ni solicitud: compatible con los recargos del 28"], ["27.4", "Identificar el periodo y solo sus datos"], ["27.5", "Rebaja del 25 %: pagar toda la deuda y el recargo en el plazo del 62.2"]]], ["28 LGT · Los recargos", [["28.1", "Se devengan al empezar el ejecutivo · sobre toda la deuda no pagada · incompatibles"], ["28.2", "5 %: todo antes de la providencia"], ["28.3", "10 %: todo + recargo en el plazo del 62.5"], ["28.4", "20 %: el resto"], ["28.5", "5 % y 10 % sin intereses desde el ejecutivo · 20 % con intereses"]]], ["26 LGT · El taxímetro", [["26.6", "Interés legal + 25 %, salvo LPGE"], ["28.5", "Con 5 % y 10 % no se exigen los del periodo ejecutivo"]]], ["167 LGT · La carta de apremio", [["167.1", "Providencia: deuda, recargo y requerimiento de pago"], ["167.2", "Título ejecutivo = sentencia judicial"], ["167.3.a", "Extinción o prescripción"], ["167.3.b", "Aplazamiento, fraccionamiento o compensación en voluntaria, u otra suspensión"], ["167.3.c", "Falta de notificación de la liquidación"], ["167.3.d", "Liquidación anulada"], ["167.3.e", "Error que impide identificar deudor o deuda"], ["167.4", "Sin pago → embargo"], ["62.5.a", "Notificada 1-15 → día 20 de ese mes"], ["62.5.b", "Notificada 16-fin → día 5 del mes siguiente"]]], ["165, 224, 233, 212.3 · Parar la máquina", [["224.1-2", "Suspensión automática con garantía (depósito, aval/caución, fianza)"], ["224.3", "Sin garantía: error aritmético, material o de hecho"], ["233.1-2", "Reclamación: automática con las mismas garantías"], ["233.3", "Otras garantías → la decide el órgano (44 RGRVA)"], ["233.4", "Perjuicios irreparables → dispensa del tribunal"], ["233.5", "Sin garantía: error"], ["233.9", "En ejecutiva, esas solicitudes no frenan las actuaciones"], ["212.3", "Sanción recurrida: suspendida sin garantía hasta la firmeza"], ["165.2", "Suspensión sin garantía: error, pagada, compensada, aplazada, prescrita"], ["165.3-5", "Tercerías"]]], ["Otras formas de pagar", [["33 RGR", "Paga un tercero, sin sus derechos"], ["38.3 RGR", "Domiciliación: si no es culpa del obligado, sin recargos ni intereses"], ["62.2 RIRPF", "IRPF 60 % / 40 % (fecha de la orden anual)"]]]]}, {"id": "historia-aplazamientos", "fecha": "2026-11-04", "titulo": "Historia · Aplazamientos", "tag": "Historia", "html": "<p>La historia de ALBUS SA cuando no puede pagar a Hacienda, contada artículo por artículo y con todos sus casos.<\/p><h4>1 · La petición (65 LGT)<\/h4><p>ALBUS SA tiene que pagar a Hacienda, pero ahora mismo no tiene liquidez. No está arruinada: es un bache <b>transitorio<\/b>. El <b>65.1 LGT<\/b> le abre la puerta: cualquier deuda, esté en <b>periodo voluntario o ejecutivo<\/b>, se puede <b>aplazar<\/b> (pagar más tarde de una vez) o <b>fraccionar<\/b> (pagar en varios trozos), siempre que lo <b>pida<\/b> y su situación económico-financiera le impida pagar a tiempo.<\/p><p>En la puerta hay un portero con una lista de prohibidos, el <b>65.2<\/b>. No pasan:<\/p><ul class=\"hl\"><li><b>a)<\/b> las deudas que se pagan con <b>efectos timbrados<\/b><\/li><li><b>b)<\/b> las <b>retenciones e ingresos a cuenta<\/b>, porque es dinero de los trabajadores que ALBUS solo guarda<\/li><li><b>c)<\/b> en un concurso, los <b>créditos contra la masa<\/b><\/li><li><b>d)<\/b> las que vienen de <b>recuperar ayudas de Estado<\/b><\/li><li><b>e)<\/b> las de una <b>resolución firme desestimatoria<\/b> que ya estuvo suspendida mientras se recurría (ya disfrutó de su espera)<\/li><li><b>f)<\/b> los <b>tributos repercutidos, como el IVA<\/b>, salvo que demuestre que el cliente no se lo ha pagado<\/li><li><b>g)<\/b> los <b>pagos fraccionados del Impuesto sobre Sociedades<\/b>.<\/li><\/ul><p>Si pide algo de la lista, la solicitud se <b>inadmite<\/b>.<\/p><p>El portero le recuerda además tres normas de la casa. <b>65.3<\/b>: lo aplazado hay que <b>garantizarlo<\/b> (art. 82). <b>65.4<\/b>: si garantiza toda la deuda con <b>aval de banco o SGR, o seguro de caución<\/b>, pagará el <b>interés legal<\/b>, el barato.<\/p><p><b>65.5<\/b>: si pide el aplazamiento en <b>voluntaria<\/b>, el reloj del periodo ejecutivo se para, pero el taxímetro de los <b>intereses sigue corriendo<\/b>. Si ya estaba en <b>ejecutiva<\/b>, puede pedirlo hasta que le notifiquen el <b>acuerdo de enajenación<\/b> de sus bienes embargados: el apremio sigue, pero no le venden nada hasta que se resuelva.<\/p><h4>2 · El portero rechaza (47 RGR)<\/h4><p>Además de la lista del 65.2, el <b>47 RGR<\/b> añade más casos de inadmisión: si la deuda es de una <b>autoliquidación que no ha presentado<\/b> (tiene que presentarla antes o junto con la solicitud); si la autoliquidación la presentó tras una <b>inspección suspendida por posible delito<\/b>, ya remitida al juez o al Ministerio Fiscal; o si la solicitud <b>repite una ya denegada<\/b> sin cambios sustanciales, para ganar tiempo.<\/p><p>La consecuencia es dura: la solicitud se tiene <b>por no presentada a todos los efectos<\/b>. Como si ALBUS nunca hubiera pedido nada: no frena el periodo ejecutivo. Contra la inadmisión cabe recurso de reposición o reclamación económico-administrativa.<\/p><h4>3 · Rellenar la solicitud (46 RGR)<\/h4><p>ALBUS tiene que pedirlo a tiempo (<b>46.1<\/b>). <b>En voluntaria<\/b>, dentro del plazo de ingreso; y si la deuda es de una autoliquidación que presenta <b>fuera de plazo<\/b>, solo cuenta como pedida en voluntaria si la solicitud va <b>junto con esa autoliquidación<\/b>. <b>En ejecutiva<\/b>, en cualquier momento antes de que le notifiquen el <b>acuerdo de enajenación<\/b>.<\/p><p>En la solicitud (<b>46.2<\/b>) pone quién es; qué deuda (importe, concepto y fin del plazo voluntario); <b>por qué<\/b> no puede pagar; <b>qué plazos<\/b> pide; <b>qué garantía<\/b> ofrece; la domiciliación bancaria si la Administración la exige; lugar, fecha y firma; y, si está en concurso, que la deuda no es un crédito contra la masa.<\/p><p>Los papeles (<b>46.3<\/b>) no son siempre los mismos:<\/p><ul class=\"hl\"><li><b>a)<\/b> el <b>compromiso de aval<\/b> del banco, SGR o aseguradora, <b>o<\/b> los papeles del 46.4 o 46.5, según la garantía que ofrezca<\/li><li><b>b)<\/b> <b>en su caso<\/b>, la representación y el domicilio para notificaciones<\/li><li><b>c)<\/b> lo que estime oportuno y, en particular, la <b>justificación de sus dificultades transitorias<\/b><\/li><li><b>d)<\/b> si es una autoliquidación, el <b>modelo presentado<\/b>, salvo que ya lo tenga Hacienda: entonces basta con indicar el día y el procedimiento en que lo presentó<\/li><li><b>e)<\/b> <b>en su caso<\/b>, si quiere que le compensen las devoluciones durante el aplazamiento<\/li><li><b>f)<\/b> si está en concurso, la documentación del concurso.<\/li><\/ul><p>Si ofrece <b>otra garantía<\/b> (<b>46.4<\/b>), además: declaración de que <b>no consigue aval<\/b> con las gestiones hechas, <b>valoración<\/b> de los bienes por expertos independientes y <b>balance del último ejercicio<\/b>. Si pide <b>dispensa<\/b> (<b>46.5<\/b>): declaración de que <b>carece de bienes<\/b>, prueba de que no consigue aval, <b>balances de los tres últimos años<\/b> y <b>plan de viabilidad<\/b>.<\/p><p>Si le falta algo (<b>46.6<\/b>), Hacienda le requiere y le da <b>10 días<\/b>. Si <b>no contesta<\/b>, la solicitud se tiene por no presentada y se archiva; y si la pidió en voluntaria y ese plazo ya ha pasado, le llega la providencia de apremio. Si <b>contesta pero no lo arregla<\/b>, se <b>deniega<\/b>. Si lo que falta es la <b>autoliquidación<\/b>, no hay subsanación: se <b>inadmite<\/b> (47).<\/p><h4>4 · La garantía (82 LGT y 48 RGR)<\/h4><p>El <b>82.1 LGT<\/b> fija la garantía normal: <b>aval solidario de banco o SGR, o seguro de caución<\/b>. Si ALBUS justifica que no lo consigue, o que comprometería su viabilidad, puede ofrecer <b>hipoteca, prenda, fianza personal y solidaria u otra suficiente<\/b>. Y puede pedir <b>medidas cautelares en sustitución<\/b>.<\/p><p><b>Dispensa total o parcial (82.2)<\/b> en tres casos:<\/p><ul class=\"hl\"><li><b>a)<\/b> <b>cuantía<\/b>: la Orden HFP/311/2023 no exige garantía cuando el importe <b>en conjunto no supera 50.000 €<\/b>, en voluntaria o en ejecutiva. Para calcularlo se suman, en el momento de pedirlo: las deudas de esta solicitud, las de <b>otras solicitudes suyas aún sin resolver<\/b> y los <b>vencimientos pendientes de aplazamientos ya concedidos que no estén garantizados<\/b>. Vale para las deudas estatales que gestiona la AEAT y otros órganos del Estado, no para la deuda aduanera de la Unión.<\/li><li><b>b)<\/b> <b>carece de bienes<\/b> suficientes y ejecutar su patrimonio afectaría a la <b>capacidad productiva y el empleo<\/b> o causaría graves quebrantos a Hacienda<\/li><li><b>c)<\/b> otros casos que diga la normativa.<\/li><\/ul><p>Cuánto cubre (<b>48.2<\/b>): en <b>voluntaria<\/b>, <b>deuda + intereses + 25 %<\/b> de la suma; en <b>ejecutiva<\/b>, <b>deuda con su recargo + intereses + 5 %<\/b>. En un fraccionamiento (<b>48.3<\/b>), una garantía para todo o <b>garantías parciales e independientes<\/b> por fracciones, cada una con esos mismos importes de sus fracciones. Una Administración pública no garantiza (<b>48.1<\/b>).<\/p><p>Si la garantía <b>no basta<\/b> (<b>48.4<\/b>), le dan <b>10 días<\/b> para <b>aportar otra complementaria o acreditar que no puede<\/b> (con los papeles del 46.4 o 46.5). Si no contesta, o no completa ni justifica, se <b>deniega<\/b>. El aval o seguro de caución debe durar al menos <b>6 meses más que el vencimiento del plazo o plazos que garantiza<\/b> (<b>48.5<\/b>).<\/p><p>La garantía se formaliza en <b>2 meses<\/b> desde el día siguiente a la notificación de la concesión, que no surte efecto hasta entonces (<b>48.6<\/b>). Si no (<b>48.7<\/b>): en <b>voluntaria<\/b>, el periodo ejecutivo empieza al día siguiente de acabar esos 2 meses, con apremio, principal y recargo, e intereses hasta ese día; en <b>ejecutiva<\/b>, sigue el apremio.<\/p><p>La acepta el órgano que resuelve (<b>48.8<\/b>). Se <b>libera<\/b> cuando paga <b>todo<\/b> lo garantizado, recargos, intereses y costas incluidos; las parciales e independientes, cada una al pagar sus plazos (<b>48.9<\/b>).<\/p><h4>5 · El plan B y el plan C (49 y 50 RGR)<\/h4><p><b>Plan B, las medidas cautelares (49 RGR).<\/b> Si la garantía le sale <b>excesivamente cara<\/b> para lo que debe, ALBUS puede pedir medidas cautelares en sustitución, si tiene <b>devoluciones pendientes<\/b> de Hacienda o <b>bienes embargables<\/b>. Si el bien va a un registro, la medida solo se concede tras inscribirla.<\/p><p>Se decide en el mismo acuerdo del aplazamiento y se deniega si esos bienes se pueden embargar sin más. Los costes los paga ALBUS. Si después no paga, la medida se convierte en definitiva antes de ejecutarla. Y si pidió el aplazamiento en voluntaria y hay riesgo de que no cobre (81 LGT), Hacienda puede adoptar medidas cautelares mientras tramita.<\/p><p><b>Plan C, la dispensa (50 RGR).<\/b> Si ALBUS dice que no tiene bienes, Hacienda lo <b>investiga<\/b>: si encuentra alguno, le requiere para que lo ofrezca en garantía. Mientras dure el aplazamiento, ALBUS debe <b>avisar si mejora<\/b> su patrimonio; si Hacienda se entera por su cuenta, le da <b>15 días<\/b> para alegar y le puede exigir garantía.<\/p><p>Si ALBUS va a <b>repartir beneficios<\/b>, antes tiene que garantizar lo que debe. Y en un fraccionamiento con dispensa parcial, la garantía parcial responde de <b>todas<\/b> las fracciones.<\/p><h4>6 · Mientras espera la respuesta (51 RGR)<\/h4><p>Hacienda estudia el caso: si de verdad le falta liquidez, si puede generar ingresos y si la garantía basta. Mientras tanto, ALBUS tiene que <b>ir pagando los plazos que propuso<\/b>. Si el expediente es complicado, Hacienda le fija un <b>calendario provisional<\/b>. Si ALBUS incumple algún pago, Hacienda puede <b>denegar<\/b> la solicitud, porque sus dificultades ya no parecen transitorias sino <b>estructurales<\/b>.<\/p><h4>7 · La respuesta (52 RGR)<\/h4><p><b>Si se lo conceden<\/b>, la resolución fija la cuenta de domiciliación, los plazos y las condiciones, que pueden ser distintos de los que pidió. Los vencimientos caen siempre el <b>día 5 o 20<\/b> del mes. Puede ponerle condiciones: que Hacienda le compense las devoluciones que le deba, que esté al corriente de sus impuestos, o que si mezcla deudas en voluntaria y en ejecutiva las pague por separado, primero las ejecutivas.<\/p><p>La notificación le avisa de qué pasa si no garantiza (48) o no paga (54) y le dice los intereses de cada plazo (53). Pedir luego que le cambien las condiciones no para el acuerdo.<\/p><p><b>Si se lo deniegan y lo pidió en voluntaria<\/b> (52.4), se le abre el plazo del <b>62.2 LGT<\/b> para pagar. Si paga, le cobran intereses desde que acabó el plazo voluntario hasta el día que paga. Si no paga, empieza el <b>periodo ejecutivo<\/b> y el apremio. <b>Si lo pidió en ejecutiva<\/b>, sigue el apremio.<\/p><p>Contra la denegación: <b>recurso de reposición o reclamación económico-administrativa<\/b>. Hacienda tiene <b>6 meses<\/b> para resolver; si no contesta, ALBUS puede entenderlo <b>denegado<\/b> para recurrir, o esperar.<\/p><h4>8 · La factura de la espera (53 RGR y 26.6 LGT)<\/h4><p><b>53.1, aplazamiento<\/b>: intereses sobre la deuda aplazada desde el día siguiente al fin del plazo voluntario hasta el vencimiento concedido; se pagan con la deuda. Si lo pidió en ejecutiva, el <b>recargo no entra<\/b> en la base.<\/p><p><b>53.2, fraccionamiento<\/b>: intereses <b>por cada fracción<\/b>, desde el día siguiente al fin del plazo voluntario hasta el vencimiento de esa fracción; se pagan con ella. Tampoco entra el recargo si se pidió en ejecutiva.<\/p><p><b>53.3, denegación<\/b>: si lo pidió en voluntaria, intereses según el 52.4; en ejecutiva, se liquidan cuando pague (art. 72).<\/p><p>¿Qué tipo? <b>26.6 LGT<\/b>: el interés de demora es el <b>interés legal vigente durante el periodo, incrementado en un 25 %<\/b>, salvo que la Ley de Presupuestos fije otro. Pero si la deuda aplazada está garantizada <b>en su totalidad<\/b> con <b>aval solidario de entidad de crédito o SGR, o seguro de caución<\/b>, se exige solo el <b>interés legal<\/b> (también 65.4). Con una hipoteca o con un aval que no cubre todo, interés de demora.<\/p><h4>9 · Si no cumple (54 RGR y 168 LGT)<\/h4><p><b>Aplazamiento (54.1)<\/b>:<\/p><ul class=\"hl\"><li><b>a)<\/b> pedido en <b>voluntaria<\/b>: al día siguiente del vencimiento empieza el periodo ejecutivo y el apremio; se exige el principal, los intereses hasta el vencimiento concedido y el <b>recargo sobre la suma<\/b>.<\/li><li><b>b)<\/b> pedido en <b>ejecutiva<\/b>: sigue el apremio.<\/li><li><b>c)<\/b> En los dos casos, si no paga en los plazos del <b>62.5<\/b>, se aplica el <b>168<\/b>: se ejecuta la garantía.<\/li><\/ul><p><b>Fraccionamiento con dispensa total o con una garantía para todas las fracciones (54.2)<\/b>. Depende de qué deudas había en la fracción que no paga:<\/p><ul class=\"hl\"><li><b>a)<\/b> si incluía deudas que ya estaban en <b>ejecutiva<\/b> al pedirlo, <b>todo vence a la vez<\/b>: para todas las deudas que estaban en ejecutiva sigue el apremio, y para todas las que estaban en voluntaria empieza el periodo ejecutivo al día siguiente de la fracción incumplida.<\/li><li><b>b)<\/b> si la fracción tenía deudas en <b>voluntaria<\/b>, primero se apremia <b>solo esa fracción<\/b>, con sus intereses y el recargo; si tampoco la paga, <b>vencen las demás<\/b> y se apremia todo.<\/li><li><b>c)<\/b> con garantía conjunta, si no paga en los plazos del 62.5, se ejecuta.<\/li><\/ul><p><b>Fraccionamiento con garantías parciales e independientes (54.3)<\/b>: solo vencen las fracciones que cubre <b>esa<\/b> garantía (si la fracción tenía deudas en ejecutiva, todas las de esa garantía; si eran en voluntaria, con la regla del 54.2.b), y tras el 62.5 se ejecuta esa garantía. <b>El resto del fraccionamiento sigue vigente.<\/b><\/p><p>La garantía se ejecuta por el procedimiento del <b>74 RGR<\/b>: lo obtenido paga deuda, costas, recargos e intereses, y el sobrante es del garante (<b>54.4<\/b>). Con dispensa parcial o si la garantía se queda corta, el apremio sigue sin esperar a ejecutarla (<b>54.5<\/b>).<\/p><p><b>La historia en una frase:<\/b> ALBUS pide (65), pasa el portero (65.2 y 47), rellena los papeles (46), garantiza (82 y 48) o busca el plan B o C (49 y 50), paga mientras espera (51), recibe la respuesta (52), paga los intereses (53 y 26.6) y, si falla, entra en ejecutiva y le ejecutan la garantía (54 y 168).<\/p><p class=\"inota\">Comprobado con el texto consolidado del BOE.<\/p>", "corto": "Aplazamientos", "arts": "Arts. 65 y 82 LGT · 46 a 54 RGR", "indice": [["65 LGT · La petición", [["65.1", "Aplazar o fraccionar, en voluntaria o ejecutiva, si la dificultad es transitoria"], ["65.2", "No aplazables → inadmisión"], ["65.2.b", "Retenciones e ingresos a cuenta"], ["65.2.f", "IVA y repercutidos, salvo que no se hayan cobrado"], ["65.2.g", "Pagos fraccionados del IS"], ["65.3", "Hay que garantizar (82)"], ["65.4", "Aval/SGR/caución → interés legal"], ["65.5", "Voluntaria: impide el ejecutivo, no los intereses · Ejecutiva: hasta el acuerdo de enajenación"]]], ["47 RGR · Inadmisión", [["47.1.a", "Autoliquidación no presentada"], ["47.1.b", "Inspección suspendida por posible delito"], ["47.2", "Repite una solicitud denegada sin cambios"], ["47.3", "Efecto: no presentada a todos los efectos"], ["47.4", "Cabe recurso o reclamación"]]], ["46 RGR · La solicitud", [["46.1.a", "Voluntaria: en plazo · autoliquidación tardía: solo si va junto"], ["46.1.b", "Ejecutiva: hasta el acuerdo de enajenación"], ["46.2", "Contenido: causas, plazos, garantía, domiciliación…"], ["46.3.a", "Compromiso de aval o papeles del 46.4/46.5"], ["46.3.b", "En su caso, representación"], ["46.3.c", "Justificar dificultades transitorias"], ["46.3.d", "Autoliquidación, salvo que ya la tenga Hacienda"], ["46.3.e", "En su caso, compensación"], ["46.4", "Otra garantía: no consigue aval + valoración + balance"], ["46.5", "Dispensa: sin bienes, balances de 3 años, plan de viabilidad"], ["46.6", "10 días: no contesta → archivo · sin subsanar → denegación"]]], ["82 LGT y 48 RGR · La garantía", [["82.1", "Aval de banco/SGR o caución · si no, otras · o medidas cautelares"], ["82.2.a", "Cuantía: conjunto ≤ 50.000 € (Orden HFP/311/2023)"], ["Orden 311/2023", "Suma: esta solicitud + otras sin resolver + vencimientos no garantizados"], ["82.2.b", "Sin bienes + capacidad productiva y empleo"], ["82.2.c", "Otros casos de la normativa"], ["48.1", "Administraciones públicas: sin garantía"], ["48.2", "Voluntaria: +25 % · Ejecutiva: con recargo +5 %"], ["48.3", "Una garantía o parciales e independientes"], ["48.4", "Insuficiente: 10 días, complementaria o acreditar imposibilidad"], ["48.5", "Aval/caución: 6 meses más que el plazo o plazos garantizados"], ["48.6", "Formalizar en 2 meses"], ["48.7.a", "Si no, voluntaria: ejecutivo al acabar los 2 meses"], ["48.7.b", "Si no, ejecutiva: sigue el apremio"], ["48.9", "Liberación al pagarlo todo · parciales, por sus plazos"]]], ["49 y 50 RGR · Plan B y C", [["49.1", "Medidas cautelares si la garantía es excesivamente onerosa"], ["49.2", "Medidas del 81 LGT mientras se tramita"], ["50.1", "Hacienda investiga sus bienes"], ["50.2", "Avisar si mejora · 15 días · antes de repartir beneficios"], ["50.3", "Dispensa parcial: responde de todas las fracciones"]]], ["51 RGR · Mientras espera", [["51.1", "Examen de liquidez y garantía"], ["51.2", "Pagar los plazos propuestos · calendario provisional · si incumple, se puede denegar"]]], ["52 RGR · La respuesta", [["52.1", "Plazos y condiciones · vencimientos el 5 o el 20"], ["52.2", "Condiciones: compensación, estar al corriente"], ["52.3", "La notificación advierte (48 y 54) e indica intereses (53)"], ["52.4", "Denegación: voluntaria → plazo del 62.2 · ejecutiva → apremio"], ["52.5", "Recurso de reposición o reclamación"], ["52.6", "6 meses · silencio negativo"]]], ["53 RGR y 26.6 LGT · Intereses", [["53.1", "Aplazamiento: del fin de la voluntaria al vencimiento · sin recargo en la base"], ["53.2", "Fraccionamiento: por cada fracción, se paga con ella"], ["53.3", "Denegación: 52.4 (voluntaria) o 72 (ejecutiva)"], ["26.6", "Legal + 25 % salvo LPGE · aval total de banco/SGR/caución → legal"]]], ["54 RGR y 168 LGT · Si no cumple", [["54.1.a", "Aplazamiento en voluntaria: ejecutivo, principal + intereses + recargo"], ["54.1.b", "En ejecutiva: sigue el apremio"], ["54.1.c", "Sin pago en el 62.5 → 168"], ["54.2.a", "Fracción con deudas en ejecutiva: todo vence"], ["54.2.b", "Fracción con deudas en voluntaria: primero esa; si no, vencen las demás"], ["54.2.c", "Garantía conjunta: tras el 62.5 se ejecuta"], ["54.3", "Garantías parciales: solo las fracciones de esa garantía; el resto sigue"], ["54.4", "Se ejecuta por el 74 RGR · sobrante al garante"], ["54.5", "Dispensa parcial o garantía insuficiente: el apremio no espera"]]]]}, {"id": "chuleta-ejecutivo", "fecha": "2026-11-02", "titulo": "Chuleta · Periodo ejecutivo", "tag": "Chuleta de bloque", "html": "<p>Este bloque es <b>núcleo puro<\/b>: plazos, recargos y providencia de apremio salen en todos los exámenes oficiales. Lo mínimo: <b>número + de qué va + dato clave<\/b>.<\/p><h4>Memorizar mínimo<\/h4><div class=\"itab\"><table><thead><tr><th>Artículo<\/th><th>De qué va<\/th><th>Dato clave<\/th><\/tr><\/thead><tbody><tr><td><b>62.2 LGT<\/b><\/td><td>Plazo voluntario de las liquidaciones<\/td><td>Notificada del 1 al 15 → hasta el <b>20 del mes siguiente<\/b>. Del 16 al último → hasta el <b>5 del segundo mes siguiente<\/b> (o hábil posterior)<\/td><\/tr><tr><td><b>62.5 LGT<\/b><\/td><td>Plazo de la providencia de apremio<\/td><td>Notificada del 1 al 15 → hasta el <b>20 de ese mes<\/b>. Del 16 al último → hasta el <b>5 del mes siguiente<\/b><\/td><\/tr><tr><td><b>161 LGT<\/b><\/td><td>Cuándo empieza el periodo ejecutivo<\/td><td>Liquidación: al día siguiente de acabar el 62.2. Autoliquidación sin ingreso: al acabar el plazo (o al presentarla, si es fuera de plazo). Pedir aplazamiento o compensación en voluntaria lo impide<\/td><\/tr><tr><td><b>28 LGT<\/b><\/td><td>Recargos del periodo ejecutivo<\/td><td><b>5 %<\/b> ejecutivo: pagas todo antes de la providencia · <b>10 %<\/b> apremio reducido: pagas todo + el recargo en el plazo del 62.5 · <b>20 %<\/b> apremio ordinario: el resto. Se calculan sobre <b>toda<\/b> la deuda no ingresada en voluntaria<\/td><\/tr><tr><td><b>28.5 LGT<\/b><\/td><td>Recargos e intereses<\/td><td>Con el 5 % y el 10 % <b>no<\/b> hay intereses de demora. El 20 % <b>sí<\/b> lleva intereses<\/td><\/tr><tr><td><b>26 LGT<\/b><\/td><td>Intereses de demora<\/td><td>Desde el día siguiente al fin de la voluntaria hasta el pago (solo con el 20 %)<\/td><\/tr><tr><td><b>167 LGT<\/b><\/td><td>Providencia de apremio<\/td><td><b>167.3: motivos tasados de oposición<\/b> → a) extinción o prescripción · b) aplazamiento, fraccionamiento o compensación en voluntaria y otras causas de suspensión · c) falta de notificación de la liquidación · d) anulación de la liquidación · e) error que impida identificar al deudor o la deuda. <b>Ha salido en los 6 exámenes<\/b><\/td><\/tr><tr><td><b>224 LGT<\/b><\/td><td>Suspensión en reposición<\/td><td>Automática solo aportando garantía: depósito, aval o fianza de entidad, o fianza personal y solidaria. Sin garantía, solo por error aritmético, material o de hecho. Si no: no suspende y la solicitud se archiva (art. 25 RGRVA)<\/td><\/tr><tr><td><b>212.3 LGT<\/b><\/td><td>Suspensión de sanciones<\/td><td>La sanción recurrida se suspende sola. Recurrir <b>la liquidación<\/b> no suspende <b>la sanción<\/b><\/td><\/tr><tr><td><b>156.3 LGT<\/b><\/td><td>Acta de conformidad<\/td><td>La liquidación se entiende dictada y notificada al mes del acta (desarrollo: 187.3 RGAT) → plazo del 62.2<\/td><\/tr><tr><td><b>43.2 Ley 39/2015<\/b><\/td><td>Notificación electrónica<\/td><td>Si no accedes, se entiende rechazada a los <b>10 días naturales<\/b> de la puesta a disposición; el acceso posterior no cambia nada<\/td><\/tr><\/tbody><\/table><\/div><h4>Ideas que no se te pueden escapar<\/h4><ul><li><b>Siempre el mismo orden:<\/b> ¿cuándo acaba la voluntaria? (62.2) → ¿se ha notificado ya la providencia? → ¿paga dentro del 62.5? → recargo (28) → ¿intereses? (28.5 y 26).<\/li><li><b>Para el 5 % y el 10 % hay que pagarlo todo.<\/b> Si paga solo parte, aunque sea antes de la providencia, no hay 5 %. Y si paga la cuota pero no el 10 %, se va al 20 %.<\/li><li><b>El recargo va sobre toda la deuda no ingresada en voluntaria<\/b> (cuota + intereses de la liquidación), no solo sobre lo que falta.<\/li><li><b>Recurrir la providencia solo vale por los motivos del 167.3.<\/b> Si el motivo no está en la lista, se desestima.<\/li><li><b>Calcula las fechas en el examen:<\/b> siempre te dan una fecha de notificación y casi siempre te preguntan cuándo acaba un plazo.<\/li><\/ul><h4>Qué artículos se repiten (Morón × exámenes oficiales)<\/h4><div class=\"itab\"><table><thead><tr><th>Artículo<\/th><th>Morón (de 11)<\/th><th>Oficiales (de 6)<\/th><th>Veredicto<\/th><\/tr><\/thead><tbody><tr><td>167 y 167.3 LGT<\/td><td>2<\/td><td>6<\/td><td>Seguro (el que más)<\/td><\/tr><tr><td>28 LGT<\/td><td>6<\/td><td>4<\/td><td>Seguro<\/td><\/tr><tr><td>62.5 LGT<\/td><td>4<\/td><td>4<\/td><td>Seguro<\/td><\/tr><tr><td>161 LGT<\/td><td>2 (implícito en casi todos)<\/td><td>4<\/td><td>Seguro<\/td><\/tr><tr><td>62.2 LGT<\/td><td>6<\/td><td>3<\/td><td>Seguro<\/td><\/tr><tr><td>26 LGT<\/td><td>5<\/td><td>muchos<\/td><td>S
