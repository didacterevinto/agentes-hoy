<style>
/* Layout: una columna de lectura (tarjeta del día) bajo una barra fija con fecha y pestañas; pasos numerados porque la sesión es una secuencia real */
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#1b2427; --muted:#5d6b6e; --line:#d8dfdd;
  --accent:#1f5f7a; --accent-soft:#e1edf2;
  --ok:#2f7a4b; --ok-soft:#e2f1e7; --part:#a8670f; --part-soft:#f8ecd8; --rep:#b23b2a; --rep-soft:#f8e2de;
  --new:#6b4fa1; --new-soft:#ece6f6;
  --f-head:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121819; --card:#1a2225; --ink:#e3eae9; --muted:#9aa9aa; --line:#2f3b3d;
  --accent:#7db8d0; --accent-soft:#1c3038; --ok:#7cc796; --ok-soft:#1b3024; --part:#e2ad5c; --part-soft:#35291a;
  --rep:#ef8f7f; --rep-soft:#3a201c; --new:#b9a3e3; --new-soft:#2a2238; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121819; --card:#1a2225; --ink:#e3eae9; --muted:#9aa9aa; --line:#2f3b3d;
  --accent:#7db8d0; --accent-soft:#1c3038; --ok:#7cc796; --ok-soft:#1b3024; --part:#e2ad5c; --part-soft:#35291a;
  --rep:#ef8f7f; --rep-soft:#3a201c; --new:#b9a3e3; --new-soft:#2a2238; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.top-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:8px;justify-content:space-between}
.brand{font-family:var(--f-head);font-weight:700;font-size:18px;letter-spacing:.01em}
.save{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:6px 10px 8px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.nav{display:flex;align-items:center;gap:8px}
.nav button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;min-width:40px}
.nav .today{font-weight:600}
.nav .grow{flex:1}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}

.head{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.when{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.code{font-family:var(--f-mono);font-size:12px;background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:999px}
h1{font-family:var(--f-head);font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
.estado{display:flex;gap:6px;flex-wrap:wrap}
.estado button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-weight:600;font-size:14px}
.estado button[aria-pressed="true"][data-v="Hecho"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.estado button[aria-pressed="true"][data-v="Parcial"]{background:var(--part-soft);border-color:var(--part);color:var(--part)}
.estado button[aria-pressed="true"][data-v=""]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
details.guion{font-size:13px;color:var(--muted)}
details.guion summary{cursor:pointer;font-weight:600}

.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px}
.num{grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:16px}
:root[data-theme="dark"] .num{color:#10191c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .num{color:#10191c}}
.st{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.st h2{font-family:var(--f-head);font-size:18px;margin:0}
.st span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.body{display:flex;flex-direction:column;gap:8px;min-width:0}
.law{font-family:var(--f-mono);font-size:15px;font-weight:500;color:var(--accent)}
.mem{background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--bg)}
.chip.new{border-color:var(--new);background:var(--new-soft);color:var(--ink)}
.chip.new::before{content:"test · ";font-weight:700;color:var(--new)}
.q{border-left:3px solid var(--line);padding-left:10px}
.case{border-left:3px solid var(--accent);padding-left:10px}
details.pauta summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
details.pauta p{margin:6px 0 0}
.moron{font-size:13.5px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
.testrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.testrow input{width:64px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}

.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.card .ct{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.card .ct b{color:var(--ink)}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.card .acts button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
.card .acts button[aria-pressed="true"].ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.card .acts button[aria-pressed="true"].rep{background:var(--rep-soft);border-color:var(--rep);color:var(--rep)}
.card.is-ok{border-color:var(--ok)}
.card.is-rep{border-color:var(--rep)}
.empty{color:var(--muted);font-size:14px}
.rest{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted)}
.rest h1{color:var(--ink);margin-bottom:6px}

/* semana */
.week{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.week h3{margin:0;padding:10px 14px;font-family:var(--f-head);font-size:16px;border-bottom:1px solid var(--line);background:var(--bg)}
.wd{display:grid;grid-template-columns:88px 12px minmax(0,1fr);gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.wd:last-child{border-bottom:0}
.wd small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.wd .t{min-width:0;font-size:14px}
.wd .t em{font-style:normal;color:var(--muted);font-size:12.5px}
.wd.is-today{background:var(--accent-soft)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.dot.Hecho{background:var(--ok);border-color:var(--ok)}
.dot.Parcial{background:var(--part);border-color:var(--part)}
.dot.off{border-style:dotted}

/* articulos */
.legend{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grp h3{margin:0;padding:10px 14px;font-family:var(--f-head);font-size:16px;background:var(--bg);border-bottom:1px solid var(--line)}
.ar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.ar:last-child{border-bottom:0}
.ar .a{font-family:var(--f-mono);font-size:13.5px;color:var(--accent)}
.ar .lv{font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;margin-left:6px;font-family:var(--f-body)}
.lv.A{background:var(--accent-soft);color:var(--accent)} .lv.B{background:var(--bg);color:var(--muted);border:1px solid var(--line)} .lv.Test{background:var(--new-soft);color:var(--new)}
.ar p{margin:2px 0 0;font-size:13.5px}
.ar small{color:var(--muted);font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);width:34px;height:32px;font-weight:700;font-variant-numeric:tabular-nums;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--card)}
@media (max-width:480px){h1{font-size:23px}.ar{grid-template-columns:1fr}.wd{grid-template-columns:76px 12px minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}
</style>

  if (DAYS.some(d => d.fecha === f)) return f;

async function rpc(fn, body){
  const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, { method:"POST",
    headers: Object.assign({ "apikey":SB_KEY, "Content-Type":"application/json" }, SB_KEY.startsWith("eyJ") ? { "Authorization":"Bearer "+SB_KEY } : {}), body: JSON.stringify(body) });

  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}

async function flush(){
  if (writing || !dirty || !CODE) return;
  writing = true; dirty = false;

}

function cardHTML(c){
  const v = state.cards[c.id] || "";
  return `<div class="card ${v==="ok"?"is-ok":v==="rep"?"is-rep":""}">
    <div class="ct"><b>${esc(c.tema)}</b><span>${esc(c.etapa)}</span></div>
    <div><span class="lbl">De memoria</span><br>${esc(c.pregunta)}</div>
    ${c.aplicacion ? `<div class="q"><span class="lbl">Aplica</span><br>${esc(c.aplicacion)}</div>` : ""}
    <div class="acts">
      <button class="ok" data-card="${c.id}" data-v="ok" aria-pressed="${v==="ok"}">Me salió</button>
      <button class="rep" data-card="${c.id}" data-v="rep" aria-pressed="${v==="rep"}">Reparar</button>
    </div></div>`;
}

function renderDia(){
  const i = DAYS.findIndex(d => d.fecha === cur), d = DAYS[i];
  const st = estadoDe(d);
  const nav = `<div class="nav">
    <button id="prev" aria-label="Día anterior" ${i===0?"disabled":""}>‹</button>
    <button class="today" id="hoy">Hoy</button><span class="grow"></span>
    <button id="next" aria-label="Día siguiente" ${i===DAYS.length-1?"disabled":""}>›</button></div>`;
  const when = `<div class="when"><span>${esc(d.dia)} ${fmt(d.fecha)}${d.fecha===TODAY?" · hoy":""}</span>${d.code && d.code!=="—"?`<span class="code">${esc(d.code)}</span>`:""}${d.min?`<span>${d.min} min</span>`:""}</div>`;
  if (d.tipo === "descanso"){
    return nav + stats() + `<div class="rest">${when}<h1>Descanso</h1><p>No abras el temario ni recuperes atrasos. Mañana sigues con la fecha que toque.</p></div>`;
  }
  const cards = CARDS.filter(c => c.fecha === d.fecha);
  const estado = `<div class="estado" role="group" aria-label="Estado de la sesión">
    ${["Hecho","Parcial",""].map(v => `<button data-estado="${v}" data-v="${v}" aria-pressed="${st===v}">${v||"Pendiente"}</button>`).join("")}</div>`;
  let h = nav + stats() + `<section class="head">${when}<h1>${esc(d.bloque)}</h1>${estado}
    ${d.pasos?`<details class="guion"><summary>Guion de la sesión</summary><p>${esc(d.pasos)}</p></details>`:""}</section>`;
  let n = 0;
  const step = (title, mins, inner) => `<section class="step"><span class="num">${++n}</span><div class="st"><h2>${title}</h2><span>${mins}</span></div><div class="body">${inner}</div></section>`;
  if (d.tipo === "repaso"){
    return h + step("Arrastre", cards.length*5+" min", cards.length ? cards.map(cardHTML).join("") : `<p class="empty">Hoy no hay tarjetas.</p>`);
  }
  if (d.apuntes) h += step(d.tipo==="colchon"?"Qué hacer hoy":"Apuntes", d.tipo==="comunes"?"20'":"15'", `<p style="margin:0">${esc(d.apuntes)}</p>`);
  if (d.nucleo || d.apoyo || (d.apoyoNuevo||[]).length){
    const apoyo = [ ...(d.apoyo? d.apoyo.split(/;\s*/).map(a=>`<span class="chip">${esc(a)}</span>`) : []), ...(d.apoyoNuevo||[]).map(a=>`<span class="chip new">${esc(a)}</span>`) ].join("");
    const mem = d.memoria ? d.memoria.split(" · ").slice(1).join(" · ") : "";
    h += step("Artículo núcleo", "20'", `${d.nucleo?`<div class="law">${esc(d.nucleo)}</div>`:""}
      ${mem?`<div class="mem"><span class="lbl">Escribe sin mirar (4-6 líneas, cifras exactas)</span><br>${esc(mem)}</div>`:""}
      ${apoyo?`<div><span class="lbl">De apoyo</span><div class="chips">${apoyo}</div></div>`:""}`);
  }
  if (d.p1 || d.caso){
    const opt = d.tipo==="colchon" ? " (opcional)" : "";
    h += step("Preguntas y caso"+opt, "25'", `
      ${d.p1?`<div class="q">${esc(d.p1)}</div>`:""}${d.p2?`<div class="q">${esc(d.p2)}</div>`:""}
      ${d.caso?`<div class="case"><span class="lbl">Caso · redacta la respuesta citando artículo</span><br>${esc(d.caso)}</div>`:""}
      ${d.moron?`<div class="moron">${esc(d.moron)}</div>`:""}
      ${d.pauta?`<details class="pauta"><summary>Ver pauta de corrección</summary><p>${esc(d.pauta)}</p></details>`:""}`);
  }
  if (d.test){
    const s = state.dias[d.fecha] || {};
    h += step("Test", "15' + 10' corregir", `<p style="margin:0">${esc(d.test)}</p>
      <div class="testrow"><label for="ac">Aciertos</label><input id="ac" inputmode="numeric" value="${esc(s.aciertos??"")}">
      <label for="pr">de</label><input id="pr" inputmode="numeric" value="${esc(s.preguntas??"")}"></div>`);
  }
  h += step("Arrastre", "15'", cards.length ? cards.map(cardHTML).join("") : `<p class="empty">Hoy no hay tarjetas programadas.</p>`);
  if (d.comunes) h += step("Comunes", "10'", `<p style="margin:0">${esc(d.comunes.replace(/^10 min · /,""))}</p>`);
  return h;
}

function mondayOf(f){ const d = new Date(f+"T12:00:00"); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return iso(d); }
function renderSemana(){
  const weeks = {};
  DAYS.forEach(d => { (weeks[mondayOf(d.fecha)] ||= []).push(d); });
  return stats() + Object.entries(weeks).map(([mon, ds]) => `<section class="week"><h3>Semana del ${fmt(mon)}</h3>
    ${ds.map(d => { const st = estadoDe(d); const nc = CARDS.filter(c=>c.fecha===d.fecha).length;
      return `<button class="wd ${d.fecha===TODAY?"is-today":""}" data-go="${d.fecha}">
        <small>${esc(d.dia.slice(0,3))} ${d.fecha.slice(8)}/${d.fecha.slice(5,7)}</small>
        <span class="dot ${st} ${d.tipo==="descanso"?"off":""}" aria-label="${st||"Pendiente"}"></span>
        <span class="t">${esc(d.bloque)}${nc?` <em>· ${nc} arrastre${nc>1?"s":""}</em>`:""}</span></button>`; }).join("")}
  </section>`).join("");
}

function renderArts(){
  const groups = {};
  ARTS.forEach(a => (groups[a.norma] ||= []).push(a));
  return `<div class="legend"><b>Dominio:</b> 0 nada · 1 lo reconozco · 2 lo explico sin mirar · 3 lo aplico y lo cito en un caso una semana después. Las marcas <b>test</b> son artículos que se repiten en el primer ejercicio.</div>` +
    Object.entries(groups).map(([norma, as]) => `<section class="grp"><h3>${esc(norma)}</h3>${as.map(a => { const v = state.dominio[a.id] ?? 0;
      return `<div class="ar"><div><span class="a">${esc(a.art)}</span><span class="lv ${a.nivel}">${a.nivel==="Test"?"test":a.nivel}</span><p>${esc(a.que)}</p><small>Primer estudio: ${esc(a.cuando)}</small></div>
      <div class="seg" role="group" aria-label="Dominio de ${esc(norma)} ${esc(a.art)}">${[0,1,2,3].map(k=>`<button data-art="${a.id}" data-v="${k}" aria-pressed="${v===k}">${k}</button>`).join("")}</div></div>`; }).join("")}</section>`).join("");
}

function render(){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === view)));
  const ae = document.activeElement && document.activeElement.id;
  app.innerHTML = syncBox() + (view === "dia" ? renderDia() : view === "semana" ? renderSemana() : renderArts());
  if (ae && (ae==="ac"||ae==="pr")) { const el=document.getElementById(ae); if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} }
}

app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "prev" || b.id === "next"){ const i = DAYS.findIndex(d=>d.fecha===cur); cur = DAYS[i + (b.id==="next"?1:-1)].fecha; render(); return; }
  if (b.id === "code-ok"){ const v = (document.getElementById("code").value||"").trim(); if (v.length < 20){ alertBox("El código debe tener al menos 20 caracteres."); return; } CODE = v; try{localStorage.setItem("hoy-code",v);}catch(e){} render(); pull(); return; }
  if (b.id === "hoy"){ cur = pickDay(TODAY); render(); return; }
  if (b.dataset.go){ cur = b.dataset.go; view = "dia"; try{localStorage.setItem("hoy-view","dia");}catch(e){} render(); window.scrollTo(0,0); return; }
  if (b.dataset.estado !== undefined){ const s = Object.assign({}, state.dias[cur]); s.estado = b.dataset.estado; state.dias[cur] = s; scheduleSave(); render(); return; }
  if (b.dataset.card){ const v = b.dataset.v; state.cards[b.dataset.card] = state.cards[b.dataset.card] === v ? "" : v; scheduleSave(); render(); return; }
  if (b.dataset.art){ state.dominio[b.dataset.art] = Number(b.dataset.v); scheduleSave(); render(); return; }
});
app.addEventListener("input", e => {
  if (e.target.id === "ac" || e.target.id === "pr"){
    const s = Object.assign({}, state.dias[cur]); s[e.target.id==="ac"?"aciertos":"preguntas"] = e.target.value.replace(/[^0-9]/g,""); state.dias[cur] = s; scheduleSave();
  }
});
function alertBox(m){ const s=document.getElementById("sync"); if(!s) return; let p=s.querySelector(".err"); if(!p){p=document.createElement("p");p.className="err";p.style.cssText="margin:0;color:var(--rep);font-weight:600";s.appendChild(p);} p.textContent=m; }
render();
</script>

</body></html>
