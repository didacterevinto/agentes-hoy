<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f5f7a">
<title>Hoy · Agentes de Hacienda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: una columna de lectura (tarjeta del día) bajo una barra fija con fecha y pestañas; pasos numerados porque la sesión es una secuencia real */
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#1b2427; --muted:#5d6b6e; --line:#d8dfdd;
  --accent:#1f5f7a; --accent-soft:#e1edf2;
  --ok:#2f7a4b; --ok-soft:#e2f1e7; --part:#a8670f; --part-soft:#f8ecd8; --rep:#b23b2a; --rep-soft:#f8e2de;
  --new:#6b4fa1; --new-soft:#ece6f6;
  --f-head:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121819; --card:#1a2225; --ink:#e3eae9; --muted:#9aa9aa; --line:#2f3b3d;
  --accent:#7db8d0; --accent-soft:#1c3038; --ok:#7cc796; --ok-soft:#1b3024; --part:#e2ad5c; --part-soft:#35291a;
  --rep:#ef8f7f; --rep-soft:#3a201c; --new:#b9a3e3; --new-soft:#2a2238; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121819; --card:#1a2225; --ink:#e3eae9; --muted:#9aa9aa; --line:#2f3b3d;
  --accent:#7db8d0; --accent-soft:#1c3038; --ok:#7cc796; --ok-soft:#1b3024; --part:#e2ad5c; --part-soft:#35291a;
  --rep:#ef8f7f; --rep-soft:#3a201c; --new:#b9a3e3; --new-soft:#2a2238; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.top-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:8px;justify-content:space-between}
.brand{font-family:var(--f-head);font-weight:700;font-size:18px;letter-spacing:.01em}
.save{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{white-space:nowrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:6px 10px 8px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.nav{display:flex;align-items:center;gap:8px}
.nav button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;min-width:40px}
.nav .today{font-weight:600}
.nav .grow{flex:1}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}

.head{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.when{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.code{font-family:var(--f-mono);font-size:12px;background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:999px}
h1{font-family:var(--f-head);font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
.estado{display:flex;gap:6px;flex-wrap:wrap}
.estado button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-weight:600;font-size:14px}
.estado button[aria-pressed="true"][data-v="Hecho"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.estado button[aria-pressed="true"][data-v="Parcial"]{background:var(--part-soft);border-color:var(--part);color:var(--part)}
.estado button[aria-pressed="true"][data-v=""]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
details.guion{font-size:13px;color:var(--muted)}
details.guion summary{cursor:pointer;font-weight:600}

.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px}
.num{grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:16px}
:root[data-theme="dark"] .num{color:#10191c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .num{color:#10191c}}
.st{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.st h2{font-family:var(--f-head);font-size:18px;margin:0}
.st span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.body{display:flex;flex-direction:column;gap:8px;min-width:0}
.law{font-family:var(--f-mono);font-size:15px;font-weight:500;color:var(--accent)}
.mem{background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--bg)}
.chip.new{border-color:var(--new);background:var(--new-soft);color:var(--ink)}
.chip.new::before{content:"test · ";font-weight:700;color:var(--new)}
.q{border-left:3px solid var(--line);padding-left:10px}
.case{border-left:3px solid var(--accent);padding-left:10px}
details.pauta summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
details.pauta p{margin:6px 0 0}
.moron{font-size:13.5px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
.testrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.testrow input{width:64px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}

.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.card .ct{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.card .ct b{color:var(--ink)}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.card .acts button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
.card .acts button[aria-pressed="true"].ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.card .acts button[aria-pressed="true"].rep{background:var(--rep-soft);border-color:var(--rep);color:var(--rep)}
.card.is-ok{border-color:var(--ok)}
.card.is-rep{border-color:var(--rep)}
.empty{color:var(--muted);font-size:14px}
.rest{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted)}
.rest h1{color:var(--ink);margin-bottom:6px}

/* semana */
.week{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.week h3{margin:0;padding:10px 14px;font-family:var(--f-head);font-size:16px;border-bottom:1px solid var(--line);background:var(--bg)}
.wd{display:grid;grid-template-columns:88px 12px minmax(0,1fr);gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.wd:last-child{border-bottom:0}
.wd small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.wd .t{min-width:0;font-size:14px}
.wd .t em{font-style:normal;color:var(--muted);font-size:12.5px}
.wd.is-today{background:var(--accent-soft)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.dot.Hecho{background:var(--ok);border-color:var(--ok)}
.dot.Parcial{background:var(--part);border-color:var(--part)}
.dot.off{border-style:dotted}

/* articulos */
.legend{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grp h3{margin:0;padding:10px 14px;font-family:var(--f-head);font-size:16px;background:var(--bg);border-bottom:1px solid var(--line)}
.ar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.ar:last-child{border-bottom:0}
.ar .a{font-family:var(--f-mono);font-size:13.5px;color:var(--accent)}
.ar .lv{font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;margin-left:6px;font-family:var(--f-body)}
.lv.A{background:var(--accent-soft);color:var(--accent)} .lv.B{background:var(--bg);color:var(--muted);border:1px solid var(--line)} .lv.Test{background:var(--new-soft);color:var(--new)}
.ar p{margin:2px 0 0;font-size:13.5px}
.ar small{color:var(--muted);font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);width:34px;height:32px;font-weight:700;font-variant-numeric:tabular-nums;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--card)}
@media (max-width:480px){h1{font-size:23px}.ar{grid-template-columns:1fr}.wd{grid-template-columns:76px 12px minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}
.fc textarea{width:100%;min-height:120px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.fa{line-height:1.55}.fa mark{background:var(--part-soft);color:var(--ink);font-weight:700;padding:0 2px;border-radius:3px}
.nav button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.fbtn{border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 14px;font-weight:600}
details.guia{border:1.5px solid var(--accent);border-radius:10px;padding:8px 12px;background:var(--card)}
details.guia summary{cursor:pointer;font-weight:700;color:var(--accent)}
.gcapa{margin-top:10px}.gcapa b.gt{display:block;font-family:var(--f-head);font-size:15.5px;margin-bottom:2px}
.gidea{margin:8px 0 0;font-style:italic}
.jops{display:flex;flex-direction:column;gap:8px}
.jop{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600}
.jop:hover:not([disabled]){border-color:var(--accent)}
.jop.is-ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.jop.is-bad{border-color:var(--rep);background:var(--rep-soft);color:var(--rep)}
.jq h1.jcod{font-family:var(--f-mono)}
.jcat{display:flex;flex-direction:column;gap:2px}.jcat small{font-weight:500;color:var(--muted);font-size:12.5px}
.jtag{font-style:normal;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--new);background:var(--new-soft);border-radius:4px;padding:1px 6px;margin-left:4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pform label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:600;color:var(--muted)}
.pform input,.pform select,.pform textarea{font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-weight:400}
.pap{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.crono{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.crono .fbtn{white-space:nowrap}.crono b{font-family:var(--f-mono);font-size:18px;color:var(--ink);min-width:56px}
.x{background:none;border:0;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:0;cursor:pointer}
.chip .x{text-decoration:none;font-size:14px;margin-left:2px}
.lv.rep{background:var(--rep-soft);color:var(--rep)}
.chip.r-correcto{border-color:var(--ok);color:var(--ok)}.chip.r-parcial{border-color:var(--part);color:var(--part)}.chip.r-incorrecto,.chip.r-blanco{border-color:var(--rep);color:var(--rep)}
.est-completado{color:var(--ok);font-weight:700}.est-parcial{color:var(--part);font-weight:700}.est-reservado{color:var(--new);font-weight:700}
.info-e{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0}
.info-e>summary{cursor:pointer;padding:14px 16px;list-style:none;display:flex;flex-direction:column;gap:2px}
.info-e>summary::-webkit-details-marker{display:none}
.info-e>summary b{font-size:16px}
.info-e>summary small{color:var(--muted);font-size:12.5px}
.info-b{padding:0 16px 16px;border-top:1px solid var(--line)}
.info-b h4{margin:18px 0 6px;font-size:15px}
.info-b p,.info-b li{font-size:14.5px}
.info-b ul,.info-b ol{padding-left:20px;margin:6px 0}
.itab{overflow-x:auto;margin:6px 0}
.itab table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:480px}
.itab th,.itab td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.itab th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.itab td:nth-child(2){white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:560px){.itab table{min-width:0}.itab thead{display:none}.itab tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}.itab td{border:0;padding:0}.itab td:nth-child(3){grid-column:1/-1;color:var(--muted);font-size:13px}}
.head .acts{display:flex;gap:6px;flex-wrap:wrap}
.head .acts button:not(.fbtn){border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-weight:600}
button.chip{cursor:pointer}
.chip.is-done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.linkbtn{background:none;border:0;padding:0 4px;color:var(--accent);font-size:12.5px;text-decoration:underline}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:130px}
.hcard:hover{border-color:var(--accent)}
.hcard .lbl{color:var(--accent)}
.hcard b{font-size:18px;line-height:1.25}
.hcard small{color:var(--muted);font-size:13px}
.hcard .hcap{margin-top:auto;font-size:12.5px;color:var(--muted)}
.hstory{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.hstory h1{margin:0 0 4px}
.hbox{margin:14px 0 18px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;background:var(--bg)}
.hbox-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.hb-f+.hb-f{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.hstory .hbox p{font-size:15px;line-height:1.55;margin:0 0 6px}
.hstory .hbox p.hb-h{font-size:16px;margin-bottom:4px}
.hb-tipo{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.hstory .hbox p.hb-l{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 2px}
.hbox ol{margin:0 0 8px;padding-left:22px}
.hbox ol li{font-size:15px;line-height:1.55;margin:2px 0}
.hstory h4{margin:22px 0 6px;font-size:17px;color:var(--accent)}
.hstory p{font-size:16px;line-height:1.65;margin:0 0 10px}
.hstory ul.hl{margin:-4px 0 12px;padding-left:4px;list-style:none}
.hstory ul.hl li{font-size:16px;line-height:1.6;margin:0 0 6px;padding-left:22px;text-indent:-22px}
.hstory ul.hl li>b:first-child{display:inline-block;min-width:22px;text-indent:0}
.wrap.wide{max-width:1180px}
.hlayout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.hidx{position:sticky;top:104px;max-height:calc(100vh - 120px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.hidx summary{font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none}
.hidx summary::-webkit-details-marker{display:none}
.hidx a{display:block;font-weight:700;font-size:13.5px;color:var(--ink);text-decoration:none;margin:12px 0 4px;padding:3px 6px;border-radius:6px}
.hidx a.on{background:var(--accent-soft);color:var(--accent)}
.hidx ul{list-style:none;margin:0;padding:0 0 0 6px}
.hidx li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:12.5px;line-height:1.35;padding:2px 0;color:var(--muted)}
.hidx li b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:900px){.hlayout{grid-template-columns:minmax(0,1fr)}.hidx{position:static;max-height:none;order:-1}}
.inota{font-size:13px!important;color:var(--muted)}
</style>

function pickDay(f){
  if (DAYS.some(d => d.fecha === f)) return f;
  const next = DAYS.find(d => d.fecha > f);
  return next ? next.fecha : DAYS[DAYS.length-1].fecha;
}

async function rpc(fn, body){
  const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, { method:"POST",
    headers: Object.assign({ "apikey":SB_KEY, "Content-Type":"application/json" }, SB_KEY.startsWith("eyJ") ? { "Authorization":"Bearer "+SB_KEY } : {}), body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}

  if (writing || !dirty || !CODE) return;

}
async function pull(){
  if (!CODE || dirty || writing) return;
  try {
    const remote = await rpc("leer_progreso", { p_clave: CODE });

      state = Object.assign({ dias:{}, cards:{}, dominio:{}, fichas:{}, juego:{}, dom:{}, recs:{}, moron:{} }, remote);

    setSave("Sincronizado");

}

const FICHAS = [{"id": "lgt150-1", "tema": "T8", "art": "LGT 150.1", "desde": "2026-10-23", "q": "¿Cuánto dura el procedimiento inspector con carácter general y en qué casos dura más?", "a": "**18 meses** con carácter general.\n**27 meses** si concurre en cualquier obligación o periodo comprobado:\n1. Cifra anual de negocios **igual o superior a la que obliga a auditar** cuentas.\n2. Integrado en un **grupo de consolidación fiscal** o en el **régimen especial de grupo de entidades** (IVA) que esté siendo inspeccionado.\n3. Se comprueba el **Impuesto Complementario**.\nSi hay entidades vinculadas (art. 18 LIS) y una cumple la circunstancia, los 27 meses se aplican a todas."}, {"id": "lgt150-2", "tema": "T8", "art": "LGT 150.2", "desde": "2026-10-23", "q": "¿Desde cuándo y hasta cuándo se cuenta el plazo de la inspección? ¿Se descuentan dilaciones e interrupciones?", "a": "Desde la **notificación del inicio** hasta que se **notifique o se entienda notificado** el acto resultante. Basta acreditar **un intento de notificación con el texto íntegro** de la resolución.\nEn la comunicación de inicio se informa del plazo aplicable. Si las circunstancias de los 27 meses se aprecian después, el plazo pasa a 27 meses desde el inicio y se comunica.\nEl plazo es **único** para todas las obligaciones y periodos.\n**NO se aplica el art. 104.2**: no se descuentan interrupciones justificadas ni dilaciones no imputables a la Administración."}, {"id": "lgt150-3", "tema": "T8", "art": "LGT 150.3", "desde": "2026-10-23", "q": "¿Qué causas suspenden el cómputo del plazo de la inspección? (7)", "a": "Jueces:\na) Remisión del expediente al **Ministerio Fiscal** o jurisdicción sin liquidar (art. 251).\nb) Un **órgano jurisdiccional** ordena suspender o paralizar.\nConflictos entre administraciones:\nc) Conflicto ante las **Juntas Arbitrales** (CCAA, Navarra, País Vasco).\nd) Remisión a la **Comisión consultiva** del conflicto en la aplicación de la norma.\nf) Comunicación a las Administraciones afectadas (**Concierto vasco / Convenio navarro**).\nNotificación:\ne) **Intento de notificación de la propuesta** de resolución o liquidación, o del acuerdo de completar actuaciones (156.3.b).\nOtros:\ng) **Fuerza mayor**.\nDurante la suspensión no se actúa (salvo en e). Al acabar, se sigue **por el plazo que reste**."}, {"id": "lgt150-4", "tema": "T8", "art": "LGT 150.4-5", "desde": "2026-10-23", "q": "¿Cuándo se extiende el plazo máximo de la inspección y cuánto?", "a": "**Hasta 60 días naturales** en total: periodos sin actuaciones pedidos por el obligado **antes del trámite de audiencia**. La denegación no es recurrible.\n**3 meses**: si dijo que no aportaría documentación (o no la aportó tras el **tercer requerimiento**) y la aporta después, siempre que hayan pasado **al menos 9 meses** desde el inicio.\n**6 meses**: si esa aportación llega **tras formalizar el acta** y obliga a actuaciones complementarias.\n**6 meses**: si, apreciadas las circunstancias de la **estimación indirecta**, se aportan datos o pruebas sobre ellas."}, {"id": "lgt150-5", "tema": "T8", "art": "LGT 150.6", "desde": "2026-10-23", "q": "¿Qué ocurre si se incumple el plazo máximo de la inspección?", "a": "**No hay caducidad**: el procedimiento continúa hasta terminar.\nEfectos sobre las obligaciones pendientes de liquidar:\na) Las actuaciones hechas dentro del plazo **no interrumpen la prescripción**. Sí la interrumpen las posteriores (y el obligado tiene derecho a saber qué conceptos y periodos abarcan).\nb) Los ingresos desde el inicio hasta la primera actuación posterior al incumplimiento son **espontáneos** a efectos del **art. 27** (recargo, no sanción).\nc) **No se exigen intereses de demora** desde el incumplimiento hasta el final."}, {"id": "lgt150-6", "tema": "T8", "art": "LGT 150.7", "desde": "2026-10-23", "q": "Si un tribunal o TEA ordena retrotraer la inspección por defectos formales, ¿en qué plazo debe terminar?", "a": "En el **plazo que reste** del apartado 1 desde el momento al que se retrotraen las actuaciones, **o en 6 meses** si esto es mayor.\nSe cuenta desde que el expediente **llega al órgano competente** para ejecutar la resolución.\nSí se exigen **intereses de demora** por la nueva liquidación, desde la misma fecha de inicio que la liquidación anulada."}, {"id": "lgt142-1", "tema": "T8", "art": "LGT 142.1", "desde": "2026-10-23", "q": "¿Qué puede examinar la inspección?", "a": "Documentos, **libros, contabilidad** principal y auxiliar, ficheros, **facturas**, justificantes, **correspondencia** con trascendencia tributaria, **bases de datos, programas, registros y archivos informáticos** de actividades económicas.\nTambién la **inspección de bienes, elementos y explotaciones** y cualquier antecedente necesario para exigir las obligaciones tributarias."}, {"id": "lgt142-2", "tema": "T8", "art": "LGT 142.2 y 113", "desde": "2026-10-23", "q": "¿Qué necesita la inspección para entrar en un local de negocio? ¿Y en un domicilio constitucionalmente protegido?", "a": "**Fincas, locales y establecimientos** con actividad, bienes o pruebas: **acuerdo de entrada** de la autoridad administrativa que fije el reglamento, **salvo consentimiento** del obligado o de quien custodie el lugar.\n**Domicilio constitucionalmente protegido**: se aplica el **art. 113**, es decir, **autorización judicial**. La solicitud debe incorporar el **acuerdo de entrada** firmado por la autoridad administrativa."}, {"id": "lgt142-3", "tema": "T8", "art": "LGT 142.3", "desde": "2026-10-23", "q": "¿Cómo debe colaborar el obligado tributario con la inspección? ¿Puede exigirse que vaya en persona?", "a": "Debe **atender y colaborar**. Si es requerido, debe **personarse, por sí o por representante**, en el lugar, día y hora señalados y aportar o tener a disposición la documentación pedida.\nLa **comparecencia personal** solo se exige **excepcionalmente y de forma motivada**, cuando la naturaleza de las actuaciones lo requiera."}, {"id": "lgt142-4", "tema": "T8", "art": "LGT 142.4", "desde": "2026-10-23", "q": "¿Qué consideración tienen los funcionarios de inspección?", "a": "Son **agentes de la autoridad**. Deben **acreditar su condición** si se lo piden **fuera de las oficinas públicas**.\nLas autoridades públicas les prestan **protección y auxilio**."}, {"id": "lgt146-1", "tema": "T8", "art": "LGT 146", "desde": "2026-10-23", "q": "Medidas cautelares en la inspección: ¿para qué, cuáles, con qué límites y quién las ratifica?", "a": "Para **asegurar o conservar pruebas** cuando haya riesgo de que desaparezcan, se destruyan o alteren. Deben estar **motivadas**.\nConsisten en **precinto, depósito o incautación** de mercaderías, productos, libros, registros, documentos, archivos, locales o equipos electrónicos.\nDeben ser **proporcionadas y temporales**; no pueden causar un perjuicio de difícil o imposible reparación.\nLas **ratifica el órgano competente para liquidar en 15 días** desde su adopción; se levantan si desaparecen las circunstancias.\n(Contrasta esta ficha con tu texto del art. 146.)"}, {"id": "lgt77-1", "tema": "T11", "art": "LGT 77.1", "desde": "2026-10-24", "q": "¿Qué es el derecho de prelación de la Hacienda Pública y qué límite tiene?", "a": "La Hacienda Pública tiene **prelación para cobrar los créditos tributarios vencidos y no satisfechos** cuando concurre con otros acreedores.\n**Excepción**: los acreedores de **dominio, prenda, hipoteca u otro derecho real** debidamente **inscrito en el registro** correspondiente **antes** de que se haga constar el derecho de la Hacienda Pública.\nSin perjuicio de lo dispuesto en los **arts. 78 y 79** (hipoteca legal tácita y afección de bienes)."}, {"id": "lgt77-2", "tema": "T11", "art": "LGT 77.2", "desde": "2026-10-24", "q": "¿Qué régimen siguen los créditos tributarios cuando el deudor está en concurso?", "a": "En el **proceso concursal**, los créditos tributarios se rigen por lo dispuesto en la **legislación concursal** (texto refundido de la Ley Concursal).\nLa prelación del 77.1 no se aplica tal cual dentro del concurso."}, {"id": "lgt78-1", "tema": "T11", "art": "LGT 78", "desde": "2026-10-24", "q": "Hipoteca legal tácita: ¿en qué tributos opera, qué deudas cubre y frente a quién?", "a": "En tributos que graven **periódicamente bienes o derechos inscribibles en un registro público** o sus productos directos (ejemplo típico: **IBI**).\nEl Estado, las CCAA y las entidades locales tienen **preferencia sobre cualquier otro acreedor o adquirente, aunque hayan inscrito sus derechos**.\nCubre las deudas devengadas y no satisfechas del **año natural en que se exija el pago** y del **año natural inmediatamente anterior**."}, {"id": "lgt78-2", "tema": "T11", "art": "LGT 78", "desde": "2026-10-24", "q": "Caso: en 2026 el ayuntamiento exige el IBI impagado de 2023, 2024, 2025 y 2026 de un piso que el deudor vendió a un tercero que inscribió su compra. ¿Para qué años opera la hipoteca legal tácita?", "a": "Solo para **2026** (año en que se exige el pago) y **2025** (año inmediatamente anterior).\nPara esos dos años, el ayuntamiento cobra con preferencia **incluso frente al comprador que inscribió**.\n2023 y 2024 quedan fuera de la hipoteca legal tácita (habría que acudir a otras vías, como la **afección de bienes del art. 79**)."}, {"id": "lgt168-1", "tema": "T11", "art": "LGT 168", "desde": "2026-10-24", "q": "Deuda garantizada que no se paga en periodo voluntario: ¿cómo la cobra la Administración?", "a": "**Ejecutando la garantía** a través del **procedimiento administrativo de apremio**.\nEs la regla general: primero la garantía, antes que embargar otros bienes."}, {"id": "lgt168-2", "tema": "T11", "art": "LGT 168", "desde": "2026-10-24", "q": "¿Cuándo puede la Administración embargar otros bienes antes de ejecutar la garantía? ¿Qué pasa entonces con la garantía?", "a": "Dos casos:\n1. Cuando la garantía **no sea proporcionada** a la deuda garantizada.\n2. Cuando **lo solicite el obligado**, señalando **bienes suficientes**.\nEn ese caso, la garantía **queda sin efecto en la parte asegurada por los embargos**."}, {"id": "l39-35-1", "tema": "COM-A1", "art": "Ley 39/2015, 35.1", "desde": "2026-10-25", "q": "¿Cómo se motivan los actos y qué actos deben motivarse? (9 casos)", "a": "Con **sucinta referencia de hechos y fundamentos de derecho**.\nTruco «2-1-2-4»:\nPerjudican: a) **limitan derechos** subjetivos o intereses legítimos · h) **sancionadores** (también la propuesta) y **responsabilidad patrimonial**.\nResuelven contra algo: b) **revisión de oficio, recursos, arbitraje** y sus inadmisiones.\nSe apartan o deciden libre: c) se separan del **criterio precedente** o del **dictamen** consultivo · i) **discrecionales** y los que exija una norma.\nAlteran el procedimiento: d) **suspensión** y **medidas provisionales** (art. 56) · e) **urgencia**, **ampliación de plazos**, **actuaciones complementarias** · f) **rechazo de pruebas** · g) terminación por **imposibilidad sobrevenida** y **desistimiento de la Administración** en procedimientos de oficio."}, {"id": "l39-35-2", "tema": "COM-A1", "art": "Ley 39/2015, 35.2", "desde": "2026-10-25", "q": "¿Cómo se motivan los actos que ponen fin a procedimientos selectivos y de concurrencia competitiva?", "a": "Según lo que dispongan las **normas que regulen sus convocatorias**.\nEn todo caso deben quedar **acreditados en el procedimiento los fundamentos** de la resolución."}, {"id": "l39-47-1", "tema": "COM-A1", "art": "Ley 39/2015, 47.1", "desde": "2026-10-25", "q": "¿Cuándo es nulo de pleno derecho un acto administrativo? (7 causas)", "a": "«DIos COn-DEna PROFAnar la LEY»:\na) Lesionan **derechos y libertades susceptibles de amparo**.\nb) Órgano **manifiestamente incompetente por materia o territorio**.\nc) **Contenido imposible**.\nd) Constitutivos de **infracción penal** o dictados como consecuencia de ella.\ne) Prescindiendo **total y absolutamente del procedimiento** o de las reglas esenciales de los **órganos colegiados**.\nf) Actos expresos o presuntos por los que se adquieren **facultades o derechos sin los requisitos esenciales**.\ng) Cualquier otro que establezca una **disposición con rango de ley**."}, {"id": "l39-47-2", "tema": "COM-A1", "art": "Ley 39/2015, 47.2", "desde": "2026-10-25", "q": "¿Cuándo son nulas de pleno derecho las disposiciones administrativas (reglamentos)?", "a": "Cuando:\n· vulneran la **Constitución, las leyes u otras disposiciones de rango superior**;\n· regulan **materias reservadas a la ley**;\n· establecen la **retroactividad** de disposiciones **sancionadoras no favorables** o **restrictivas de derechos individuales**."}, {"id": "l39-48-1", "tema": "COM-A1", "art": "Ley 39/2015, 48", "desde": "2026-10-25", "q": "¿Qué actos son anulables? ¿Cuándo anulan el defecto de forma y la actuación fuera de plazo?", "a": "Regla general: **cualquier infracción del ordenamiento jurídico, incluso la desviación de poder**.\nDefecto de forma: solo si el acto carece de los **requisitos formales indispensables para alcanzar su fin** o causa **indefensión**.\nFuera de plazo: solo si **lo impone la naturaleza del término o plazo**."}, {"id": "l39-47-3", "tema": "COM-A1", "art": "Ley 39/2015, 47 y 48", "desde": "2026-10-25", "q": "Clasifica: (1) acto dictado por un órgano inferior en lugar de su superior jerárquico; (2) sanción impuesta sin ningún procedimiento; (3) acto al que le falta un trámite de informe no esencial.", "a": "(1) **Anulable**: la incompetencia **jerárquica** no está en el 47.1.b, que solo recoge la manifiesta por **materia o territorio**.\n(2) **Nulo**: se ha prescindido **total y absolutamente del procedimiento** (47.1.e).\n(3) **Anulable como mucho**: omitir un trámite no es prescindir totalmente; solo anula si falta un requisito indispensable o hay indefensión (48.2)."}, {"id": "irpf45-1", "tema": "T16", "art": "LIRPF 45", "desde": "2026-10-28", "q": "¿Qué forma la renta general?", "a": "Los **rendimientos y las ganancias y pérdidas patrimoniales que no sean renta del ahorro** (art. 46).\nMás las **imputaciones de renta** de los **arts. 85, 91, 92 y 95** y del capítulo de **transparencia fiscal internacional** del texto refundido de la Ley del IS.\nEjemplos: trabajo, alquileres, actividades económicas, capital mobiliario del **25.4**, ganancias **sin transmisión** (premios, subvenciones)."}, {"id": "irpf46-1", "tema": "T16", "art": "LIRPF 46.a", "desde": "2026-10-28", "q": "¿Qué rendimientos del capital mobiliario son renta del ahorro? ¿Cuáles no?", "a": "Del ahorro, los de los apartados **1, 2 y 3 del art. 25**:\n25.1 **participación en fondos propios** (dividendos);\n25.2 **cesión a terceros de capitales propios** (intereses);\n25.3 **seguros de vida o invalidez** y rentas.\nNo son del ahorro los del **25.4** (otros rendimientos): van a la general."}, {"id": "irpf46-2", "tema": "T16", "art": "LIRPF 46.a", "desde": "2026-10-28", "q": "Excepción de entidades vinculadas: ¿qué intereses van a la renta general y cómo se calcula?", "a": "Los rendimientos del **25.2** (intereses) por el **exceso de capitales cedidos a una entidad vinculada** sobre **3 veces sus fondos propios**, en la parte que corresponda a la **participación** del contribuyente.\nFondos propios: los del balance del **último ejercicio cerrado antes del devengo** del impuesto. Participación: la existente **en la fecha de devengo**.\nSi la vinculación no es socio-entidad, se toma una participación del **25 %**."}, {"id": "irpf46-3", "tema": "T16", "art": "LIRPF 46.b", "desde": "2026-10-28", "q": "¿Qué ganancias y pérdidas patrimoniales son renta del ahorro y cuáles van a la general?", "a": "Ahorro: las que se ponen de manifiesto **con ocasión de transmisiones** de elementos patrimoniales (vender acciones, inmuebles, fondos...).\nGeneral: las que **no** derivan de una transmisión (premios, subvenciones, indemnizaciones...).\nTruco: **vender → ahorro; ganar sin vender → general**."}, {"id": "irpf48-1", "tema": "T16", "art": "LIRPF 48", "desde": "2026-10-28", "q": "¿Cómo se forma la base imponible general y cómo se compensan sus saldos?", "a": "Suma de dos saldos:\na) **Rendimientos e imputaciones** de renta, compensados entre sí **sin limitación**.\nb) Saldo **positivo** de **ganancias y pérdidas** de la general, compensadas **exclusivamente entre sí**.\nSi b) es **negativo**: se compensa con el saldo positivo de a) con el límite del **25 %** de ese saldo.\nLo que sobre: en los **4 años siguientes**, en el mismo orden, por la **cuantía máxima** cada año y sin acumularlo a pérdidas posteriores."}, {"id": "irpf49-1", "tema": "T16", "art": "LIRPF 49", "desde": "2026-10-28", "q": "¿Cómo se forma la base imponible del ahorro y cómo se compensan sus saldos?", "a": "Saldo positivo de sumar:\na) **Rendimientos** del ahorro, compensados exclusivamente entre sí.\nb) **Ganancias y pérdidas** del ahorro, compensadas exclusivamente entre sí.\nSi a) es negativo, se compensa con el positivo de b) hasta el **25 %**; si b) es negativo, con el positivo de a) hasta el **25 %** (**en los dos sentidos**).\nLo que sobre: **4 años siguientes**, cuantía máxima cada año, sin acumular."}, {"id": "irpf48-2", "tema": "T16", "art": "LIRPF 48 y 49", "desde": "2026-10-28", "q": "Caso: sueldo 30.000 €; premio 1.000 € y pérdida sin transmisión 3.000 €; dividendos 4.000 €; pérdida por venta de acciones 2.000 €. ¿Bases general y del ahorro? ¿Algo para años siguientes?", "a": "**General**: cajón de ganancias = 1.000 − 3.000 = **−2.000**. Límite 25 % de 30.000 = 7.500, así que se compensa entero: base general **28.000 €**.\n**Ahorro**: cajón de ganancias = **−2.000**. Límite 25 % de 4.000 = **1.000**. Base del ahorro 4.000 − 1.000 = **3.000 €**.\nQuedan **1.000 €** de pérdidas del ahorro para los **4 años siguientes**.\nLa pérdida de las acciones **nunca** resta del sueldo: las cajas no se mezclan."}];
const INTERVALOS = [1, 3, 7, 14, 30, 60];
let fichaModo = "dia", fichaDia = null, cola = [], colaIdx = 0, fichaVuelta = false, respDraft = "";
function addDays(f, n){ const d = new Date(f+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); }
function fichaEstado(f){ return (state.fichas||{})[f.id] || null; }
function fmtA(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, "<mark>$1</mark>").replace(/\n/g, "<br>"); }
/* qué toca un día: fichas del tema estudiado ese día + repasos que vencen ese día + arrastre de ese día */
function itemsDia(f){
  const nuevas = FICHAS.filter(x => x.desde === f);
  const repasos = FICHAS.filter(x => x.desde !== f && fichaEstado(x) && (f === TODAY ? fichaEstado(x).due <= f : fichaEstado(x).due === f));
  const arr = []; /* los arrastres del Excel ya no se usan */
  const recs = recsDe(f);
  return { nuevas, repasos, arr, recs };
}
function abrirCola(f){
  const it = itemsDia(f);
  fichaDia = f; fichaModo = "dia"; colaIdx = 0; fichaVuelta = false; respDraft = "";
  cola = [...it.nuevas.map(x => ({t:"ficha", id:x.id})), ...it.repasos.map(x => ({t:"ficha", id:x.id, rep:true})), ...it.arr.map(c => ({t:"arr", id:c.id})), ...it.recs.map(k => ({t:"rec", id:k}))];
}
function gradeFicha(id, g){
  state.fichas = state.fichas || {};
  const s = state.fichas[id] || { b: 0 };
  let b = s.b || 0;
  if (g === "mal") b = 0; else if (g === "bien" && state.fichas[id]) b = Math.min(b + 1, INTERVALOS.length - 1);
  state.fichas[id] = { b, due: addDays(TODAY, g === "mal" ? 1 : INTERVALOS[b]), last: g };
  const ff = FICHAS.find(x => x.id === id); if (ff){ artIdsFrom(ff.art).forEach(a => { if (g === "bien") domRaise(a, 3, "fichas"); else if (g === "mal") domFlag(a); }); }
}
function siguiente(){ colaIdx++; fichaVuelta = false; respDraft = ""; scheduleSave(); render(); window.scrollTo(0,0); }
function resumenDia(f){
  const it = itemsDia(f);
  return { n: it.nuevas.length, r: it.repasos.length, a: it.arr.length, c: it.recs.length };
}
function renderFichas(){
  if (!fichaDia) abrirCola(pickDay(TODAY));
  const dd = DAYS.find(x => x.fecha === fichaDia);
  let h = `<div class="nav"><button data-fmode="dia" aria-pressed="${fichaModo==="dia"}">Repaso del día</button>
    <button data-fmode="todas" aria-pressed="${fichaModo==="todas"}">Todas las fichas (${FICHAS.length})</button></div>`;
  if (fichaModo === "todas"){
    const porDia = {};
    FICHAS.forEach(x => (porDia[x.desde] ||= []).push(x));
    return h + `<div class="legend">Las fichas se agrupan por el día en que se estudia su tema. Pulsa <b>Hacer las de este día</b> para repasar ese día completo (fichas del tema, repasos y arrastre). Nivel = veces seguidas que te ha salido bien.</div>` +
      Object.entries(porDia).sort().map(([f, fs]) => { const d = DAYS.find(x => x.fecha === f);
        return `<section class="grp"><h3>${esc(d ? d.dia : "")} ${fmt(f)} · ${esc(d ? d.bloque : "")}</h3>
        <div class="ar"><div><button class="fbtn" data-cola="${f}">Hacer las de este día</button></div></div>
        ${fs.map(x => { const s = fichaEstado(x);
          return `<div class="ar"><div><span class="a">${esc(x.art)}</span><p>${esc(x.q)}</p>
          <small>${s ? "Nivel "+s.b+" · vuelve el "+fmt(s.due) : "Sin repasar todavía"}</small></div></div>`; }).join("")}</section>`; }).join("");
  }
  const i = DAYS.findIndex(x => x.fecha === fichaDia);
  h += `<div class="nav"><button data-fdia="-1" aria-label="Día anterior" ${i<=0?"disabled":""}>‹</button>
    <span class="grow" style="text-align:center;font-weight:600">${esc(dd ? dd.dia : "")} ${fmt(fichaDia)}${fichaDia===TODAY?" · hoy":""}</span>
    <button data-fdia="1" aria-label="Día siguiente" ${i>=DAYS.length-1?"disabled":""}>›</button></div>`;
  if (!cola.length) return h + `<div class="rest"><h1>Nada para este día</h1><p>Este día no tiene fichas de tema, repasos ni arrastre.</p></div>`;
  if (colaIdx >= cola.length) return h + `<div class="rest"><h1>Repaso terminado</h1><p>Has pasado las ${cola.length} tarjetas de este día. Las fichas volverán solas cuando les toque.</p>
    <div class="estado" style="justify-content:center"><button data-cola="${fichaDia}">Repetir este día</button></div></div>`;
  const item = cola[colaIdx];
  const pos = `<span>Tarjeta ${colaIdx+1} de ${cola.length}</span>`;
  if (item.t === "rec"){
    const r = state.recs[item.id] || {}; const tipo = REC_TIPOS.find(t => t[1] === r.tipo) || [];
    return h + `<section class="head fc"><div class="when"><span class="code">Recuperación ${esc(r.tipo||"")}</span>${pos}</div>
      <div class="lbl">${esc(tipo[2]||"")}</div><h1 style="font-size:24px">${esc(artLabel(r.art))}</h1><p style="margin:0">${esc(artQue(r.art))}</p>
      <p style="margin:0;font-size:13px;color:var(--muted)">Viene de: ${esc(r.origen||"un error anterior")}</p>
      <label class="lbl" for="resp">Escribe la regla o resuelve sin mirar</label>
      <textarea id="resp" rows="6" placeholder="Figura · regla · condición decisiva · artículo">${esc(respDraft)}</textarea>
      <div class="estado"><button data-rec="rep" data-v="Parcial">Reparar</button><button data-rec="ok" data-v="Hecho">Me salió</button><button data-rec="manana" data-v="">Pasar a mañana</button></div></section>`;
  }
  if (item.t === "arr"){
    const c = CARDS.find(x => x.id === item.id);
    return h + `<section class="head fc"><div class="when"><span class="code">Arrastre · ${esc(c.etapa)}</span>${pos}</div>
      <div class="lbl">${esc(c.tema)}</div><h1 style="font-size:21px">${esc(c.pregunta)}</h1>
      ${c.aplicacion?`<div class="q"><span class="lbl">Aplica</span><br>${esc(c.aplicacion)}</div>`:""}
      <label class="lbl" for="resp">Escribe tu respuesta sin mirar</label>
      <textarea id="resp" rows="6" placeholder="Después compruébalo en tus apuntes o en la ley">${esc(respDraft)}</textarea>
      <div class="estado"><button data-arr="rep" data-v="Parcial">Reparar</button><button data-arr="ok" data-v="Hecho">Me salió</button></div></section>`;
  }
  const f = FICHAS.find(x => x.id === item.id);
  return h + `<section class="head fc">
    <div class="when"><span class="code">${esc(f.art)}</span>${item.rep?`<span>Repaso</span>`:`<span>Tema del día</span>`}${pos}</div>
    <h1 style="font-size:21px">${esc(f.q)}</h1>
    <label class="lbl" for="resp">Escribe tu respuesta sin mirar</label>
    <textarea id="resp" rows="6" placeholder="Cifras exactas y artículo con su apartado">${esc(respDraft)}</textarea>
    ${fichaVuelta ? `<div class="mem fa">${fmtA(f.a)}</div>
      <div class="lbl">¿Qué tal te ha salido?</div>
      <div class="estado"><button data-grade="mal" data-v="Parcial">No me salió</button><button data-grade="regular" data-v="">Me costó</button><button data-grade="bien" data-v="Hecho">Bien</button></div>
      <p style="margin:0;font-size:12.5px;color:var(--muted)">No me salió: vuelve mañana · Me costó: vuelve pronto · Bien: cada vez tarda más en volver</p>`
    : `<div class="estado"><button id="voltear" data-v="" aria-pressed="true">Ver respuesta</button></div>`}
  </section>`;
}

function blqActual(){ return BLOQUES.find(b => !blqHecho(b)) || null; }
function exKey(b, n){ return b.id + ":" + n; }
function exHecho(b, n){ return (state.arrex || {})[exKey(b, n)]; }
function diasEntre(a, b){ return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 86400000); }
function fmtCorta(f){ const [y,m,d] = f.split("-"); return d+"/"+m; }
function poolArrastre(){
  const act = blqActual(), idxAct = act ? BLOQUES.indexOf(act) : BLOQUES.length;
  const listas = BLOQUES.filter((b, i) => i < idxAct || blqHecho(b))
    .map(b => (b.arrastre || []).filter(n => !exHecho(b, n)).map(n => ({ b, n })));
  const hoyHechos = BLOQUES.reduce((s, b) => s + (b.arrastre || []).filter(n => exHecho(b, n) === TODAY).length, 0);
  const cupo = Math.max(0, 3 - hoyHechos);
  const out = []; let k = 0;
  while (listas.some(l => l.length) && out.length < cupo){ const l = listas[k % listas.length]; if (l.length) out.push(l.shift()); k++; }
  return out;
}

const INFO = [{"id": "historia-resp-corta", "fecha": "2026-11-11", "titulo": "Historia corta · Responsables y sucesores", "tag": "Historia", "corto": "Responsables y sucesores · corta", "arts": "Para memorizar · 39 a 43 y 174 a 177 LGT", "html": "<p>Dos historias cortas conectadas: quién paga por ALBUS mientras existe, y qué pasa cuando alguien desaparece.<\/p><h4>Parte 1 · 1 · ALBUS no paga (41 LGT)<\/h4><p>ALBUS SA debe una liquidación de IVA: <b>10.000 €<\/b> de cuota, <b>1.000 €<\/b> de intereses y <b>5.000 €<\/b> de sanción. No paga, entra en ejecutiva y se le suma el recargo. Hacienda busca a otros que paguen por ella.<\/p><p>Puede encontrar dos tipos de personas. El <b>responsable<\/b> paga una deuda que sigue siendo de ALBUS, y para reclamársela hace falta un <b>acto que lo declare<\/b>. El <b>sucesor<\/b> ocupa el lugar de un deudor que ha desaparecido, porque ha muerto o se ha extinguido (Parte 2).<\/p><p>Responsables los hay de dos clases. El <b>solidario<\/b> va de la mano de ALBUS: no hace falta que ALBUS sea declarada fallida. El <b>subsidiario<\/b> va detrás: solo cuando ALBUS y los solidarios son <b>fallidos<\/b>. Si la ley no dice cuál, <b>subsidiario<\/b> (41.2).<\/p><p>¿Cuánto paga? La deuda <b>en voluntaria<\/b>, <b>11.000 €<\/b>, sin el recargo ejecutivo de ALBUS (41.3). Con la sanción, <b>16.000 €<\/b>, pero solo si la ley lo dice (41.4). Si el responsable tampoco paga, le caen sus propios recargos. La excepción es el 42.2, que cobra también el recargo y los intereses del ejecutivo.<\/p><h4>Parte 1 · 2 · Los que van de la mano (42 LGT)<\/h4><p>El asesor que consiguió las <b>facturas falsas<\/b> colaboró activamente en la infracción: solidario, con sanción, <b>16.000 €<\/b> (42.1.a). D. Manuel, el administrador, crea <b>NUEVA ALBUS<\/b> y sigue con el mismo negocio: la nueva es solidaria (42.1.c). Si antes de comprar hubiera pedido el <b>certificado<\/b> de deudas, respondería solo de lo que figurara en él, y de nada si saliera limpio o Hacienda no lo diera en 3 meses.<\/p><p>Y los que esconden o desobedecen (42.2), siempre <b>hasta lo que Hacienda podría haber embargado<\/b>. D. Manuel debe 300.000 € de su IRPF y <b>dona su piso<\/b> de 200.000 € a sus hijos: Pedro, mayor de edad y sabiendo para qué, responde hasta 200.000; Raúl, de 14 años, nunca, porque es <b>menor<\/b> (TS). Un cliente de ALBUS recibe el embargo y sigue pagando a ALBUS por descuido (b) o por un acuerdo con ella (c). El depositario de las furgonetas embargadas deja que D. Manuel se las lleve (d).<\/p><h4>Parte 1 · 3 · Los que van detrás (43 LGT)<\/h4><p>D. Manuel era administrador cuando ALBUS cometió la infracción y no hizo nada para evitarla: subsidiario, también de la sanción, <b>16.000 €<\/b> (43.1.a). Luego entra D.ª Inés, y ALBUS <b>cierra<\/b> con deudas: responde ella, como administradora al cese, pero <b>sin sanciones<\/b> (43.1.b). Si ALBUS presenta el IVA <b>sin pagar<\/b> una y otra vez (la mitad o más del año) mientras paga a sus proveedores, el administrador responde del IVA y las retenciones (43.2).<\/p><p>Más subsidiarios: ALBUS, si <b>subcontrata<\/b> el montaje de sus muebles (su actividad principal) sin pedir el certificado de estar al corriente, por las retenciones e IVA de esos trabajos (43.1.f) y quien usa una sociedad como pantalla, o al revés (43.1.g y h).<\/p><h4>Parte 1 · 4 · Cómo se le reclama (174 a 176 LGT)<\/h4><p>Decide el <b>órgano de recaudación<\/b>, siempre después de la liquidación. Notifica un <b>acuerdo de inicio<\/b>, da <b>15 días de audiencia<\/b> y tiene <b>6 meses<\/b> para resolver (124 RGR). El responsable paga en el plazo del <b>62.2<\/b>; si no, apremio.<\/p><p>Al <b>solidario<\/b>, si se le declaró antes de que acabara la voluntaria de ALBUS, basta con <b>requerirle<\/b> el pago (175). Al <b>subsidiario<\/b>, solo después de declarar <b>fallidos<\/b> a ALBUS y a los solidarios (176). Al recurrir, el responsable discute el presupuesto y las liquidaciones; en el 42.2, solo el alcance (174.5).<\/p><h4>Parte 2 · 5 · Muere D. Manuel (39 y 177.1 LGT, 127 RGR)<\/h4><p>D. Manuel muere. Sus hijos ya no necesitan ser declarados responsables: son <b>sucesores<\/b> y ocupan su lugar. Heredan sus deudas tributarias, aunque <b>aún no estuvieran liquidadas<\/b> (39.1-2). Mientras nadie acepta la herencia (<b>yacente<\/b>), Hacienda cobra con los bienes de la herencia a través de su representante.<\/p><p><b>Lo que no heredan.<\/b> Sus <b>sanciones<\/b>, nunca. Lo que D. Manuel debía <b>como responsable<\/b> solo pasa si se le notificó la derivación antes de morir, y aun así sin la parte de sanción (TEAC 2024). Su responsabilidad del <b>43.1.a<\/b>, los 16.000 € de ALBUS, tampoco pasa, según un criterio del TEAC de 30-4-2026 que la considera sancionadora; no lo dice la LGT y aún no está reiterado.<\/p><p><b>Cómo se les cobra.<\/b> Basta con constatar la muerte y <b>notificarles el requerimiento<\/b> de pago (177.1). Si Pedro pide tiempo para decidir si acepta (<b>derecho a deliberar<\/b>), se espera. Lo que pagan depende de cuándo murió (127.1 RGR):<\/p><ul class=\"hl\"><li><b>•<\/b> Con la deuda <b>en voluntaria<\/b>, la pagan en el plazo del 62.2, sin recargo<\/li><li><b>•<\/b> Ya <b>en ejecutiva sin providencia<\/b>, el <b>5 %<\/b> si pagan antes de que se les notifique la providencia, y si pagan después, el 10 % o el 20 % según paguen o no en el plazo del 62.5<\/li><li><b>•<\/b> Con la providencia notificada y el plazo del 62.5 abierto, el <b>10 %<\/b> si pagan en ese plazo<\/li><li><b>•<\/b> Con ese plazo vencido, el <b>20 %<\/b>.<\/li><\/ul><p><b>¿A cuál de los dos?<\/b> Pedro aceptó <b>pura y simplemente<\/b>: tras la partición, Hacienda puede pedirle toda la deuda. Raúl aceptó <b>a beneficio de inventario<\/b>: solo hasta lo que heredó (1084 CC). Si Pedro paga más de su parte, se lo reclama a Raúl (1085 CC). Y antes de reclamar nada, Hacienda mira si la deuda está <b>prescrita<\/b> (66 a 68).<\/p><h4>Parte 2 · 6 · Se extingue ALBUS (40 y 177.2 LGT)<\/h4><p>ALBUS se disuelve y se <b>liquida<\/b>. Sus deudas pasan a los <b>socios<\/b>, solidariamente; como es una SA, cada uno responde solo <b>hasta su cuota de liquidación<\/b> más lo que recibió en los <b>2 años anteriores<\/b> a la disolución, si con eso rebajó el patrimonio que debía responder ante Hacienda (40.1). Si hubiera sido una sociedad de responsabilidad ilimitada, responderían de todo. También pasan las deudas aún no liquidadas (40.2).<\/p><p>Aquí, al revés que con D. Manuel, <b>las sanciones sí pasan<\/b>, con el mismo límite (40.5). Pero si muere un socio, sus herederos no heredan esas sanciones.<\/p><p>Si ALBUS se hubiera <b>fusionado<\/b> sin liquidarse, todo pasaría a la sociedad que la absorbe (40.3). Si se disuelve la comunidad de bienes de D. Manuel y su hermano, o una fundación, sus deudas pasan a los comuneros o a quienes reciben los bienes (40.4). Constatada la extinción, Hacienda va contra <b>cualquier socio o contra todos<\/b> (177.2).<\/p><p><b>En una frase:<\/b> el responsable paga por otro tras un acto que lo declara (solidario sin fallido, subsidiario con fallido) y solo la deuda en voluntaria; el sucesor ocupa el lugar del que desaparece: de la persona que muere se heredan las deudas pero nunca las sanciones, y de la sociedad extinguida pasan deudas y sanciones hasta la cuota de cada socio.<\/p><p class=\"inota\">Versión corta para memorizar. La completa, con los detalles y las excepciones, está en «Historia · Responsables y sucesores».<\/p>", "indice": [["1 · ALBUS no paga", [["41.2", "Subsidiaria salvo que la ley diga otra cosa"], ["41.3", "Deuda en voluntaria, sin recargos"], ["41.4", "Sanciones solo si la ley lo dice"]]], ["2 · Los que van de la mano", [["42.1.a", "Colabora en la infracción"], ["42.1.c", "Sigue el negocio · certificado"], ["42.2", "Esconde o desobedece · hasta lo embargable"]]], ["3 · Los que van detrás", [["43.1.a", "Administrador en la infracción · con sanción"], ["43.1.b", "Administrador al cierre · sin sanción"], ["43.2", "Presentar sin pagar"], ["43.1.f-h", "Subcontratas y velo"]]], ["4 · Cómo se le reclama", [["174 · 124 RGR", "Recaudación · 15 días · 6 meses · 62.2"], ["175", "Solidario: requerir"], ["176", "Subsidiario: tras fallido"]]], ["5 · Muere D. Manuel", [["39", "Herederos · nunca sanciones"], ["39.1 · TEAC", "Derivación notificada: sin sanción · 43.1.a no pasa (TEAC 2026, sin reiterar)"], ["177.1", "Requerimiento · derecho a deliberar"], ["127.1 RGR", "Voluntaria · 5 % antes de la providencia · 10 % o 20 % después"], ["1084-1085 CC", "Pura y simple o beneficio de inventario"]]], ["6 · Se extingue ALBUS", [["40.1", "Socios hasta la cuota + 2 años"], ["40.3-4", "Fusión · comunidades y fundaciones"], ["40.5", "Sanciones sí"], ["177.2", "Cualquier socio o todos"]]]]}, {"id": "historia-resp", "fecha": "2026-11-11", "titulo": "Historia · Responsables y sucesores", "tag": "Historia", "corto": "Responsables y sucesores", "arts": "Arts. 39 a 43, 174 a 177 y 182 LGT · 124 y 127 RGR", "html": "<p>La historia de ALBUS SA y de todos los que acaban pagando sus deudas.<\/p><h4>1 · Alguien más tiene que pagar (41 LGT)<\/h4><p>ALBUS SA tiene una liquidación de IVA: <b>10.000 €<\/b> de cuota, <b>1.000 €<\/b> de intereses y una sanción de <b>5.000 €<\/b>. No paga, entra en ejecutiva y le cae el recargo del 20 %. Hacienda mira alrededor: la ley puede poner, junto al <b>deudor principal<\/b>, a otras personas como <b>responsables<\/b> (<b>41.1<\/b>).<\/p><p>Hay dos clases. El <b>solidario<\/b> va de la mano del deudor: no hace falta declarar fallida a ALBUS, pero sí seguir el procedimiento para declararle responsable y exigirle el pago (175). El <b>subsidiario<\/b> va detrás: solo se le reclama cuando ALBUS y los solidarios han sido declarados <b>fallidos<\/b> (<b>41.5<\/b> y <b>176<\/b>). Si la ley no dice cuál, es <b>subsidiaria<\/b> (<b>41.2<\/b>).<\/p><p><b>¿Cuánto paga un responsable?<\/b> La deuda <b>exigida en voluntaria<\/b> (<b>41.3<\/b>): 10.000 + 1.000 = <b>11.000 €<\/b>. El recargo ejecutivo de ALBUS, <b>no<\/b>. La sanción, solo si la ley lo dice (<b>41.4<\/b>): lo dice en el 42.1.a y c, el 42.2 y el 43.1.a, g y h (<b>182<\/b>); en esos casos, <b>16.000 €<\/b>. Si el responsable no paga en su propio plazo, entonces le caen sus propios recargos e intereses. La excepción es el <b>42.2<\/b>, que sí incluye el recargo y los intereses del ejecutivo (capítulo 3).<\/p><p>Si se le deriva una sanción y da su <b>conformidad<\/b> en la audiencia, tiene la reducción del 188.1.b, y la del 188.3 si además paga a tiempo; en el 42.2, ninguna (<b>41.4<\/b>). Antes del acuerdo de derivación, Hacienda ya puede adoptar <b>medidas cautelares<\/b> e investigar (<b>41.5<\/b>). Y quien paga como responsable puede después reclamárselo a ALBUS por la vía civil (<b>41.6<\/b>).<\/p><div class=\"hbox\"><div class=\"hbox-t\">Para el examen<\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>41 · Reglas de todos los responsables<\/b> · <span class=\"hb-tipo\">regla general<\/span><\/p><p><b>Alcance:<\/b> deuda <b>exigida en voluntaria<\/b> (cuota + intereses de la liquidación), <b>sin los recargos ejecutivos<\/b> del deudor (41.3). Sanciones, solo en el 42.1.a y c, el 42.2 y el 43.1.a, g y h (41.4 y 182).<\/p><p><b>No confundir:<\/b> si la ley no dice nada, es <b>subsidiaria<\/b> (41.2). Solidario: no necesita fallido, pero sí el procedimiento (175). Subsidiario: siempre fallido previo (41.5 y 176). Quien paga puede reclamárselo al deudor (41.6).<\/p><\/div><\/div><h4>2 · Los que van de la mano (42.1 LGT)<\/h4><p><b>a) El que colabora en la infracción.<\/b> El asesor de ALBUS, el Sr. García, le consigue las facturas falsas con las que se dedujo el IVA. Ni es socio ni administrador, pero ha <b>causado o colaborado activamente<\/b> en la infracción: es <b>responsable solidario<\/b> de la deuda <b>y de la sanción<\/b>, <b>16.000 €<\/b>. Hace falta esa participación activa; asesorar mal no basta.<\/p><p><b>b) Los partícipes de una entidad sin personalidad.<\/b> D. Manuel, el administrador de ALBUS, tiene con su hermano una <b>comunidad de bienes<\/b> que alquila un local, al 60 % y al 40 % (una entidad del <b>35.4<\/b>). La comunidad deja sin pagar 5.000 € de IVA. Los dos responden <b>solidariamente<\/b> de las obligaciones materiales de la comunidad, pero <b>en proporción a su participación<\/b>: D. Manuel, hasta 3.000; su hermano, hasta 2.000.<\/p><p><b>c) El que sigue con el negocio.<\/b> D. Manuel crea NUEVA ALBUS SL, que se queda con la tienda, los clientes y los empleados y sigue con la <b>misma actividad<\/b>, mientras ALBUS se queda vacía. NUEVA ALBUS es <b>responsable solidaria<\/b> de las deudas de esa actividad, incluidas las retenciones. No lo sería si solo comprara <b>elementos sueltos<\/b> que no permiten continuar la actividad, ni si lo adquiriera en un <b>concurso<\/b>. Y la herencia de un negocio va por el 39, no por aquí.<\/p><p><b>El certificado (175.2 LGT y 125 RGR).<\/b> Para limitar ese riesgo, NUEVA ALBUS tenía que pedir a Hacienda, <b>antes de adquirir<\/b> el negocio y con la <b>conformidad de ALBUS<\/b>, un certificado de deudas. Si lo pide después de la adquisición, no sirve de nada (125.2).<\/p><p>Hacienda tiene <b>3 meses<\/b>: si el certificado recoge deudas, responde solo de esas; si sale limpio o no llega en plazo, queda <b>exenta<\/b>. Si no lo pidió, responde de todo, incluidas las deudas aún no liquidadas y las <b>sanciones<\/b> (125.4 RGR).<\/p><div class=\"hbox\"><div class=\"hbox-t\">Para el examen<\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>42.1.a · Colaborar en la infracción<\/b> · <span class=\"hb-tipo\">solidaria<\/span><\/p><p class=\"hb-l\">Requisitos<\/p><ol><li>Existe una <b>infracción tributaria<\/b>.<\/li><li>La persona la <b>causa o colabora activamente<\/b> en ella (asesorar mal no basta).<\/li><li>No hace falta ser socio ni administrador.<\/li><\/ol><p><b>Alcance:<\/b> deuda en voluntaria <b>+ sanción<\/b>.<\/p><\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>42.1.b · Partícipes de entes del 35.4<\/b> · <span class=\"hb-tipo\">solidaria<\/span><\/p><p class=\"hb-l\">Requisitos<\/p><ol><li>Entidad <b>sin personalidad<\/b> del 35.4 (comunidad de bienes, herencia yacente…).<\/li><li>Ser <b>partícipe o cotitular<\/b>.<\/li><\/ol><p><b>Alcance:<\/b> obligaciones materiales de la entidad, <b>en proporción a su participación<\/b>. Sin sanciones.<\/p><\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>42.1.c · Sucesión en la actividad<\/b> · <span class=\"hb-tipo\">solidaria<\/span><\/p><p class=\"hb-l\">Requisitos<\/p><ol><li>Suceder en la <b>titularidad o el ejercicio<\/b> de una explotación o actividad económica.<\/li><li>Que permita <b>continuar la actividad<\/b> (no elementos aislados).<\/li><li>No es por herencia (eso es el 39) ni compra en concurso.<\/li><\/ol><p><b>Alcance:<\/b> deudas de esa actividad, <b>incluidas las retenciones<\/b>. Si pidió el <b>certificado<\/b> antes de adquirir (con conformidad del titular, Hacienda tiene 3 meses): solo lo que figure; nada si sale limpio o no llega en plazo. Si no lo pidió: todo, con sanciones (175.2 y 125 RGR).<\/p><\/div><\/div><h4>3 · Los que esconden o desobedecen (42.2 LGT)<\/h4><p>Una regla común para los cuatro: son <b>solidarios<\/b> de la deuda pendiente, las sanciones y, cuando proceda, el <b>recargo y los intereses del periodo ejecutivo<\/b>, pero solo <b>hasta el valor de lo que Hacienda podría haber embargado o vendido<\/b> si no hubieran intervenido.<\/p><p><b>a) Esconder o pasar bienes.<\/b> D. Manuel tiene su propia deuda de IRPF, 300.000 €. Para que Hacienda no la cobre, <b>dona su piso<\/b>, valorado en 200.000 €, a sus hijos, y la familia sigue viviendo en él. Pedro, de 23 años, acepta sabiendo para qué: es <b>responsable solidario hasta 200.000 €<\/b>, no por los 300.000.<\/p><p>Raúl, de 14 años, <b>no<\/b>: el Tribunal Supremo (desde la STS de 25-3-2021) dice que no cabe exigir esta responsabilidad a un <b>menor<\/b>, aunque su representante legal aceptara por él, porque no se le puede atribuir la intención de ocultar. Al margen de lo tributario, Hacienda puede pedir al juez que rescinda la donación (las donaciones se presumen en fraude de acreedores, 1297 CC), y podría haber delito de alzamiento de bienes si concurren sus requisitos.<\/p><p><b>b) Incumplir el embargo por descuido.<\/b> Hacienda embarga a ALBUS lo que le debe su principal cliente. La diligencia llega al cliente, pero su contable no la registra y sigue pagando a ALBUS como siempre. Es <b>culpa o negligencia<\/b>: el cliente responde de lo que pagó y se podría haber embargado.<\/p><p><b>c) Ayudar a levantar lo embargado, a sabiendas.<\/b> Otro cliente de ALBUS también recibe el embargo, pero D. Manuel le llama y acuerdan que pague en la cuenta de un amigo. Aquí no hay descuido: <b>conoce el embargo y colabora<\/b> para que el dinero se escape. Responde hasta lo que desvió. Si el enunciado no deja claro si fue descuido o acuerdo, explica las dos posibilidades.<\/p><p><b>d) El depositario.<\/b> SARUMAN SA guarda en su nave las furgonetas embargadas a ALBUS. Ya notificada del embargo, deja que D. Manuel se las lleve. Como depositario, <b>consiente el levantamiento<\/b> de los bienes: responde hasta su valor. Y si concurren los requisitos, podría ser también malversación (435.3 CP).<\/p><p>Tres reglas propias del 42.2: al recurrir, solo se puede discutir el <b>alcance global<\/b>, no las liquidaciones de ALBUS (<b>174.5<\/b>); el recurso no suspende automáticamente las sanciones (no se aplica el <b>212.3<\/b>); y no hay reducciones del <b>41.4<\/b>.<\/p><div class=\"hbox\"><div class=\"hbox-t\">Para el examen<\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>42.2 · Reglas comunes<\/b> · <span class=\"hb-tipo\">solidaria<\/span><\/p><p><b>Alcance:<\/b> deuda, sanciones, <b>recargo e intereses ejecutivos<\/b>, pero solo <b>hasta el valor de lo que se pudo embargar o enajenar<\/b>.<\/p><p><b>No confundir:<\/b> no hay reducciones del 41.4; al recurrir, solo el <b>alcance global<\/b> (174.5); no se suspende automáticamente la sanción (no 212.3).<\/p><\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>42.2.a · Ocultar o transmitir bienes<\/b> · <span class=\"hb-tipo\">solidaria<\/span><\/p><p class=\"hb-l\">Requisitos<\/p><ol><li>Bienes o derechos del <b>obligado al pago<\/b>.<\/li><li>Su <b>ocultación o transmisión<\/b>.<\/li><li>La persona la <b>causa o colabora<\/b>.<\/li><li><b>Finalidad<\/b> de impedir la actuación de Hacienda.<\/li><\/ol><p><b>No confundir:<\/b> nunca un <b>menor<\/b> (TS, desde 25-3-2021).<\/p><\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>42.2.b · Incumplir la orden de embargo<\/b> · <span class=\"hb-tipo\">solidaria<\/span><\/p><p class=\"hb-l\">Requisitos<\/p><ol><li>Orden de embargo <b>notificada<\/b>.<\/li><li>La <b>incumple<\/b>.<\/li><li>Por <b>culpa o negligencia<\/b>.<\/li><\/ol><\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>42.2.c · Levantar lo embargado<\/b> · <span class=\"hb-tipo\">solidaria<\/span><\/p><p class=\"hb-l\">Requisitos<\/p><ol><li>Bienes <b>embargados<\/b> (o con medida cautelar o garantía).<\/li><li><b>Conoce<\/b> el embargo.<\/li><li><b>Colabora o consiente<\/b> en el levantamiento.<\/li><\/ol><p><b>No confundir:<\/b> b) es descuido; c) es saberlo y colaborar. Si el enunciado no lo aclara, razona las dos.<\/p><\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>42.2.d · Depositarios<\/b> · <span class=\"hb-tipo\">solidaria<\/span><\/p><p class=\"hb-l\">Requisitos<\/p><ol><li>Es <b>depositario<\/b> de los bienes.<\/li><li>Ya ha recibido la <b>notificación del embargo<\/b>.<\/li><li><b>Colabora o consiente<\/b> en el levantamiento.<\/li><\/ol><\/div><\/div><h4>4 · Los administradores (43.1.a, 43.1.b y 43.2 LGT)<\/h4><p><b>a) ALBUS comete una infracción.<\/b> La sanción de 5.000 € viene de un IVA mal declarado cuando D. Manuel era administrador, y él no hizo lo que le tocaba para que se cumpliera. Es <b>responsable subsidiario<\/b>, también de la <b>sanción<\/b>: 10.000 + 1.000 + 5.000 = <b>16.000 €<\/b>, sin los recargos ejecutivos de ALBUS. Responde quien era administrador <b>cuando se cometió la infracción<\/b>.<\/p><p><b>b) ALBUS cierra sin pagar.<\/b> En 2025 D. Manuel deja el cargo y entra D.ª Inés. Meses después, ALBUS <b>cesa en su actividad<\/b> sin liquidarse ordenadamente y con deudas pendientes. Responde el administrador <b>en el momento del cese<\/b> que no hizo lo necesario para pagar o tomó medidas que causaron el impago: D.ª Inés, aunque las deudas sean anteriores a su entrada. Aquí <b>no hay sanciones<\/b>. La gerente, que no es administradora, no responde.<\/p><p><b>43.2 · Presentar sin pagar, una y otra vez.<\/b> Durante un año, ALBUS presenta sus cuatro autoliquidaciones de IVA, 10.000 € cada una, y solo ingresa 10.000 € en total, mientras paga a sus proveedores. El administrador es <b>responsable subsidiario<\/b> de los tributos <b>repercutidos o retenidos<\/b> (IVA y retenciones; el Impuesto sobre Sociedades, no) si: la actividad continúa; la presentación sin ingreso es <b>reiterada<\/b> (la mitad o más de las del año natural, aunque se pidiera aplazamiento); y no hay <b>intención real de pagar<\/b>.<\/p><p>¿Cuentan como «sin ingreso» si pagó algo? Se mira el <b>año entero<\/b>: si lo ingresado <b>no supera el 25 %<\/b> de la suma de las cuotas, sí. Aquí 10.000 de 40.000 es justo el 25 %: cuentan las cuatro. Si hubiera ingresado 10.001 €, ya no se podría usar esta regla para darlas todas por no pagadas, pero eso no lo libra sin más: si pagó esos 10.001 € en el primer trimestre, los otros tres siguen sin ingreso, 3 de 4, y sigue habiendo reiteración si se cumplen los demás requisitos.<\/p><p>Se <b>presume<\/b> que no hay intención de pagar si paga a terceros créditos no preferentes que vencen después. No cuentan las autoliquidaciones con <b>aplazamiento concedido<\/b>, salvo que luego se incumpla, y <b>nunca<\/b> las aplazadas con garantía formalizada.<\/p><div class=\"hbox\"><div class=\"hbox-t\">Para el examen<\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>43.1.a · Administradores e infracción<\/b> · <span class=\"hb-tipo\">subsidiaria<\/span><\/p><p class=\"hb-l\">Requisitos<\/p><ol><li>La sociedad comete una <b>infracción<\/b>.<\/li><li>Era administrador (de hecho o de derecho) <b>cuando se cometió<\/b>.<\/li><li><b>No hizo lo necesario<\/b> para cumplir, consintió el incumplimiento de sus subordinados o tomó acuerdos que lo posibilitaron.<\/li><li><b>Fallido<\/b> previo de la sociedad y de los solidarios.<\/li><\/ol><p><b>Alcance:<\/b> deuda en voluntaria <b>+ sanción<\/b>; sin recargos ejecutivos.<\/p><\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>43.1.b · Administradores al cese<\/b> · <span class=\"hb-tipo\">subsidiaria<\/span><\/p><p class=\"hb-l\">Requisitos<\/p><ol><li>La sociedad <b>cesa en su actividad<\/b> con deudas pendientes.<\/li><li>Es administrador (de hecho o de derecho) <b>en el momento del cese<\/b>.<\/li><li><b>No hizo lo necesario<\/b> para pagar, o tomó medidas que causaron el impago.<\/li><li><b>Fallido<\/b> previo de la sociedad y de los solidarios.<\/li><\/ol><p><b>Alcance:<\/b> deuda en voluntaria, sin recargos (41.3) · <b>sin sanciones<\/b>.<\/p><p><b>No confundir:<\/b> importa quién era administrador al cese, no cuándo se generó la deuda.<\/p><\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>43.2 · Presentar sin pagar<\/b> · <span class=\"hb-tipo\">subsidiaria<\/span><\/p><p class=\"hb-l\">Requisitos<\/p><ol><li>Tributos <b>repercutidos o retenciones<\/b> (IVA sí; Sociedades no).<\/li><li>La actividad <b>continúa<\/b>.<\/li><li>Presentación sin ingreso <b>reiterada<\/b>: la mitad o más de las del año natural; si lo ingresado en el año <b>no supera el 25 %<\/b>, cuentan todas como sin ingreso.<\/li><li><b>Sin intención real de pagar<\/b> (se presume si paga créditos no preferentes que vencen después).<\/li><li><b>Fallido<\/b> previo.<\/li><\/ol><p><b>Alcance:<\/b> esas deudas, sin sanciones.<\/p><p><b>No confundir:<\/b> no cuentan las autoliquidaciones con aplazamiento concedido (salvo incumplimiento) ni, nunca, las aplazadas con garantía.<\/p><\/div><\/div><h4>5 · Más subsidiarios (43.1.c a h LGT)<\/h4><p>Tres que basta con reconocer:<\/p><ul class=\"hl\"><li><b>c)<\/b> los <b>liquidadores<\/b> y la administración concursal que no gestionan el pago de las deudas anteriores<\/li><li><b>d)<\/b> quien adquiere <b>bienes afectos<\/b> por ley al pago de un tributo (79)<\/li><li><b>e)<\/b> los <b>representantes aduaneros<\/b>, pero no por la deuda aduanera.<\/li><\/ul><p><b>f) La subcontrata.<\/b> ALBUS subcontrata el montaje de sus muebles, que es parte de su actividad principal, a MONTAJES SL, y no le pide nada. MONTAJES deja sin ingresar 15.000 € de retenciones de sus trabajadores. ALBUS es <b>responsable subsidiaria<\/b> de las retenciones y tributos repercutidos <b>de la parte de la obra<\/b>, limitada a los <b>pagos hechos sin certificado<\/b> de estar al corriente.<\/p><p>El certificado vale <b>12 meses<\/b>; Hacienda lo expide en <b>3 días<\/b>, salvo si se pide con la declaración de IRPF o Sociedades, que tiene sus propios plazos. ¿Y el administrador de MONTAJES? Solo si cumple los requisitos de otra figura (por ejemplo, el 43.1.a si hubo infracción).<\/p><p><b>g) Levantar el velo.<\/b> D. Manuel controla ALBUS y la usa como su bolsillo: paga sus gastos personales con el dinero de la sociedad y no se distingue qué es de quién. Si se acredita que ALBUS se ha <b>creado o usado de forma abusiva o fraudulenta<\/b> para eludir su responsabilidad frente a Hacienda, con <b>control efectivo<\/b> (o voluntad rectora común) y <b>unicidad de personas o esferas económicas, o confusión o desviación patrimonial<\/b>, D. Manuel responde de las deudas <b>y sanciones<\/b> de ALBUS.<\/p><p><b>h) El velo al revés.<\/b> Ahora el que debe es D. Manuel, por su IRPF, y pone sus bienes a nombre de MANUEL INVERSIONES SL, que él controla y que no tiene otra actividad. Con los mismos requisitos, la <b>sociedad responde de las deudas de D. Manuel<\/b>, también de las sanciones.<\/p><div class=\"hbox\"><div class=\"hbox-t\">Para el examen<\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>43.1.f · Contratas y subcontratas<\/b> · <span class=\"hb-tipo\">subsidiaria<\/span><\/p><p class=\"hb-l\">Requisitos<\/p><ol><li>Contrata o subcontrata obras o servicios de su <b>actividad principal<\/b>.<\/li><li>Tributos <b>repercutidos o retenciones<\/b> del contratista por <b>esos trabajos<\/b>.<\/li><li>Pagos hechos <b>sin certificado<\/b> de estar al corriente (vale 12 meses).<\/li><\/ol><p><b>Alcance:<\/b> la parte de esas obras, limitada a los pagos sin certificado.<\/p><\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>43.1.g · Levantamiento del velo<\/b> · <span class=\"hb-tipo\">subsidiaria<\/span><\/p><p class=\"hb-l\">Requisitos<\/p><ol><li><b>Control efectivo<\/b> o voluntad rectora común.<\/li><li>Sociedad <b>creada o usada de forma abusiva o fraudulenta<\/b> para eludir su responsabilidad frente a Hacienda.<\/li><li><b>Unicidad<\/b> de personas o esferas económicas, o <b>confusión o desviación patrimonial<\/b>.<\/li><\/ol><p><b>Alcance:<\/b> deudas <b>y sanciones<\/b> de la sociedad.<\/p><p><b>No confundir:<\/b> <b>h)<\/b> es al revés: la sociedad responde de las deudas de quien la controla. <b>c)<\/b> liquidadores, <b>d)<\/b> bienes afectos y <b>e)<\/b> representantes aduaneros: basta reconocerlos.<\/p><\/div><\/div><h4>6 · Cómo se declara (174 a 176 LGT y 124 RGR)<\/h4><p><b>Quién y cuándo.<\/b> El <b>órgano de recaudación<\/b> (<b>174.2<\/b>), en cualquier momento <b>después de la liquidación<\/b> o de presentar la autoliquidación (<b>174.1<\/b>). Si es el inspector quien descubre al responsable, avisa a recaudación; la audiencia va después del acta y la declaración después de la liquidación (196 RGAT).<\/p><p><b>Cómo.<\/b> A D. Manuel se le notifica el <b>acuerdo de inicio<\/b>; tiene una <b>audiencia de 15 días<\/b> (y puede alegar antes, <b>174.3<\/b>), y Hacienda debe notificarle la resolución en <b>6 meses<\/b> (<b>124.1 RGR<\/b>). Esa notificación lleva (<b>174.4<\/b>):<\/p><ul class=\"hl\"><li><b>a)<\/b> el <b>texto íntegro<\/b> del acuerdo, con el presupuesto de hecho y las liquidaciones<\/li><li><b>b)<\/b> los <b>recursos<\/b>, ante quién y en qué plazo<\/li><li><b>c)<\/b> el <b>lugar, plazo y forma<\/b> de pago.<\/li><\/ul><p><b>Plazo para pagar<\/b> (<b>174.6<\/b>): el del <b>62.2<\/b>. Se le notifica el 18 de marzo de 2025 (segunda quincena): tiene hasta el <b>5 de mayo<\/b>. Si no paga, apremio, con el recargo del 28.<\/p><p><b>Solidarios<\/b> (<b>175.1<\/b>): si al Sr. García se le declaró responsable <b>antes<\/b> de que acabara la voluntaria de ALBUS, basta con <b>requerirle el pago<\/b> cuando acabe; si no, se dicta el acto de declaración después. <b>Subsidiarios<\/b> (<b>176<\/b>): primero hay que declarar <b>fallidos<\/b> a ALBUS y a los solidarios (61 RGR; vale la insolvencia parcial, 124.4). Por eso el orden es siempre: solidarios primero, subsidiarios después.<\/p><p><b>Recurso<\/b> (<b>174.5<\/b>): D.ª Inés puede discutir el presupuesto de hecho <b>y las liquidaciones<\/b>. Si aporta las facturas de IVA soportado que ALBUS nunca presentó, su deuda baja, pero solo la <b>suya<\/b>: no se revisan liquidaciones firmes para otros. Si un responsable pide aplazamiento o suspensión, eso no frena el cobro a los demás (124.2). Las medidas cautelares adoptadas antes de la derivación siguen las reglas del 81 que ya vimos (6 meses, salvo excepciones).<\/p><div class=\"hbox\"><div class=\"hbox-t\">Para el examen<\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>174 a 176 · Cómo se declara<\/b> · <span class=\"hb-tipo\">procedimiento<\/span><\/p><p class=\"hb-l\">Requisitos<\/p><ol><li>Lo declara el <b>órgano de recaudación<\/b> (174.2), después de la liquidación (174.1).<\/li><li>Subsidiario: antes, <b>fallido<\/b> del deudor y de los solidarios (176). Solidario: si se le declaró antes del fin de la voluntaria, basta <b>requerirle<\/b> (175).<\/li><li><b>Acuerdo de inicio<\/b> notificado, <b>audiencia de 15 días<\/b> y resolución en <b>6 meses<\/b> (124 RGR).<\/li><li>Notificación con el texto íntegro, los recursos y el lugar, plazo y forma de pago (174.4).<\/li><li>Paga en el plazo del <b>62.2<\/b>; si no, apremio con los recargos del 28 (174.6).<\/li><\/ol><p><b>No confundir:<\/b> en el recurso se discuten el presupuesto de hecho y las liquidaciones; en el 42.2, solo el alcance (174.5).<\/p><\/div><\/div><h4>7 · Cuando muere D. Manuel (39 y 177.1 LGT, 127 RGR)<\/h4><p>D. Manuel muere. Sus hijos ya no son responsables, sino <b>sucesores<\/b>: ocupan su lugar y no hace falta ningún acto de derivación. Sus deudas pendientes pasan a sus <b>herederos<\/b>, y a los legatarios si la herencia se reparte en legados o el legado es de una parte alícuota (<b>39.1<\/b>). Pasan aunque aún no estuvieran liquidadas (<b>39.2<\/b>).<\/p><p>Lo que <b>nunca<\/b> pasa son sus <b>sanciones<\/b> (39.1 y 182.3). ¿Y lo que debía como responsable? Solo pasa si la derivación se le notificó <b>antes de morir<\/b>, y aun así hay dos límites. Su parte de la deuda de la comunidad de bienes (capítulo 2) ya estaba notificada: pasa a los hijos. Pero ninguna <b>sanción<\/b> incluida en una derivación pasa nunca (TEAC 10-12-2024).<\/p><p>Y su responsabilidad del <b>43.1.a<\/b> por la infracción de ALBUS, los 16.000 €, <b>no pasa en absoluto<\/b>, ni la cuota ni la sanción: según el TEAC (30-4-2026), que la considera de naturaleza sancionadora. Es un criterio aún no reiterado, no una regla escrita en la LGT. Mientras la herencia está <b>yacente<\/b>, Hacienda actúa con su representante y cobra con sus bienes (<b>39.3<\/b>).<\/p><p><b>El cobro continúa<\/b> (<b>177.1<\/b>) con solo constatar la muerte y notificar a los herederos con el requerimiento de pago. Si Pedro alega el <b>derecho a deliberar<\/b>, se espera a que acabe ese plazo. El plazo y el recargo dependen del momento de la muerte (<b>127.1 RGR<\/b>):<\/p><ul class=\"hl\"><li><b>a)<\/b> en voluntaria → plazo del <b>62.2<\/b><\/li><li><b>b)<\/b> en ejecutiva antes de la providencia → se notifica la providencia a los herederos, y si pagan antes, recargo del <b>5 %<\/b><\/li><li><b>c)<\/b> con la providencia notificada y el plazo del 62.5 abierto → <b>10 %<\/b> pagando en ese plazo<\/li><li><b>d)<\/b> con ese plazo vencido → <b>20 %<\/b>.<\/li><\/ul><p>¿Puede Hacienda pedírselo todo a Pedro? Hecha la partición, a un heredero que aceptó <b>pura y simplemente<\/b> se le puede reclamar la deuda entera; si aceptó <b>a beneficio de inventario<\/b>, solo hasta lo que heredó (1084 CC). El que paga más de su parte se lo reclama a su hermano (1085 CC). Y antes de reclamar nada, Hacienda comprueba la <b>prescripción<\/b> (66 a 68): en el examen de 2026 una de las deudas estaba prescrita.<\/p><div class=\"hbox\"><div class=\"hbox-t\">Para el examen<\/div><div class=\"hb-f\"><p class=\"hb-h\"><b>39 y 177.1 · Muere el deudor<\/b> · <span class=\"hb-tipo\">sucesión<\/span><\/p><p class=\"hb-l\">Requisitos<\/p><ol><li>Muere una <b>persona física<\/b> con deudas pendientes.<\/li><li>Las heredan los <b>herederos<\/b> (y los legatarios en los casos del 39.1), aunque no estuvieran liquidadas.<\/li><li>Se constata la muerte y se les <b>notifica el requerimiento<\/b> de pago (177.1); el derecho a deliberar lo suspende.<\/li><\/ol><p><b>Alcance:<\/b> recargo según el momento (127.1 RGR): voluntaria → plazo del 62.2 · ejecutiva antes de la providencia → 5 % si pagan antes de notificársela · providencia notificada y plazo del 62.5 abierto → 10 % · vencido → 20 %. Con beneficio de inventario, solo hasta lo heredado.<\/p><p><b>No confundir:<\/b> <b>nunca pasan las sanciones<\/b>. Las responsabilidades del fallecido solo si la derivación ya estaba notificada, y sin la parte de sanción; la del 43.1.a no pasa (criterio TEAC 2026, sin reiterar).<\/p><\/div><\/div><h4>8 · Cuando ALBUS se disuelve (40 y 177.2 LGT)<\/h4><p>Al final, ALBUS se <b>disuelve y se liquida<\/b>. Como en una SA los socios tienen la responsabilida
